, and new data showing truckload contract rates resetting more than 10% higher.", "items": [{"n": 1, "id": "2026-10-25#1", "headline": "FERC orders grids to connect data centers within 90 days, make them pay their own way, and justify large-load pricing", "theme": "Energy & AI Data Centers", "source": "EnergyNow.com", "summary": "On a Thursday in June 2026 (likely around June 18; date unconfirmed), the Federal Energy Regulatory Commission approved a set of orders meant to speed grid connections for AI data centers. Grids are being pushed to handle hyperscaler connection requests within 90 days, a process that today can take years. Data centers must pay for their own power and be flexible in their consumption, and utilities must disclose the cost of adding major new customers. Grids serving almost two-thirds of the US population must report within 30 days on whether there is enough power for data center demand, and within 60 days must justify or revise their pricing structures for new facilities.", "rq": "The 30- and 60-day compliance filings will reveal how different grid operators interpret 'flexible' large load and cost causation. That cross-sectional variation could be coded and compared. · Model a queue with priority or fast-track service for large loads. Who bears the delay externality, and how does the effect change when customers can submit speculative requests? · Interruptible-load contracts and time-of-use pricing offer a ready model family for designing what 'flexibility' should mean for a data center.", "problem": "The orders try to do two things that pull against each other: connect very large loads quickly, and stop existing ratepayers from carrying the cost of the new generation and transmission those loads require. A 90-day connection target squeezes the time available for studying capacity adequacy and reliability. Requiring data centers to be 'flexible' moves part of the reliability burden onto the customer, but what flexibility means in practice, and how it will be priced, is still unclear.", "related": ["Electricity Time‐of‐Use Tariff with Stochastic Demand"], "keywords": ["interconnection policy", "large-load tariffs", "data center electricity demand", "interruptible load", "federal-state jurisdiction"], "datasets": ["ferc_elibrary", "lbnl_queues"], "thread": null}, {"n": 2, "id": "2026-10-25#2", "headline": "SpaceXAI unit faces up to about $6.1M in Mississippi stormwater penalties as NAACP turbine suit survives DOJ dismissal bid", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "In a quarterly SEC filing (dated October 23, 2026, per DCD), SpaceX disclosed that the Mississippi Department of Environmental Quality is seeking penalties of 'up to $25,000 per day' from subsidiary MZX Tech LLC. MDEQ alleges construction began before the sites were covered by the state's Large Construction Stormwater General Permit; estimated exposure is about $6.1 million across three sites. The company says it is cooperating and negotiating a single agreed order. Separately, US District Judge Debra Brown rejected the Justice Department's motion to dismiss an NAACP lawsuit over a gas-fired plant in Southaven, Mississippi, which the NAACP says was built and run without the required permits.", "rq": "Treat this as a real-options problem: when does the value of starting construction early exceed the expected penalty, given a per-day penalty cap and a probability of detection? · Compare permit-to-construction lags and violation rates for data center projects across neighboring states or on either side of a state border. · SEC filings as an enforcement disclosure channel: do firms disclose environmental notices of violation at different times than local media report them?", "problem": "Developers racing for AI compute appear to be weighing speed-to-capacity against compliance: building before permits are in place and generating power on site with gas turbines. The roughly $6.1M is a maximum preliminary figure, not a final fine, which raises the question of whether such penalties are large enough to deter. The litigation tests whether national-security and economic arguments can shield fast-built AI infrastructure from citizen enforcement.", "related": ["Efficient Detection of Environmental Violators: A Big Data Approach"], "keywords": ["regulatory enforcement", "facility siting", "litigation risk", "state environmental policy", "data center electricity demand"], "datasets": ["sec_edgar", "eia860"], "thread": null}, {"n": 3, "id": "2026-10-25#3", "headline": "Korean pig farms' use of food-waste feed rises 2.7x in 20 months, prompting calls for a ban over ASF risk", "theme": "Circular Economy", "source": "헤럴드경제", "summary": "Agriculture Ministry data provided to lawmaker Song Ok-joo for the parliamentary audit, reported October 24, show food-waste feed supplied to pig farms rose from 66.5 tonnes in December 2024 to 176.4 tonnes at the end of August 2026. That is a 165.3% increase, about 2.7 times. The number of farms using it went from 5 to 18, and the number of pigs fed it from 9,279 to 22,204. Song notes that all 18 farms have been inside African swine fever movement-restriction zones in 2025 or 2026, and is pushing for tighter inspection of feed makers; the headline says a ban law is being pursued.", "rq": "The 2019 ban, the 2024 re-permission and the 2027 dog-meat ban form a sequence of policy switches. Look for how waste flows and feed volumes reallocate across outlets after each one. · A waste-hierarchy tradeoff with tail risk: compare expected disposal-cost savings against the outbreak externality, which is low-probability but high-loss. · Compare with jurisdictions that ban swill feeding outright, such as the EU, versus those with conditional heat-treatment regimes.", "problem": "Turning food waste into feed is a textbook circular reuse pathway, but it creates a pathway for disease transmission. A coming policy shock, the dog-meat ban, may redirect a waste stream toward pig farms at the same time that the farms using the feed are concentrated in ASF-risk zones. Regulators must choose between conditional use with inspection and an outright ban.", "related": [], "keywords": ["secondary materials", "food safety recalls", "regulatory enforcement", "biosecurity risk"], "datasets": [], "thread": null}, {"n": 4, "id": "2026-10-25#4", "headline": "Unverified: Guinea's proposed 150Mt bauxite export cap looms over aluminium outlook", "theme": "Critical Minerals & Batteries", "source": "AL Circle", "summary": "The original AL Circle Q4'26 outlook could not be retrieved, so its arguments, including anything about US tariffs, are unverified. Related AL Circle coverage seen only in search results says Guinea's proposed 150Mt bauxite export cap could leave the market about 33Mt short. Guinea exported a record 114.8Mt in the first half of 2026, and China's bauxite imports rose 17.5% in that half even though China caps aluminium capacity at 45Mt.", "rq": "The record first-half 2026 exports alongside the reported cap plans look like possible pre-buy behavior ahead of a quantity restriction. That pattern is worth checking in monthly trade data. · Compare with earlier mineral export bans, such as Indonesia's nickel ore ban, to see how importers diversified their sources or stockpiled.", "problem": "A single supplier country dominates a key input for the world's largest aluminium producer and is considering a quantity cap. Downstream refiners face a choice between stockpiling before the cap and diversifying to other bauxite sources, under uncertainty about whether and when the cap applies.", "related": ["Global operations and supply‐chain management under the political economy", "Impact of the U.S.–China trade war on the operating performance of U.S. firms: The role of outsourcing and supply base complexity"], "keywords": ["raw material security", "supplier concentration", "pre-buy behavior", "export controls"], "datasets": ["un_comtrade", "usgs_minerals"], "thread": null}, {"n": 5, "id": "2026-10-25#5", "headline": "New SONAR index shows truckload contract renewals running about 13% above prior rates", "theme": "Supply Chain Resilience", "source": "FreightWaves", "summary": "FreightWaves' new Contract Rate Change Direction index (CRCD.USA) stood at 13.11% on October 22, 2026, up from 3.53% a year earlier. In other words, shippers renewing truckload contracts are paying about 13% more than under the contracts they replaced. Tender rejection rates have averaged close to 13% in recent months after rising above 9% almost a year ago. The separate index of average contract rates actually paid (VCRPM1) suggests the increases are sticking this time.", "rq": "Relational contracting lens: high tender rejections are a form of reneging on a relational contract. When does a rate reset restore compliance? · Exploit the contrast between 2025 and 2026: same kind of contract resets, different follow-through. What market conditions separate increases that stick from those that don't? · Lead-lag dynamics between tender rejections, contract resets and rates actually paid can be modeled with vector autoregressions (VARs) or as a contract-versus-spot portfolio problem.", "problem": "Shippers must decide how to reprice and allocate freight between contract and spot markets as capacity tightens. The 2025 episode shows that agreed contract rates and rates actually paid can diverge. Shippers can move freight to other carriers in their routing guide, and carriers can reject tendered loads, so a headline rate increase may not hold. Carriers' migration to more profitable contracts should ease increases, but slow capacity growth may delay that.", "related": ["Great Expectations: The Moderating Effects of Supplier Service Model and Market Dynamics on Relational Contract Performance"], "keywords": ["freight rates", "tender rejection", "cost pass-through", "long-term supply contracts"], "datasets": ["freight_rates"], "thread": null}], "papers": [], "also": [{"title": "Amid Iowa’s Water Crisis, Factory Farms Get a Pass on Environmental Permitting", "url": "https://insideclimatenews.org/news/25102026/iowa-factory-farms-manure-water-pollution/", "source": "Inside Climate News"}, {"title": "UAE plans up to five alternative food supply sources to safeguard against disruptions", "url": "https://news.google.com/rss/articles/CBMizwFBVV95cUxPSUFGVDdsbHNmdVU1Zi1nSDdnUi1xUEFoOTRLeGRBMk5vdmdzNkowRGlrNFBwRnpiMVRIc3EyblhCaXBMUDlTcC1IRjRaYXRDM2tMUXN0OE9DMTdqYWF0dVZ5ZUdNUjRyRXNUSllSVjAwdkNwa3hrSS0zemRZTDNtbHZNRnhMNTY5czl1YjFtLVBzZUlKRGxmZUtaeGswWTBDT09GT1BSX1A0Vmg4WUYtaG1Sek9pYTdsN2VHRlpPdzFUYi1SNnZ2Vmx4NGpRajTSAeIBQVVfeXFMTWNPNktuVWljemFCcTkzcUR6VW4zWTh2cU9yblhqYjF4OUg4RjlsMzkzc3RRcWhmRUNrNVdabzM2Y2hYc3FvMGl4dk9DSVlWbU9GYnhjOW5pc2U5RlRiREgtZTJwX2l6cGFPV2JYcVF4TFQ2bVZScjJRR2ZGVjdNWnl5VDJrWUpNU3F4X20zVE84dUVlbzE4TmFXN1NLOUswNS1GVV9FMjVRTkMtR2hqd0ZJOWZmVWRhTzBSbGFaeEpLUW8xWXRKdTdNZ21nUWp5ZmVMZTNOMkFkSzNyQWd0QjZQdw?oc=5", "source": "Gulf News"}, {"title": "US to Tap Petroleum Reserve for 400,000 Barrels in Exchange to Shore Up Louisiana Refinery", "url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxOUHpOVm5GV19uVHlmX3dQSVZCS2VnajEzSXhmbGgyVG9hM0VPbXZDWE9vdGhmeGQ4OXF3WVU4WThsRUw1dVFPZk5Zd2VOVHluNlRLSXJtWjVQNTBaMzF0S2JIXzNGRkQtX3lVczhJTm4zVEZUeXAtRVFWWER6d0NsSU9UU3g5ZGo3RmoyTjU0ck9TOGkzNFBJUEVadElwcUF5LVB1NUsxVFo0cFl6TDdGTnlXMEE0cEljSHNOZ09lWQ?oc=5", "source": "NTD News"}, {"title": "ECTA refutes EUDR exclusion concerns, says over 99% of coffee farms deforestation-free", "url": "https://news.google.com/rss/articles/CBMiwgFBVV95cUxQYnVrMGtwNGZma2tLQWRYVHFTQ1hWeUlMLXRCdE9DTWpjWWFmSHlHbTF3S2hyZ3paSXNlckp3RnhadklkR0QzTnpRNkwtMFpleGtLcFpSQ01fZ3k5UFN5UDZKRl9vSm92djJveFgwX0xtT2hPX3dKN0JwVTRidk9UeDg1NlZLa1NhUGMteEQ4NmhLX2Q0SEt5MkQ3eVhSdnVGRUVzRE5HZkpldndCdlk0NllYV3FPM1pTc01yaWp2OXM1dw?oc=5", "source": "Capital Newspaper"}, {"title": "Truck Makers Prep 0.035-Gram NOx Engines for 2027 EPA Standards", "url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxQcTN4U0YyLWJIMmxGYjk2LTNlN01DNzdfakJfTFRqNWVFOWJjNGRvZmFkbmxWZEdPdERwNjFkQkVXNWMtQ0ViTU1DWDF2Xzcta1RSWm9DVllVWEMtMC1NNWlfWTF4T1dNQXVkdEZvOTg4UjJJN3I5bUFSR2xBcVBrT3B2Qk1GdHc4cFJTUkRPVVRqc0hKcURnWl9yOWFWMlF1LVhWWDVQZTJ2UU1Sb1JmSjUtRTJ2c0JZYVh3Yi1faw?oc=5", "source": "Commercial Carrier Journal"}]}, {"date": "2026-10-24", "intro": "Today's issue opens with a sharp siting shock: Oregon's pause on data center permits has led one eastern Oregon city to declare a fiscal emergency. Also: a talks-not-tariffs outcome for wind turbine imports, helium's new critical-material status during a Hormuz-driven shortage, a citizen-science map of North Carolina's secret poultry farms, and port-level data on decoupling emissions from cargo growth.", "items": [{"n": 1, "id": "2026-10-24#1", "headline": "Umatilla, Oregon declares fiscal emergency over Gov. Kotek's pause on data center permits", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "The week of Oct 20, 2026, the Umatilla City Council voted 5 of 6 members present to declare a local state of emergency over \"the threat of widespread financial loss.\" The trigger is Gov. Tina Kotek's October directive, which stops Oregon DEQ from issuing new air and water permits for new or expanding data centers until July 2027. The city estimates more than $5 billion in regional investment could be delayed or lost, along with about $6 million in direct city losses, up to $12 million in water infrastructure investments and community-benefit payments, and at least 1,000 construction jobs.", "rq": "Treat the pause as a dated policy shock. Do planned Oregon projects relocate to neighboring states (e.g., Washington, Idaho), get delayed, or get cancelled? A difference-in-differences design using announced-project trackers could test this. · View the dispute as federal-state-local jurisdictional conflict over a gating permit, and compare it with other siting moratoria. · Consider a real-options model of capacity timing when the regulatory end date is known but a legislative regime change is pending.", "problem": "The state frames the pause as protecting public health and natural resources. Host communities have built their budgets and water infrastructure around data center payments and say projects could slip by two years or more. The resolution asks Kotek to withdraw or change the directive and calls for an economic impact assessment. It also lets City Manager Dave Stockdale coordinate with other local governments on possible legal action. He questions whether the pause exceeds DEQ's authority, violates the Administrative Procedures Act, or infringes Home Rule.", "related": ["Diversify or Concentrate? Supply Chain Responses to Policy Uncertainty", "Creating the competitive edge: A new relationship between operations management and industrial policy"], "keywords": ["siting moratorium", "regulatory uncertainty", "facility siting", "data center electricity demand", "federal-state jurisdiction"], "datasets": ["eia861", "state_puc"], "thread": null}, {"n": 2, "id": "2026-10-24#2", "headline": "Trump opts for 180 days of trade talks instead of tariffs after wind turbine Section 232 probe", "theme": "Trade & Industrial Policy", "source": "Supply Chain Dive", "summary": "On Oct 22, 2026, Trump signed a proclamation closing the Section 232 investigation into wind turbine imports that Commerce opened in August 2025. Rather than imposing new tariffs, it directs Commerce Secretary Howard Lutnick and USTR Jamieson Greer to open or continue talks with trading partners and to report progress within 180 days. Existing steel, copper and aluminum tariffs that hit some turbine parts stay in place.", "rq": "Look for pre-buy behavior: do turbine and inverter imports spike during the 180-day window compared with the aircraft-probe precedent? · Tariff threat versus realized tariff: model sourcing under a regime-switching tariff process, building on tariff-hedging supplier development models. · Cybersecurity-based sourcing restrictions on inverters may matter more than tariffs. Which components face non-price barriers?", "problem": "Developers and turbine OEMs face an open-ended threat. Trump said other remedies may follow depending on the talks. It is unknown which countries will take part or what happens if talks fail. Firms must decide whether to pull forward imports, qualify domestic or alternative suppliers, or wait.", "related": ["Tariff Hedging with a New Supplier? An Analysis of Sourcing Strategies Under Competition", "Shock and Awe: A Theoretical Framework and Data Sources for Studying the Impact of 2025 Tariffs on Global Supply Chains"], "keywords": ["pre-buy behavior", "regulatory uncertainty", "sourcing restrictions", "cyber-physical risk", "supplier diversification"], "datasets": ["usitc_dataweb", "eia860"], "thread": null}, {"n": 3, "id": "2026-10-24#3", "headline": "DOE designates helium a critical material amid Hormuz-driven shortage", "theme": "Critical Minerals & Batteries", "source": "CBS News", "summary": "Around Oct 23, 2026, the Energy Department named helium a critical material, opening more federal financing to helium producers. The announcement came days after a 60 Minutes segment on the shortage. Energy Secretary Chris Wright cited helium's essential role in semiconductors and advanced energy technologies. Helium is the 20th critical material; the previous addition was metallurgical coal in 2025.", "rq": "Byproduct economics: how does supply respond to a price spike when helium is co-produced with natural gas or LNG? Compare with other byproduct critical materials. · Use the designation date as an event: do helium-dependent firms change their disclosures or inventory policies? · Use a critical-node or chokepoint network lens to explain why domestic production share understates exposure.", "problem": "Supply is geographically concentrated and has no substitutes in key uses. Large domestic production has still not shielded U.S. users from a global chokepoint shock. The designation adds financing, but the amount and timing are unspecified. CBS attributes the timing to its own report, which is unverified.", "related": ["Theorizing Critical Locus of Supply: A Material Flow Perspective", "Perspectives on risk management in supply chains"], "keywords": ["chokepoint disruption", "raw material security", "industrial policy", "supplier concentration"], "datasets": ["usgs_minerals", "un_comtrade"], "thread": null}, {"n": 4, "id": "2026-10-24#4", "headline": "Citizen scientists map North Carolina's confidential industrial poultry farm locations", "theme": "Food & Agriculture", "source": "Inside Climate News", "summary": "Three nonprofits — CleanAIRE Carolina, the Rural Empowerment Association for Community Help, and the N.C. Environmental Justice Network — launched the 'E-I-E-I-O No!' project on Zooniverse on July 28, 2026. More than 1,600 volunteers identified farms on NC One Map satellite imagery, and the results are being checked by in-person site visits. So far, six counties have yielded 2,011 hog farms and 2,349 poultry farms.", "rq": "Treat the crowdsourced map as a new disclosure shock. Does public mapping change complaints, enforcement, or farm expansion? · Chain liability: would processors' reputational exposure grow once supplier farm locations become public? · Compare with hog CAFOs, which are permitted, to examine how disclosure regimes differ within one state.", "problem": "Without location data, regulators and communities cannot attribute pollution or odor to sources, as the misattributed complaint shows. Researchers also cannot link farm density to environmental or health outcomes. The project fills this gap from outside the state system. Whether the full map will be published, and how industry and the state respond, could not be confirmed.", "related": ["Chain liability in multitier supply chains? Responsibility attributions for unsustainable supplier behavior", "Switching the Telescope Lens: A Sociomaterial Perspective of Sustainable Agricultural (Proto)Practices Transfer in an Agrifood Supply Chain"], "keywords": ["voluntary disclosure", "multi-tier traceability", "state environmental policy", "regulatory enforcement"], "datasets": ["usda_nass"], "thread": null}, {"n": 5, "id": "2026-10-24#5", "headline": "Port of Los Angeles reports record-low emissions per container as volumes near 10.2M TEUs", "theme": "Logistics Decarbonization", "source": "Breakbulk.News", "summary": "The port's 2025 Inventory of Air Emissions, released Oct 22, 2026, shows its lowest emissions per container on record while it handled nearly 10.2 million TEUs. From 2024 to 2025, diesel particulate matter fell 2%, NOx 4% (the lowest since tracking began in 2005), sulfur oxides 5% and greenhouse gases 3%. Since 2005, diesel particulate matter is down 90%, NOx 72%, sulfur oxides 98% and greenhouse gases only 16%, while container volumes rose 37%.", "rq": "Decompose the emissions change into scale, mix and technique effects by source category; the GHG versus NOx gap is the puzzle. · Fleet turnover models: what drives the adoption rate of zero-emission cargo-handling equipment among terminal operators? · Compare the Port of Long Beach's inventory, or ports without similar programs, to estimate the effect of the Clean Air Action Plan.", "problem": "Criteria pollutants have fallen steeply, but greenhouse gases are down only 16% since 2005. Engine standards and fuel rules cut local pollutants without deeply decarbonizing. Zero-emission equipment is still only 14% of the cargo-handling fleet. All figures are self-reported by the port.", "related": ["Accelerating vehicle fleet turnover to achieve sustainable mobility goals", "Shipping Emission Control Area Optimization Considering Carbon Emission Reduction"], "keywords": ["fleet turnover", "emissions standards", "maritime policy", "emissions forecasting"], "datasets": ["noaa_ais"], "thread": null}], "papers": [{"title": "Bargaining and Contract Forms in Distribution Channels: Why Do Slotting Fees Arise and Linear Contracts Persist?", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2025.03426"}], "also": [{"title": "Alabama’s New Data Center Rules Still Leave Customers in the Dark, Critics Say", "url": "https://insideclimatenews.org/news/23102026/alabamas-new-data-center-rules-still-leave-customers-in-the-dark-critics-say/", "source": "Inside Climate News"}, {"title": "Levi’s distribution network transition saga continues to drag", "url": "https://www.supplychaindive.com/news/levis-distribution-network-transition-saga-continues-to-drag/833749/", "source": "Supply Chain Dive"}, {"title": "58,000 S’wak oil palm smallholders risk losing EU market access, says Nanta", "url": "https://news.google.com/rss/articles/CBMi0AFBVV95cUxNbHM1WWlCQmI3TnRUVmhCY2I5U3MxeWVFRDFtbHVFWTJsZk1OQUdsODhhWmtNcWVyamVULWhYRUcwcE9jY1FfRGc5UGdVU2hTejFGLTJfNk91eldLVFlGTGlmdDhCUjh1Y0RuMkN5OEFJekFvWlJyWEJsWnN2MXZmeGRZSTJ4UUdoenZkTnhJM3BrWXhqV2tsek5oLW9Fd3d2MjdKZXZ1bVlxUzN4X1pEdFNqbWlYdWo3VEp5Mm5yMFJmRGlOOEI2MUVNNmd4VVF2?oc=5", "source": "Free Malaysia Today"}, {"title": "Citi closes ‘first-of-its-kind’ $72M bond for biochar project", "url": "https://www.esgdive.com/news/citi-closes-first-of-its-kind-72m-bond-for-biochar-project/833859/", "source": "ESG Dive"}, {"title": "Chart: A record two-thirds of car sales in China are now electric vehicles", "url": "https://www.carbonbrief.org/chart-a-record-two-thirds-of-car-sales-in-china-are-now-electric-vehicles", "source": "Carbon Brief"}]}, {"date": "2026-10-23", "intro": "Today's issue covers a hyperscaler buying demand flexibility instead of new generation in PJM, the ISSB's first draft on nature-related disclosure, an EU settlement over plastic-bottle recycling claims, a consumer-goods firm spending court-ordered tariff refunds on inventory and packaging, and paper and packaging mills passing diesel costs on to customers. Two new POM papers round it out: one on spillovers from renewable portfolio standards, one on selling unpackaged perishables.", "items": [{"n": 1, "id": "2026-10-23#1", "headline": "Google expands Voltus deal to roughly 1GW virtual power plant in PJM", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "On Oct. 22, 2026, Google and Voltus announced a Google-funded virtual power plant (VPP) in the PJM Interconnection region. Utility Dive reports it adds 1,070MW to a 100MW deal signed in June 2026, for roughly 1.17GW in total, which Google calls a \"tenfold\" expansion. Google describes it as \"one of the largest known distributed capacity portfolios deployed by a hyperscaler to date.\" Financial terms were not disclosed. On duration, DCD reports about three years, but a Voltus spokesperson told Utility Dive the VPP ramps up over three to four years and then runs under contract with Google through 2040.", "rq": "Think of the VPP as a portfolio of unreliable small suppliers: models of random yield and supplier diversification may carry over to aggregated demand response. · Compare the economics of contracted flexibility with long-term power purchase agreements: who bears volume risk, and over what horizon (note the conflicting reports on whether the term is about three years or through 2040)? · The 240% jump in PJM demand response revenue alongside data center growth invites a look at how capacity prices drive demand response supply.", "problem": "Hyperscalers need firm capacity faster than new generation and transmission can be built. The open question is whether contracted, aggregated demand flexibility from third parties can credibly stand in for physical capacity backing a large new load. Doing so shifts reliability risk onto thousands of small participants whose availability and response are uncertain.", "related": ["Redesign of Virtual Power Plant-led Electricity Demand Response Program", "A Deep Demand Response Program for Local Electricity Systems"], "keywords": ["demand response", "capacity markets", "data center electricity demand", "interconnection queues", "grid reliability standards"], "datasets": ["pjm_data", "eia861"], "thread": null}, {"n": 2, "id": "2026-10-23#2", "headline": "ISSB publishes first exposure draft on nature-related disclosures, open for comment until Feb. 19, 2027", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "On Oct. 22, 2026, the ISSB released its first exposure draft of nature-related disclosure requirements, framed as a non-mandatory IFRS Practice Statement rather than a standard. It would cover how nature-related risks feed into strategy, how resilient the business model is to them, the amount and percentage of assets or activities exposed, and nature targets including location-specific aspects. Comments are open until Feb. 19, 2027.", "rq": "Jurisdiction-by-jurisdiction adoption of a voluntary statement could create staggered treatment useful for difference-in-differences designs. · Compare with climate disclosure: did scope 3 reporting push firms to map and change suppliers, and would nature metrics do the same? · Event studies around ISSB milestones (draft release, comment deadline, final decision on mandatory status) for firms in nature-dependent sectors.", "problem": "Biodiversity and ecosystem dependencies are location-specific and usually sit deep in supply chains, so meaningful disclosure requires traceability many firms lack. The consultation itself asks whether nature content should be a voluntary practice statement or a standalone mandatory standard. That leaves firms and investors unsure how much to invest in data systems now.", "related": ["Supply Chain Carbon Footprinting and Climate Change Disclosures of Global Firms", "Shareholder Wealth Effects of Modern Slavery Regulation"], "keywords": ["nature-related disclosure", "biodiversity risk", "multi-tier traceability", "voluntary disclosure", "regulatory uncertainty"], "datasets": ["cdp", "sec_edgar"], "thread": null}, {"n": 3, "id": "2026-10-23#3", "headline": "Coca-Cola, Nestlé and Danone agree to change EU plastic-bottle recycling claims after consumer-group complaint", "theme": "Circular Economy", "source": "ESG Today", "summary": "On Oct. 22, 2026, the European Commission announced that Coca-Cola, Nestlé and Danone have agreed to change recycling claims on plastic bottles sold in the EU. The agreement followed talks with the Commission and the CPC network of national consumer authorities, reportedly led by Sweden and Hungary. \"100% recycled\" and \"100% recyclable\" claims must now say they exclude the cap and label. The firms also agreed not to imply a closed recycling loop or use misleading green imagery.", "rq": "Information economics of credence attributes: when do claim restrictions change packaging design, not just wording? · Staggered timing of the three firms' commitments (June 2025, February 2026, October 2026) might allow before/after comparisons of labels or marketing. · Contrast enforcement through negotiated commitments with deposit return systems or EPR fees as levers on actual recycled content.", "problem": "Brand claims about recycled content and recyclability rest on a system the brand does not control. The gap between product-level claims and actual system-level recovery is what regulators challenged. No deadline for the label changes and no penalties were reported, so the commitments' real effect is uncertain. BEUC says it will monitor compliance.", "related": ["“Glossy Green” Banks: The Disconnect Between Environmental Disclosures and Lending Activities", "Consumer reactions to environmentally irresponsible sourcing practices: An intentionality and motive perspective"], "keywords": ["packaging regulation", "regulatory enforcement", "deposit return systems", "secondary materials", "greenwashing"], "datasets": ["mintel_gnpd", "reprisk"], "thread": null}, {"n": 4, "id": "2026-10-23#4", "headline": "Helen of Troy plans to spend part of an expected $80.5M IEEPA tariff refund on clearing inventory and redesigning packaging", "theme": "Trade & Industrial Policy", "source": "Supply Chain Dive", "summary": "Helen of Troy (Hydro Flask, Osprey, Drybar) said on its Oct. 8 earnings call that it expects $80.5M in fiscal 2027 refunds of IEEPA tariffs, which the Supreme Court struck down in February. Its fiscal year ends Feb. 28, 2027. In Q2 it recognized $26.9M in gross pretax refunds, of which about $4M remained as net pretax benefit after offsetting commodity, fuel and freight costs. For the full year it plans to reinvest $66.5M–$70.5M, including clearing slow-moving inventory and redesigning packaging to meet U.S. and foreign environmental laws.", "rq": "The refund is a plausibly exogenous cash shock: compare inventory and capex behavior of refund recipients with that of firms that were less exposed to IEEPA tariffs. · A newsvendor or excess-inventory disposal lens: does a windfall change the timing of liquidating stale stock? · Consider how packaging regulations compete with other uses of operating cash across firms.", "problem": "A reversed trade policy produces a cash windfall. The firm must decide whether to bank it or redeploy it into operations: writing down or liquidating excess inventory built during the tariff period, and funding packaging redesign driven by environmental regulations. The split between these uses has not been disclosed.", "related": ["Shock and Awe: A Theoretical Framework and Data Sources for Studying the Impact of 2025 Tariffs on Global Supply Chains", "Diversify or Concentrate? Supply Chain Responses to Policy Uncertainty"], "keywords": ["regulatory uncertainty", "packaging regulation", "extended producer responsibility", "tariff refunds", "inventory management"], "datasets": ["call_transcripts", "usitc_dataweb"], "thread": null}, {"n": 5, "id": "2026-10-23#5", "headline": "Paper and packaging makers pass record diesel costs to customers via surcharges and price increases", "theme": "Supply Chain Resilience", "source": "Packaging Dive", "summary": "After U.S. diesel hit a record high in September, paper and packaging makers have begun adding fuel costs to their prices. Sylvamo added a $1 per hundredweight surcharge from Oct. 1, Sustana $20/ton from Oct. 12, and Billerud $25/ton from Nov. 1. Smurfit Westrock is instead building freight costs into its third containerboard price increase of the year, reported at $100/ton effective Sept. 1. Sonoco says its surcharge \"will come and go as diesel varies.\"", "rq": "Compare surcharge versus built-in price increase as contract forms: asymmetric pass-through (\"rockets and feathers\") is a natural test once diesel falls. · Look at the staggered timing of surcharge announcements across mills through the lens of price leadership or signaling. · Fuel shocks as a driver of localizing recycled-fiber sourcing: a spatial or network model of reverse logistics.", "problem": "Firms must choose how to pass an energy cost shock downstream. A transparent, reversible surcharge tracks diesel prices. A built-in list-price increase may stick after costs fall. The choice affects customer relationships, margin risk and competitive signaling, and it may also push mills to shorten the logistics behind recycled fiber.", "related": [], "keywords": ["freight rates", "chokepoint disruption", "cost pass-through", "fuel surcharges", "secondary materials"], "datasets": ["call_transcripts", "freight_rates"], "thread": null}], "papers": [{"title": "EXPRESS: Harnessing Renewable Portfolio Standards for Sustainable Futures: An Empirical Examination of Spillover Effects", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261504130"}, {"title": "EXPRESS: Do You Lose When You Sell Loose? Impact of Unpackaged Sales on Profit and Waste", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261503661"}], "also": [{"title": "TSMC explores rare-earth-free equipment to counter China controls: Report", "url": "https://news.google.com/rss/articles/CBMi4gFBVV95cUxNelZWNGNXZXpGWmp1R3JBWnotLTlPMS1hS0NzWnhhNzUzUEl4VHlUR1pQODRzS1BMa004YURjUUJRdlpBbnRud0hhcDRXUzRjQlVVcG4yODA5aWpMN01iMW1pUm1lVWR6TDdvQnZBSDNjX1dvWkJncV90Ty1lQVRQcDU1X1RLYW82b01jZ0NUWExnNmNrWklZQk9yOVFhZy1hZ3QtalZZekxtRExfQjhqVG5tTERmQzhpdHpYYUF4aXRUbHNmRVY4NVpYVUE5U2RzbW4wbVlJbElLOHJWUkJBUFVR0gHmAUFVX3lxTFBJSElDVmVEM2hsUVlsLW1JT051SVhmM0VqMVV0c1lsVlljbVdqZldiYUtseUxwM2FFdFNZWWUwVHgyMklQaWFUSkhmSzJ6SUozYU91SzI0czdzWFJiT1R3YXpBSkp6dlhvQTBUSU1acVR1MnhtcDFWOGloc1dWSWVRWDFRdWZfY3I0X3N2UENzTmNVLTlyQURsUTFUbC0tUE96QmZYcWlTZ2g0ZXc1d3ZiSGsyMmVaSFVWSGNRa3h4OXNIdVF0ZURFNkpOUjRPRkQ5ZWtBcEd3TEtrdExKSHhKemJOdU53?oc=5", "source": "electronics.economictimes.indiatimes.com"}, {"title": "Road freight green transition hits cost wall: new industry survey", "url": "https://news.google.com/rss/articles/CBMirAFBVV95cUxOMVE4UWJaSDRyLV9sWW5BZUZlbFZGTEYyVUdSTV9LVEw1UmFUTEVVcC1NVEpEdjRiQnczTE5HTnk3X1ZvaElvQThyNk02a3RFVW9Ua3gwS1JQd29tYS1VVTBTbFRuREEtWnp1RUJJcTFNb3N0Ny0zakIwYWYyUFJjZWdrRWk2WlhKckVYbVdxVmtuWVVTc09qeUZqRi1vZmtFYlFtN3NqRnFHemlo?oc=5", "source": "IRU | World Road Transport Organisation"}, {"title": "GAO Report Outlines Policy Choices for Improving Textile Circularity", "url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxNX2U0RVpRRXNTdTJSNTQ3Z2lENjVzQUNCR21IMFNGZEhTbG1EUnhHRENZMENMdzc4Y3p1VXRFRnVqNjF4My1qMF9uSFFLYjZDRjAyYlhscWUtN29ybjVFYlhUVmlQMTFYRXlvZkZkZS03M1BqWFNxUTJJeHUtMlJoNFJwQy1JQWdXSzZBU3YtMUd4MXFVRlpBMWxmdzItbHNtLV9vTUpwRUl4TE5vMmRCNzlMSkc?oc=5", "source": "WWD"}, {"title": "Nestlé to close Ohio factory by end of 2027", "url": "https://www.supplychaindive.com/news/nestle-to-close-ohio-factory-by-end-of-2027/833587/", "source": "Supply Chain Dive"}, {"title": "EU Lawmakers Push to Delay Methane Emissions Rules by 3 Years", "url": "https://www.esgtoday.com/eu-lawmakers-push-to-delay-methane-emissions-rules-by-3-years/?utm_source=rss&utm_medium=rss&utm_campaign=eu-lawmakers-push-to-delay-methane-emissions-rules-by-3-years", "source": "ESG Today"}]}, {"date": "2026-10-22", "intro": "Today's issue has two new data sources and two policy shocks around AI-era power demand: Virginia's first grid-utilization filings and a Memphis pause on data center applications. It also covers tariff pass-through to solar PPA prices, Apple's latest US supplier commitments (including recycled titanium) and a revised zero-waste certification standard.", "items": [{"n": 1, "id": "2026-10-22#1", "headline": "Virginia utilities file first public grid-utilization metrics: Dominion's distribution grid averages 41% use as data center congestion warnings surge", "theme": "Energy & AI Data Centers", "source": "Latitude Media", "summary": "Under a new Virginia law, Dominion Energy and Appalachian Power (APCo) filed the first public measures of distribution-grid utilization with the State Corporation Commission (SCC). Dominion reported 41% average annual use (July 2025–2026) and about 80% during rare peak hours. APCo reported 14% annually and 54% at peak. Separately, Dominion's most severe transmission congestion warnings rose from 8 in 2023 to more than 172 so far this year, covering 2,530 hours and concentrated in Loudoun and Prince William counties.", "rq": "Think about the gap between 41% average and roughly 80% peak utilization as a peak-load pricing and capacity-sizing problem, and ask what flexible large loads could change. · Utility–regulator information asymmetry and rate-of-return incentives suggest a principal–agent lens on how utilization metrics get defined (general vs. planning). · The jump from 8 to 172+ congestion warnings, concentrated in two counties, could serve as an outcome for studying how localized data center clustering stresses transmission.", "problem": "The dispute is over how the metrics should be used. Dominion wants them as a screening tool rather than a 'deciding factor' in rejecting spending. It also wants to watch trends for 3–5 years before making any metric binding. Deploy Action argues this conflicts with the law's purpose, that the utilities undervalue distributed resources, and that five years is too long. Measurement choices matter too. Dominion's 'general' metric counts customer solar and storage as capacity, while its 'planning' metric does not. Grid-wide averages can also hide constrained feeders and substations.", "related": ["Electricity Time‐of‐Use Tariff with Stochastic Demand"], "keywords": ["data center electricity demand", "grid utilization metrics", "capacity investment under uncertainty", "large-load tariffs", "demand response"], "datasets": ["state_puc", "eia861"], "thread": null}, {"n": 2, "id": "2026-10-22#2", "headline": "Memphis council rejects 18-month data center moratorium but passes 135-day pause", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "On October 20, 2026, after roughly 5.5 hours of debate, the Memphis City Council split 6–6 (one member absent) on Councilor JB Smiley Jr.'s proposed data center moratorium of up to 18 months, so it failed. The council then passed a substitute: a 135-day pause on new data center applications, meant to align with Mayor Paul Young's 90-day impact study ordered in early October. Some sources describe the pause as covering construction rather than applications.", "rq": "Local moratoria can be studied as regulatory arbitrage: do projects shift to adjacent counties or states, and how fast? · Treat the 135-day pause, a short and explicitly temporary shock, as distinct from an indefinite ban, using real-options models of siting under regulatory uncertainty. · The 6–6 split and the substitute vote are a close-call setting; compare cities that adopted moratoria with those that narrowly did not.", "problem": "The city must balance AI infrastructure investment against local environmental and community impacts. It has to do so before it has impact evidence or a permanent zoning framework. A short pause buys study time but leaves long-run rules unsettled. Some councilors said they received the substitute text at short notice, which raises questions about procedural legitimacy.", "related": ["Household Credit and Regulatory Arbitrage: Evidence from Online Marketplace Lending", "Exploring retailers’ sensitivity to local sustainability policies"], "keywords": ["facility siting", "data center electricity demand", "regulatory uncertainty", "siting moratorium"], "datasets": ["gdelt"], "thread": null}, {"n": 3, "id": "2026-10-22#3", "headline": "LevelTen: solar PPA benchmark rises 4.9% in Q3 2026 as buyers rush ahead of Section 232 tariffs", "theme": "Trade & Industrial Policy", "source": "Utility Dive", "summary": "LevelTen's Q3 2026 index shows its continental 25th-percentile (P25) solar PPA price up 4.9%. Its new Core-Markets P25 benchmark stands at $64.23/MWh, up 6% year over year and 12.7% since Q3 2024. Wind P25 prices were flat for the quarter but up 13.8% year over year and 27.5% since 2024. LevelTen attributes the solar rise mainly to Section 232 tariffs announced in early August and taking effect in December.", "rq": "The gap between announcement (August) and effective date (December) is a classic setting for pre-buy behavior; compare contract timing and volumes before and after. · Use a VPPA portfolio or MDP lens to ask how corporations meeting renewable targets should time procurement when input-cost shocks are anticipated. · Contrast solar (tariff-driven) with wind (permitting-driven) price paths to separate trade effects from other policy frictions.", "problem": "Corporate renewable buyers and developers must sign long-term contracts while the cost of trade policy is still uncertain. Much of Q3's increase reflects buyers rushing to sign before the tariff start date. Stockpiling modules is not allowed under current rules, and more than half of modules have already been repriced. How far prices will rise once the tariffs take effect is unknown.", "related": ["Meeting Corporate Renewable Power Targets"], "keywords": ["pre-buy behavior", "industrial policy", "price floors", "power purchase agreements", "long-term supply contracts"], "datasets": ["usitc_dataweb", "federal_register"], "thread": null}, {"n": 4, "id": "2026-10-22#4", "headline": "Apple commits up to $100M to Pennsylvania titanium supplier and expands film deal with Qnity under its US manufacturing program", "theme": "Supply Chain Resilience", "source": "Supply Chain Dive", "summary": "On October 20, 2026, Apple named new and expanded partners in its American Manufacturing Program (AMP) for the foldable iPhone Duo and the iPhone 18 Pro. Apple commits up to $100 million over three years to Perryman Company, a family-owned Pennsylvania titanium producer. Perryman will melt, forge and roll grade 5 titanium with at least 80% recycled content for the Duo's casing. Apple also expanded its partnership with Delaware-based Qnity Electronics for advanced films used in the 18 Pro's variable-aperture camera; no dollar figure was given.", "rq": "Event-study logic applies: how does the market value supplier-level reshoring announcements, and do suppliers react differently from the buyer? · Buyer-funded capacity at small suppliers fits supply-contract and capacity-investment models; think about who bears demand risk over the three years. · A recycled-content requirement in reshored supply is a puzzle for closed-loop supply chain work: where does the scrap come from?", "problem": "Lead firms are shifting parts of their materials and components supply to domestic producers through multiyear funding commitments. This raises questions about the costs, how resilient the new arrangements really are, and how far such deals go beyond signaling to policymakers. Using recycled titanium also ties reshoring to secondary material supply.", "related": ["Return to the United States: Impact of Reshoring Announcements and Reshoring Risks on Market Valuation", "Why locate manufacturing in a high‐cost country? A case study of 35 production location decisions"], "keywords": ["supplier diversification", "secondary materials", "long-term supply contracts", "reshoring", "industrial policy"], "datasets": ["sec_edgar", "usgs_minerals"], "thread": null}, {"n": 5, "id": "2026-10-22#5", "headline": "USGBC launches TRUE v2 zero-waste certification with reweighted scoring and a 100-point scale", "theme": "Circular Economy", "source": "ESG Dive", "summary": "Around October 20, 2026, the US Green Building Council launched TRUE v2 (Total Resource Use and Efficiency), a zero-waste certification for facilities, construction projects and events. The update streamlines requirements, gives more credit to harder, higher-impact actions, rebalances points to help newcomers, and raises maximum points from 81 to 100 (per Facilities Dive). USGBC says the roughly 10-year-old program has more than 680 certified projects that have diverted 8.9 million tons of waste from disposal.", "rq": "Use a certification-design lens (signaling, isomorphism) to ask whether lowering entry barriers changes the type of adopter. · The v1-to-v2 change is a standard revision that could be studied like ISO version transitions: adoption timing and early-mover effects. · Compare certified projects' reported diversion with local disposal costs to see whether economics or signaling drives adoption.", "problem": "Voluntary certifications face a trade-off. Making them easier attracts more adopters but risks diluting their meaning, while rewarding high performers keeps them credible. Changing the point scale and weights also makes v1 and v2 scores hard to compare. It is unclear whether certification produces real waste reductions or mainly documents existing practice.", "related": ["A competitive advantage from the implementation timing of ISO management standards", "Administrative environmental innovations, supply network structure, and environmental disclosure"], "keywords": ["zero waste certification", "voluntary disclosure", "secondary materials", "sustainability standards"], "datasets": ["epa_msw"], "thread": null}], "papers": [{"title": "A Decision-Support Framework for Food Bank Operations: Overcoming Waste and Uncertainty in Food Distribution", "journal": "M&SOM", "url": "https://doi.org/10.1287/msom.2025.0787"}], "also": [{"title": "EU Selects 46 Critical Minerals Projects for Fast-Tracking", "url": "https://news.google.com/rss/articles/CBMigAFBVV95cUxQNGM4aHhKcVlIenBhcHZPdjZubUhlemJzblBkMXZ3QXNfQzkzQzA5SlhVRy0yX29pQndodGNYc1djNUExVG9zTnF4Q0tvVzhFYW5NSDU2cXM4NGNJdHNXV2xORVJGVWFnSHlfa2JUak1BZ1NZcXVOUEFnTTRRcjVTNw?oc=5", "source": "National Association of Manufacturers - NAM"}, {"title": "Rail Traffic SURGE: Why Intermodal Volume is Climbing", "url": "https://www.freightwaves.com/news/rail-traffic-surge-why-intermodal-volume-is-climbing", "source": "FreightWaves"}, {"title": "The US faces national security risks without aluminum smelters: report", "url": "https://www.manufacturingdive.com/news/us-faces-national-security-risks-without-aluminum-smelters-report/833591/", "source": "Manufacturing Dive"}, {"title": "Limiting Global Warming to 1.5 Degrees Celsius Is No Longer Feasible, UN Report Finds", "url": "https://insideclimatenews.org/news/21102026/limiting-global-warming-to-1-5-degrees-no-longer-realistic/", "source": "Inside Climate News"}, {"title": "U.S. Fertilizer Crisis Deepens as Farmers Face Higher Costs and Supply Risks in 2027", "url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxNQ0ZWMi05LXJTa0RpV1Jlb1FLeDh6SHMtZmZaM2VsV1BxRGtpTU1BQUROZ0JSUW5LUVhZU1Z6alJ6TDhHR2ZFSUVPc1BYRWRJTl9XdFZqZFA5ZjNSX3lCUUxWYnpHVXRyUXA3eWFhOHVmLWFydmVMNnhsd2FwRGltamhOaFFTck1WNC1XSnln?oc=5", "source": "AgroLatam"}]}, {"date": "2026-10-21", "intro": "Today's issue covers a hyperscaler-backed small modular reactor plan in Indiana and a double-fee dispute under Colorado's packaging EPR law. It also covers Chinese battery makers building plants abroad to get around trade barriers, a tariff-driven delay to blast furnace maintenance at Cleveland-Cliffs, and Canada shelving an oil and gas 'Abatement' category in its green taxonomy.", "items": [{"n": 1, "id": "2026-10-21#1", "headline": "Amazon, AEP and X-energy explore 960-MW small modular reactor project in Indiana, with Amazon covering full costs", "theme": "Energy & AI Data Centers", "source": "ESG Dive", "summary": "On Oct. 19, 2026, AEP, Amazon and X-energy announced a joint development plan for twelve 80-MW Xe-100 small modular reactors (960 MW in total). The site is the former Breed coal plant in Sullivan County, Indiana. If the project is built and starts commercial operation, Amazon would buy the output under a long-term contract covering the facility's capital and operating costs for its whole life. No timeline, cost estimate or final investment decision was disclosed.", "rq": "Compare the risk allocation in a cost-plus, whole-life contract with a fixed-strike PPA such as Amazon's Calvert Cliffs deal, through the lens of capacity investment under uncertainty. · Hyperscalers are now acting as anchor buyers for unproven technology; think about learning-curve spillovers when one buyer orders a 12-unit fleet. · Notice the siting pattern of new generation on retired coal sites, which can reuse existing interconnection and community infrastructure.", "problem": "First-of-a-kind SMR projects carry large cost-overrun and schedule risk that regulated utilities and their ratepayers are reluctant to bear. AEP's CEO said the deal provides the 'capital protections and financial safeguards' AEP requires. Amazon frames it as paying 'our full costs without passing them to others.' Still open: how risk is actually split if costs balloon, the project is delayed, or Amazon's demand changes over a multi-decade plant life.", "related": ["Meeting Corporate Renewable Power Targets", "Simple Relational Contracts to Motivate Capacity Investment: Price Only vs. Price and Quantity"], "keywords": ["data center electricity demand", "long-term supply contracts", "capacity investment under uncertainty", "large-load tariffs", "facility siting"], "datasets": ["eia860", "state_puc"], "thread": null}, {"n": 2, "id": "2026-10-21#2", "headline": "Auto parts retailers seek to join Colorado EPR lawsuit, citing double fees from two producer responsibility organizations", "theme": "Circular Economy", "source": "Packaging Dive", "summary": "The Auto Care Association, whose members include AutoZone and O'Reilly, has moved to intervene in the National Association of Wholesaler-Distributors' July suit to block Colorado's packaging EPR law, which is already in effect. ACA says members are being charged by both Circular Action Alliance (CAA), the state's main producer responsibility organization, and the Lubricants Packaging Management Association's Interchange 360 program. O'Reilly has been invoiced more than $350,000 by CAA and expects more than $500,000 in LPMA fees; AutoZone says it paid a combined $575,000 to the two groups in Colorado.", "rq": "Use the lens of overlapping or competing regulatory regimes: what happens to producers when program boundaries are set by material rather than by product? · Compare producer-organization market structures across EPR states, including single versus multiple organizations and other countries' experience with competing compliance schemes. · Think about how fee schedules interact with packaging design choices, such as integrated versus separate secondary packaging.", "problem": "When two producer organizations cover adjacent material streams, one product can trigger two sets of registration, reporting, fees and deadlines. In the example cited in the motion, a diesel exhaust fluid jug is reported to LPMA while its cardboard box is reported to CAA. ACA says complying outside these groups would be 'prohibitively expensive,' so producers are effectively locked into paying both. The court has not ruled on intervention, and neither lawsuit has been decided.", "related": ["Interplay between Competing and Coexisting Policy Regimens within Supply Chain Configurations", "Do E‐Waste Laws Create Behavioral Spillovers? Quasi‐Experimental Evidence from California"], "keywords": ["extended producer responsibility", "packaging regulation", "litigation risk", "state environmental policy"], "datasets": ["state_epr", "epa_msw"], "thread": null}, {"n": 3, "id": "2026-10-21#3", "headline": "Chinese battery makers reportedly expand overseas plants to get around Western trade barriers (unconfirmed FT figures)", "theme": "Critical Minerals & Batteries", "source": "Financial Times", "summary": "According to a secondary summary of a Financial Times report (not verified against the FT), Chinese battery firms including CATL, BYD, Gotion, CALB and Sungrow have announced about $12bn in overseas deals this year. That reportedly brings their foreign investment since 2023 to nearly $90bn, of which $52bn is in cell manufacturing. Gotion has reportedly committed more than €1bn to a Volkswagen joint venture producing in Spain, Slovakia and Morocco, and CATL is said to be scouting more European sites.", "rq": "Use tariff-jumping FDI theory as a lens and compare where plants are sited relative to EU versus US barriers, including foreign-entity-of-concern rules. · The gap between Europe's roughly 120 GWh and North America's roughly 5 GWh in storage orders is a puzzle worth unpacking against the two policy regimes. · Joint ventures (e.g., Gotion–VW) versus wholly owned plants offer a governance comparison under regulatory uncertainty.", "problem": "Trade barriers meant to build domestic supply chains may instead move Chinese-owned capacity into or next to protected markets. That raises the question of whether the policies achieve supply security or mostly reshuffle where plants are located. Firms must weigh tariff avoidance against higher costs abroad, political risk and partner dependence. The exact FT figures and their data source remain unverified.", "related": [], "keywords": ["tariff circumvention", "facility siting", "foreign entity of concern", "industrial policy", "battery storage"], "datasets": ["un_comtrade", "battery_supply"], "thread": null}, {"n": 4, "id": "2026-10-21#4", "headline": "Cleveland-Cliffs pushes Burns Harbor blast furnace reline to 2028 on tariff-supported demand after strongest quarter in three years", "theme": "Trade & Industrial Policy", "source": "Manufacturing Dive", "summary": "Cleveland-Cliffs reported Q3 2026 revenue of $5.6B (up 18.5% year over year), net income of $165M versus a $234M loss a year earlier, and adjusted EBITDA of $612M, on 4.2M net tons shipped at an average $1,177 per ton. It moved the relining of the C blast furnace at Burns Harbor, Indiana, from mid-2027 to April 2028, which frees about 500,000 extra net tons of 2027 shipments. It guided to roughly $715M adjusted EBITDA in Q4, possibly more than $4B in 2027 'under prevailing market conditions,' and 2027 capital spending above $1B.", "rq": "Treat maintenance deferral as a real option under tariff uncertainty, and compare it with maintenance scheduling models that hold prices fixed. · Look across producers for whether tariff shocks shift maintenance outages and capital spending timing, as a natural experiment in policy-driven capacity utilization. · The spread of take-or-pay clauses is a contract-design shift worth tracking alongside protection.", "problem": "Deferring a reline lets the firm capture high tariff-protected margins now, but it stretches an aging furnace and pushes maintenance into a future whose price and tariff environment is uncertain. The 2027 outlook depends on prices and tariffs holding. The trade-off is near-term throughput versus reliability and capital timing risk if protection is reversed.", "related": ["Shock and Awe: A Theoretical Framework and Data Sources for Studying the Impact of 2025 Tariffs on Global Supply Chains", "Impact of the U.S.–China trade war on the operating performance of U.S. firms: The role of outsourcing and supply base complexity"], "keywords": ["maintenance scheduling", "capital expenditure", "antidumping duties", "long-term supply contracts", "industrial policy"], "datasets": ["call_transcripts", "usitc_dataweb"], "thread": null}, {"n": 5, "id": "2026-10-21#5", "headline": "Canada puts oil and gas 'Abatement' category on hold in final sustainable finance taxonomy methodology", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "The Canadian Taxonomy and Transition Planning Council's final Methodology Report confirms 'Green' and 'Transition' categories. It puts on hold the 'Abatement' category proposed in the July 2026 draft, which would have covered near-term emissions cuts in declining high-emitting sectors such as upstream oil and gas. New research on Abatement starts in 2027. The report also tightens the definition of 'green enabling' activities, adopts 'disclose or explain' for the environmental and social safeguards, and rules out partial alignment.", "rq": "Treat taxonomy category decisions as classification shocks, comparing them with how the EU taxonomy handled gas and nuclear. · Think about binary alignment (no partial alignment) versus graded labels from a disclosure-design and signaling lens. · Watch whether Canadian energy firms' transition-plan disclosures or green bond issuance change around the 2026–2027 decision points.", "problem": "Whether to label emissions cuts at fossil assets as 'sustainable' is a trade-off between financing real near-term abatement in hard-to-abate sectors and risking greenwashing and lock-in. The deferral leaves oil and gas issuers and investors unsure how such projects will be classified. The sector timeline also casts doubt on the end-2026 launch.", "related": ["“Glossy Green” Banks: The Disconnect Between Environmental Disclosures and Lending Activities", "Climate Impact Investing"], "keywords": ["voluntary disclosure", "regulatory uncertainty", "materiality assessment", "sustainable finance taxonomy"], "datasets": ["cdp"], "thread": null}], "papers": [{"title": "Humanitarian Aid Management under Corruptible Distribution and Oversight Agents", "journal": "M&SOM", "url": "https://doi.org/10.1287/msom.2026.0298"}], "also": [{"title": "US semiconductor supply chain relies on vulnerable, hidden inputs", "url": "https://www.supplychaindive.com/news/us-semiconductor-supply-chain-relies-on-vulnerable-hidden-inputs/833485/", "source": "Supply Chain Dive"}, {"title": "Illinois bill requires data centers to report electricity use", "url": "https://news.google.com/rss/articles/CBMirAFBVV95cUxNQk9kQTJPaDhEbmZBRjlhc2tBS043VkNqd0dqUXhIcWR1RnZhbGJORE1wUlpVU3Fvbi1nLW5SRE9JWkFBc1hSWXp1OFFuZm9HaU9KTXBRQ2xkTU5oQ04tQ1JudlotZ3piZVlrVEo0Y3J2MGI4Y2RVdXBNU29SOW43YzhIcEVJT1g1OU5GeW9kTFVZWUNiZnpJQmpFbHhidFA2NTBLNTM2dUV0dEpJ0gGyAUFVX3lxTE40VkQ2LXNHM1RIdWJpZW5aYnBOTDFXZlNpbHVRdWJUeENEeGlod01vWG9iSTFZVWVXNVl4VmYwMmFLeWRTSW5nRzVzdHFkZTgwNERpUFo1S0h5LXBhS2t2UXFBNGgwcmpSVk9pM3hVckxjWkR4U0kyZWthMmV0ZjkwanhZME5ORXlBRi05c2R5dE15SllVU0RtTjNnSlpmdUYzdzZLemo1bVFuSTZobUFzUUE?oc=5", "source": "OurQuadCities"}, {"title": "Indonesia Palm Oil Disruption: El Niño Drought Strands Barges and Hits West Kalimantan Farmers", "url": "https://news.google.com/rss/articles/CBMiywFBVV95cUxNNjBFU3RENllMajlaTFo0TFpvajFVN2VVMXktQmg1d1ltODEwMXZROUJJdEFXbm9KSnhIeWREU25XWDgxaUNodVJyVWIwZy13eFZaVW5uckhTTWdPOFhsM1FCQWFPb2k5UTFyM1pXcXZ1Y3ZDR0o1V0JGTW9ydElubmtJZzYxT3BLRy1mMnF2a01lTDJFTjl0Z2tjSzhTTG1UaGZueUVTLUNFTlZ6RFNYYVQ4dXBOckdGVHRoYmcxUGFMQVozaFBJRFJQZw?oc=5", "source": "Batam News Asia"}, {"title": "World’s first ammonia-powered dry bulk ship completes sea trials", "url": "https://www.freightwaves.com/news/worlds-first-ammonia-powered-dry-bulk-ship-completes-sea-trials", "source": "FreightWaves"}, {"title": "EU Circular Economy Act postponed once again", "url": "https://news.google.com/rss/articles/CBMikwFBVV95cUxPOUdKYkpQY2tvcU5ycWY2Z0dmRGduYnNIYlo5eUZOd1h6VjkxaHdxWVB5SV84NGlETENtU0liWFZJNzNMbkE5bjR6b0pBV093TDkwcUw4LXFDYUhjZ3lXOGs3NU93MkxsNEpHYm9pTUFWVkRSNC1KdG53TWhDNE5qQTV6TnBTWERwenhQaFc0MkhFWDQ?oc=5", "source": "EUWID Recycling and Waste Management"}]}, {"date": "2026-10-20", "intro": "Today's issue spans two live supply shocks (China's yttrium squeeze on Japan and a UK AI data center lost to grid delays), a capacity glut in non-Chinese battery recycling, and two EU rules that turn disclosure and traceability into operating constraints: ESMA's first CSRD-era enforcement priorities and the EUDR's projected impact on Ethiopian coffee smallholders.", "items": [{"n": 1, "id": "2026-10-20#1", "headline": "Japan could run short of yttrium by end-2026 as China's export curbs persist", "theme": "Critical Minerals & Batteries", "source": "Financial Times", "summary": "Secondary outlets reporting a Financial Times story (around 19–20 Oct 2026; the FT original was not seen) say Japanese officials and trading-house executives warn that yttrium shortages could begin as early as end-2026 unless Beijing eases controls or substitutes or extra stockpiles are found. Yttrium oxide outside China has reportedly risen 179-fold in two years, to about $1,150/kg versus about $9/kg inside China. According to unnamed sources, Tokyo has asked the US government and large US firms to lobby Beijing.", "rq": "Stockpile pooling and allocation under a known-finite horizon: the case resembles a rationing game more than a classic random-yield disruption. · Compare the 2010 China–Japan rare-earth episode with this one to see whether a decade of 'diversification' rhetoric actually changed exposure. · Treat the China/ex-China price wedge as a measure of market segmentation under export controls.", "problem": "Japanese manufacturers face running down finite stocks of an input with few short-run substitutes, while a single dominant supplier rations volumes for political reasons. A US official reportedly said China lets Japan buy only 'the bare minimum it needs'. Firms must decide how to allocate scarce stock across product lines, whether to pay extreme ex-China prices, and whether to invest in substitution or non-Chinese supply that may not pay off if controls are lifted. Stockpile size and the exact run-out date are unknown.", "related": ["Building Supply Chain Resilience through Virtual Stockpile Pooling", "The Implications of Firm‐Specific Policy Risk, Policy Uncertainty, and Industry Factors for Inventory: A Resource Dependence Perspective"], "keywords": ["raw material security", "supplier concentration", "sourcing restrictions", "supplier diversification", "export controls"], "datasets": ["un_comtrade", "usgs_minerals"], "thread": null}, {"n": 2, "id": "2026-10-20#2", "headline": "Battery recyclers outside China face idle capacity as EV adoption slows and scrap flows to China", "theme": "Circular Economy", "source": "Nikkei Asia", "summary": "Nikkei Asia (19 Oct 2026, Tokyo) reports that global EV battery recycling capacity far exceeds the volume of discarded material. The causes it gives are a slower-than-expected EV transition and a supply chain concentrating in China. Japan's JX Advanced Metals, whose plants can recover lithium, nickel and cobalt from used EV batteries, is named. Only the article's opening was verified; it should also be checked for sponsored-content status.", "rq": "Capacity investment under lagged, uncertain returns flows: what EV sales scenarios were these plants sized for? · Ask whether scrap export restrictions or recycled-content mandates could anchor feedstock locally, and compare with how waste-export bans have worked in other materials. · Collection and competition models from the remanufacturing literature, where the recycler competes with a third party for cores, map well onto this scrap market.", "problem": "Recycling plants are capital-intensive and need high utilisation, but their feedstock depends on past EV sales and on who wins the scrap competition. With slower adoption and Chinese processors outbidding them, non-Chinese recyclers face stranded capacity. That undermines the case for regional closed-loop supply as a mineral-security strategy.", "related": ["Accelerating vehicle fleet turnover to achieve sustainable mobility goals"], "keywords": ["battery recycling", "closed-loop supply chain", "capacity investment under uncertainty", "secondary materials"], "datasets": ["battery_supply", "un_comtrade"], "thread": null}, {"n": 3, "id": "2026-10-20#3", "headline": "Microsoft exits Nscale's Loughton AI data center after grid connection pushed to the 2030s", "theme": "Energy & AI Data Centers", "source": "Blockspace Media", "summary": "Microsoft has ended its anchor-tenant agreement for Nscale's planned AI data centre in Loughton, Essex, reported around 18–19 Oct 2026 and confirmed by Nscale. UK Power Networks reportedly told Nscale the site would not get enough power until the early-to-mid 2030s, against a planned ready date of late 2026 or early 2027. The site was planned at 50 MW, expandable to 90 MW, with 23,040 Nvidia GB300 GPUs for Azure; investment was reported as about $3bn or £2bn depending on the source.", "rq": "Real options view of hyperscaler leasing: anchor contracts as options exercised or abandoned based on power-date signals. · Compare UK distribution-level connection timelines with US large-load queues (e.g., ERCOT, PJM) to see where power constraints bind on siting. · Puzzle: why sign a flagship tenant before a firm connection date? Look at contract structure and risk allocation between developer and tenant.", "problem": "The binding constraint was the grid connection date, not land, chips or capital. A tenant with time-sensitive compute demand will not wait several years for power. Nscale now holds a site without a tenant or adequate power and is exploring alternative power sources and other UK sites. Termination penalties have not been disclosed.", "related": [], "keywords": ["data center electricity demand", "interconnection queues", "facility siting", "capacity investment under uncertainty"], "datasets": ["lbnl_queues", "ercot_reports"], "thread": null}, {"n": 4, "id": "2026-10-20#4", "headline": "ESMA's 2026 enforcement priorities target CSRD materiality and links between impacts, risks and targets", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "On 13 Oct 2026, ESMA published its 2026 European Common Enforcement Priorities for listed issuers' 2026 annual reports. For ESRS sustainability statements, it prioritises how firms apply the materiality assessment and how they link impacts, risks and opportunities (IROs) to policies, actions and targets (PATs) and metrics. Enforcers will focus on ESRS E1 (Climate Change) and S1 (Own Workforce).", "rq": "Enforcement priorities as a staggered treatment: compare E1/S1 disclosure quality with other ESRS topics before and after. · Text-analysis angle: do 'science-based' or '1.5°C' labels without methodology predict weaker actual target progress? · Ask whether demands for upstream IRO coverage change buyer–supplier data flows, for example through CDP supply chain requests.", "problem": "Early ESRS reports show selective disclosure. Some issuers detail positive impacts more than negative ones, call targets 'science-based' or '1.5 degrees' without explanation, and report emission intensity without absolute values. ESMA wants IROs to cover upstream and downstream value chains, wants firms to say when no PATs exist for a material IRO, and wants targets to be measurable, time-bound and outcome-oriented, with status reported as met, missed or dropped. The tension is between pushing enforcement rigour and the EU's simplification agenda.", "related": ["Toward “Omniscient” supply chains: Enabling and incentivizing sustainable operations", "Administrative environmental innovations, supply network structure, and environmental disclosure"], "keywords": ["mandatory climate reporting", "scope 3 disclosure", "materiality assessment", "regulatory enforcement"], "datasets": ["sbti", "cdp"], "thread": null}, {"n": 5, "id": "2026-10-20#5", "headline": "ODI study: EUDR traceability rules could exclude up to 60% of Ethiopian coffee smallholders from the EU", "theme": "Food & Agriculture", "source": "Birr Metrics", "summary": "An ODI Global study published 16 Oct 2026 estimates that up to 60% of Ethiopian coffee smallholders could be shut out of the EU market under the EU Deforestation Regulation (EUDR). It also finds that traceability gaps affect up to 57% of coffee supply chains. In adverse scenarios GDP could fall by up to 0.5%; both figures are modelled estimates, not observed outcomes, and were reported via Birr Metrics rather than the report itself.", "rq": "Fixed compliance cost vs plot size: a supplier-selection model in which traceability costs create a minimum efficient supplier scale. · Natural experiment: compare EU vs non-EU coffee import shifts by origin before and after 30 Dec 2026. · Contrast commodity-exchange pooling with direct-trade or cooperative channels as traceability architectures.", "problem": "A traceability mandate aimed at deforestation may exclude the smallest, least-documented farmers even where deforestation risk is low. EU buyers may respond by sourcing from traceable large farms or other origins rather than investing in smallholder mapping.", "related": ["“I Am Because We Are”: The Role of Sub‐Saharan Africa's Collectivist Culture in Achieving Traceability and Global Supply Chain Resilience", "Sustainability in multi‐tier supply chains: Understanding the double agency role of the first‐tier supplier"], "keywords": ["deforestation", "multi-tier traceability", "sourcing restrictions", "smallholder inclusion"], "datasets": ["un_comtrade"], "thread": null}], "papers": [], "also": [{"title": "AEP signs 960-MW Indiana nuclear pact with Amazon, X-energy", "url": "https://www.utilitydive.com/news/aep-signs-advanced-960-mw-nuclear-amazon-x-energy/833341/", "source": "Utility Dive"}, {"title": "Port of Savannah to build 3.5M TEU container terminal", "url": "https://www.supplychaindive.com/news/port-of-savannah-to-build-35m-teu-container-terminal/833246/", "source": "Supply Chain Dive"}, {"title": "New emissions rules force Aarhus to rethink port discounts", "url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxORktzaUI3NXJfblpwM1pyRE5JMTFiNkFQQWVCMEdWeUlxb3YtTzlFSEpTaUtBX1J0UXFySXFoR3NfTWdtRXFEcEVvYURLTkFvZHRYcmgzOEY0R0dtcjc4dU5yYkw3VGRrUUpDSzA4MzFCWmhySFhFXzR6bEhjQXFWX2dKY0dpcW9P?oc=5", "source": "Splash247"}, {"title": "Rising Global Temperatures Increase Data Center Water Vulnerability to One-Third", "url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE5PZ05ERjA5RzlHZnk2YTYyX3FlVlAzLXJ4YTdSYUxuVmVwTGhROC1hTlA4OG14ZUNJeVFKd0xPd0pMV1hqeU9TazBVUG5xWVFTZTVNZnctemF2U2FTRzlpWg?oc=5", "source": "AZoCleantech"}, {"title": "Few major apparel brands pay garment workers a living wage: report", "url": "https://www.supplychaindive.com/news/few-major-apparel-brands-pay-garment-workers-a-living-wage-report/833275/", "source": "Supply Chain Dive"}]}, {"date": "2026-10-19", "intro": "Today's issue covers a capex-based forecast that hyperscaler emissions will rise 57% in 2026, a case for recovering landfilled aluminum instead of building power-hungry smelters, a reported (and possibly stale) US critical-minerals price floor, and Microsoft's 20-year, 1.1 GW power deal in Indiana. A fifth story, on Indian exporters possibly having to track Scope 3 emissions, is held back because the article could not be verified.", "items": [{"n": 1, "id": "2026-10-19#1", "headline": "Startup forecasts 57% jump in 2026 emissions for five hyperscalers, using capex to predict emissions before disclosure", "theme": "Energy & AI Data Centers", "source": "Trellis", "summary": "Bricola Group, a startup founded by former Amazon economist Jimmy Gillan, forecasts that combined emissions of Alphabet, AWS, Meta, Microsoft and Oracle will rise 57% in 2026 to 215 million tCO2e gross. Net of renewable energy certificates and similar purchases, the forecast is 140 million tCO2e, up from 87 million in 2025; AWS and Alphabet are each expected at just over 53 million tCO2e. The model maps past capex to past emissions. Capex is reported in 10-Ks 5–9 months before sustainability reports, and the five firms' combined 2025–2026 capex is expected to exceed $1 trillion. These are first-use model estimates with no outside validation, and Alphabet, AWS and Meta rely on capex guidance rather than reported figures.", "rq": "How well does capital expenditure predict a firm's later-reported Scope 1, 2 and 3 emissions, and does the predictive gap widen during capacity build-outs such as AI data centers?", "problem": "Capex-to-emissions mapping is a forward-looking emissions estimator, and it can be tested against what firms later report. The forecast also measures how far AI capacity growth outruns corporate decarbonization, including the gap between gross and certificate-adjusted (market-based) accounting.", "related": ["How Sustainable Is Big Data?", "Online Rack Placement in Large-Scale Data Centers: Online Sampling Optimization and Deployment"], "keywords": ["data center electricity demand", "emissions forecasting", "capital expenditure", "market-based emissions accounting"], "datasets": ["compustat", "cdp"], "thread": null}, {"n": 2, "id": "2026-10-19#2", "headline": "Experts argue better sorting and updated bottle bills could ease US aluminum shortage more cheaply than new smelters", "theme": "Circular Economy", "source": "Canary Media", "summary": "Amid a global aluminum shortage and US tariffs, Canary Media reports that millions of tons of US aluminum scrap still end up in landfills. Recycled aluminum needs only 5% of the energy of primary metal, while new or restarted smelters must compete with data centers for cheap power. SAFE's report says the US imports 84% of its primary aluminum, runs only five smelters in 2026, and faces primary demand rising from 4.4 to 5.1 million tons by 2029. Proposed fixes include Sortera's alloy-sorting plants (a $45M raise for a second site in Tennessee) and updating the 10 state bottle bills; Massachusetts' 5-cent deposit is 43 years old.", "rq": "Do states with bottle-deposit laws, and higher deposit values, achieve higher aluminum recovery and lower landfill disposal, and does that translate into more domestic secondary aluminum supply?", "problem": "This is a concrete primary-versus-secondary sourcing trade-off in which energy prices, tariffs and collection policy all set the economics of closed-loop supply. Sorting quality decides whether scrap becomes high-value alloy or is downcycled into low-value products.", "related": ["Managerial Efficiency and Reverse‐Flow Complexity in a Circular Economy"], "keywords": ["secondary materials", "closed-loop supply chain", "state environmental policy", "deposit return systems", "raw material security"], "datasets": ["epa_msw", "census_trade"], "thread": null}, {"n": 3, "id": "2026-10-19#3", "headline": "US reportedly weighing critical-minerals price floor with allies; reports conflict on whether it will proceed", "theme": "Critical Minerals & Batteries", "source": "Stocktwits", "summary": "Citing Bloomberg, Stocktwits reported a multi-agency US plan for a critical-minerals price floor, to be rolled out through the Pax Silica program after a 55-country summit, with reported agreements with the EU, Japan and Mexico. MP, USAR, UAMY and TMC each rose more than 2% pre-market. On January 28, Reuters had reported the administration was stepping back from price floors because Congress had not funded them, and those stocks fell 5–10% after hours. MP Materials said its own $110/kg floor contract for light rare earths remains in force. The article is stamped March 5, 2026, so it is roughly seven months old, and the policy's current status is unverified.", "rq": "How do announcements and reversals of price-floor support change rare-earth producers' valuations and their announced capacity investments, compared with downstream buyers'?", "problem": "A guaranteed minimum price is a market-design intervention that shifts demand risk from producers to the government, which should change capacity investment and buyers' sourcing decisions. The back-and-forth news flow gives clean event dates for testing that.", "related": [], "keywords": ["industrial policy", "raw material security", "capacity investment under uncertainty", "price floors", "regulatory uncertainty"], "datasets": ["crsp", "sec_edgar"], "thread": null}, {"n": 4, "id": "2026-10-19#4", "headline": "Microsoft signs 20-year, 1.1 GW deal with NiSource for Indiana data center, paying for all new infrastructure", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "Microsoft agreed to a 20-year contract with NiSource for about 1,100 MW of generation for a northwest Indiana data center campus, starting in 2028. DCD thinks the site is likely La Porte, but this is unconfirmed. Power flows through NiSource's GenCo subsidiary under a new rate structure for very large customers. Microsoft pays for all required generation and transmission, and GenCo has contracted 600 MW of battery storage. NiSource raised its estimate of savings for existing customers from its data center contracts to about $1.75B, up from $1.4B, or up to $140 per customer per year.", "rq": "Do dedicated large-load tariffs and generation-subsidiary structures like NiSource's GenCo shield residential rates from data center load growth, compared with utilities that serve data centers under standard tariffs?", "problem": "Under this 'pay your own way' structure, a dedicated generation subsidiary and the large customer carry the build-out risk. That is a contract design for allocating capacity risk between hyperscalers and regulated ratepayers, and it is likely to spread to other utilities.", "related": ["Meeting Corporate Renewable Power Targets", "The Value of Coordination in Multimarket Bidding of Grid Energy Storage"], "keywords": ["data center electricity demand", "long-term supply contracts", "battery storage", "large-load tariffs", "facility siting"], "datasets": ["state_puc", "eia861"], "thread": null}], "papers": [], "also": [{"title": "PJM Issues Electric Power Capacity Advisory For Oct. 19 As A Result Of About 72,000 MW Of Planned Generation Outages; About 60% Of Generating Capacity Is Available To Meet Demand - PA Environment Dige", "url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxNbDZxWXozYU1tejIxY3B3bFBxUHowQ3BjSzdhZkdkeUhtUkFjUmk1b1ZOTVllMXIxTUpBZUVUbFNiaHFlSnliUW1JeDcxY0VqdFdfV0dELVNHY3BvVElETjlrOXdRbzBmZFBDSVY3dWZneExJREN6c3YzZU5LZ09YMnhNZHcwb1RISGZ3dHFtZw?oc=5", "source": "PA Environment Digest Blog"}, {"title": "Shippers To Lose N1.3trn On Agric Commodities To EU Regulations", "url": "https://news.google.com/rss/articles/CBMilgFBVV95cUxOWHR1ZUdhcDh3QXZ0NWQxU3UwQVBtRVJ2RHZ1OWQxSzNNUU5NZGNvR2UxQWMtSkJ0Z1VOaE81QkhpZm1ZVWo1NWU3Z2U2UVMwdENPYjBzRFowTnI5S1FReDc5YUloX0VySDlHVTBsaUZfOE1QSHp5ekdWbFhuT2FSMUU4ZGpzTmpjY1hsSTBfcG0wSTNRSUE?oc=5", "source": "New Telegraph"}, {"title": "Corporate demand could support up to 1.9 million tonnes of SAF by 2030, study finds", "url": "https://news.google.com/rss/articles/CBMiugFBVV95cUxQNE9fUllqV2c3U2dyV0VpUGFUdUZldDh4dUpGYmZqOGNQU0s3dXhwaHFzY3V1Nm02WWN4Y3h2cnVyX05YQ2xTUTZGR1lsQ1FicnFhcUZWWk9kM2ZFUG1iRmdjUUFld3I3UFl4SkVBRGNQTHZROUVpMm83WVU2U2FlanF1U3hNSlE3b1B6eXBkaGVqal9VbTdjZ2dMT2kzMm1lT1Etak5zby1sT3B6YVVEN2U2ejRFV0dYeFE?oc=5", "source": "TTGmice"}, {"title": "NOAA certifies American Metal's bid to mine the Pacific seafloor for critical minerals", "url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxOZWEyYk1ERGdZUXFJVUVVVzhPaDU3Ml9VXzNKYUY5ck93eFQ2VUVNcTVYUkEtcUdOTmFSZ2dhaVVQaUhNQ0tBc2lld2lLZlc2T3hFdUd3NXF0dy0tZzJXMkZMV0hiRDJhMmd0a3dVTTMtQWRjRm9qdmp6OGZwOXNYZ3lVUFhnTWs0NWtoTUZhQlJxWUdPWk5ONUNoUzZUY3M1REZSaTdBNnd4dDNpNU12MGJVZw?oc=5", "source": "Startup Fortune"}, {"title": "DIC an
