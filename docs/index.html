<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#dcdad3;--accent:#1f6f5c;--chip:#ebe9e2;--chip-on:#1d1d1b;--chip-on-ink:#f4f3ef;--star:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615;--star:#e6b450}}
:root[data-theme="dark"]{--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615;--star:#e6b450}
:root{--toggle-bg:var(--card);--toggle-ink:var(--ink);--toggle-line:var(--line)}

.theme-toggle{position:fixed;top:12px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;
  border:1px solid var(--toggle-line);background:var(--toggle-bg);color:var(--toggle-ink);border-radius:999px;
  padding:7px 13px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.theme-toggle:hover{border-color:var(--toggle-ink)}
.theme-toggle .ic{font-size:14px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:0;padding-right:120px}
.sub{color:var(--muted);margin:4px 0 16px}
a{color:inherit}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px/1 inherit;padding:10px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab small{font-weight:400;margin-left:4px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:16px}
@media (max-width:760px){aside{position:static}}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
details{margin-top:18px}
summary{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";font-size:11px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
summary .n{margin-left:auto;letter-spacing:0;text-transform:none}
details .chips{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--ink);font:13px/1.4 inherit;cursor:pointer}
.chip:hover{outline:1px solid var(--muted)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip small{color:var(--muted);margin-left:3px}
.chip.on small{color:inherit;opacity:.7}
.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font:inherit;font-size:13px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;min-height:28px}
.bar strong{font-size:17px}
.clear{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;padding:3px 8px;font:inherit;font-size:13px}
.card{background:var(--card);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-family:Georgia,serif;font-size:19px}
.card h3 a{text-decoration:none}
.card .intro{color:var(--muted);font-size:14px;margin:0 0 10px}
.row{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.row .body{flex:1;min-width:0}
.row a.go{text-decoration:none;display:block}
.row a.go:hover .hl{text-decoration:underline}
.star{flex:none;text-decoration:none;color:var(--muted);font-size:17px;line-height:1.2;padding:2px 2px 0}
.star.on{color:var(--star)}
.star:hover{color:var(--star)}
.meta{font-size:12px;color:var(--muted)}
.theme{font-weight:600;color:var(--accent)}
.hl{font-weight:600}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kw .chip{font-size:11px;padding:2px 8px}
.chip.thread{background:none;border:1px solid var(--line);color:var(--accent)}
.snip{font-size:13px;color:var(--muted);margin-top:3px}
.note{font-size:13px;margin-top:4px;padding:6px 10px;border-left:3px solid var(--star);background:var(--chip);border-radius:4px}
.paper{font-size:13px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line)}
.card details{margin-top:8px}
details.card{margin:0 0 8px;padding:12px 18px}
details.card>summary{padding:2px 0}
details.card[open]>summary{margin-bottom:6px}
.empty{color:var(--muted);padding:24px 0;line-height:1.6}
.help{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.55}
mark{background:#f2dc8a;color:#1d1d1b;border-radius:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.public{background:#dcefe6;color:#1f5f4c}.badge.university{background:#dfe7f6;color:#28497f}
.badge.commercial{background:#f6e3d6;color:#8a4a1c}.badge.request{background:#efe3f3;color:#6a3a7a}
:root[data-theme="dark"] .badge{filter:brightness(.85) saturate(1.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{filter:brightness(.85) saturate(1.2)}}
.ds{border-top:1px solid var(--line);padding:8px 0}
.ds>summary{font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;padding:2px 0}
.ds .alt{font-size:12px;color:var(--muted);margin:2px 0 4px 17px}
.ds.unused>summary{color:var(--muted);font-weight:400}
.cal{background:var(--card);border-radius:10px;padding:12px 12px 10px;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head button{background:none;border:0;color:var(--ink);font:600 14px/1 inherit;cursor:pointer;padding:6px 8px;border-radius:6px}
.cal-head button:hover{background:var(--chip)}
.cal-head .mon.on{background:var(--chip-on);color:var(--chip-on-ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--muted);padding:2px 0 4px}
.cal-grid .d{font:13px/1 inherit;padding:7px 0;border-radius:6px;color:var(--muted);opacity:.45;border:0;background:none}
.cal-grid button.d{opacity:1;color:var(--ink);font-weight:600;cursor:pointer;position:relative}
.cal-grid button.d::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal-grid button.d:hover{background:var(--chip)}
.cal-grid button.d.on{background:var(--chip-on);color:var(--chip-on-ink)}
.cal-grid button.d.on::after{background:var(--chip-on-ink)}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.cal-foot button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 20px;font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;min-width:34px}
.pager button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}

<script id="data" type="application/json">{"issues": [{"date": "2026-10-31", "intro": "Today's issue spans grid access rules for data centers, a federal challenge to California's climate-disclosure laws, a deadly fab explosion that cost Intel an estimated $600M, a hyperscaler's certificate deal for low-carbon cement, and a large intermodal carrier switching railroads. Each one involves a policy shock or an operational decision that could support empirical or analytical OM work.", "items": [{"n": 1, "id": "2026-10-31#1", "headline": "CAISO board approves 'flexible interim' interconnection rules for data centers and other large loads, ahead of FERC filing", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "On Oct 28, 2026, CAISO said its Board of Governors had approved a proposal to connect large loads such as data centers and manufacturing plants to the transmission grid faster. The core mechanism is a 'flexible interim load interconnection': a large load can connect early, but must accept enforceable flexibility based on grid conditions until the needed network upgrades are finished. CAISO will file the proposal with FERC by its November 16 deadline, and DatacenterDynamics reports CAISO is the first US grid operator to win board approval for its response.", "rq": "Model interim flexible connection as an interruptible-service or priority-queue contract. Ask what curtailment level makes early connection worth more to a data center than waiting for firm service. · Compare the six grid operators' responses to the same FERC order. This is cross-sectional variation in rule design created by a single regulatory shock. · Check whether flexibility terms change where data centers request connection, inside versus outside CAISO.", "problem": "Large loads want power quickly, but the network upgrades needed to serve them take years. Connecting them early by making their service conditional on grid conditions trades speed against reliability and against the value of firm service to the customer. It also leaves open who pays for upgrades. RTO Insider reports that 'ratepayer protection questions linger,' and FERC has not yet approved the proposal.", "related": ["The Value of Coordination in Multimarket Bidding of Grid Energy Storage", "Recent Developments in Security-Constrained AC Optimal Power Flow: Overview of Challenge 1 in the ARPA-E Grid Optimization Competition"], "keywords": ["large-load tariffs", "interconnection policy", "interruptible load", "data center electricity demand", "interconnection queues"], "datasets": ["ferc_elibrary", "eia930"], "thread": null}, {"n": 2, "id": "2026-10-31#2", "headline": "OCC asks California regulators to exempt national banks from SB 253 and SB 261 climate-disclosure laws", "theme": "ESG & Disclosure", "source": "American Banker", "summary": "Comptroller of the Currency Jonathan Gould sent a letter, reported by American Banker on Oct 30, 2026, to California Air Resources Board (CARB) Chair Lauren Sanchez. The letter asks CARB to exempt national banks and federal savings associations from California's climate-disclosure laws, or to clarify that they don't have to comply. The OCC cites conflicts with federal regulation and with safety and soundness, an undue burden on smaller banks, and concerns under the Supremacy Clause, but it has not formally preempted the laws.", "rq": "Treat the letter as an event: compare national banks with state-chartered banks of similar size, which the OCC request would not cover. · Look at whether firms that might be exempt still prepare or publish emissions data voluntarily. Regulatory uncertainty can change the line between voluntary and mandatory disclosure. · If banks drop out of the mandate, their financed-emissions requests to borrowers may weaken. Ask how that would spread down supply chains through Scope 3 data requests.", "problem": "The question is whether federally chartered banks fall inside a state climate-disclosure regime. Experts quoted by American Banker expect the OCC's broad view of preemption to end up at the Supreme Court. The result is layered uncertainty for banks: one law is enjoined, the other may be preempted, and CARB's response is still unknown.", "related": ["Market Reaction to Mandatory Nonfinancial Disclosure", "“Glossy Green” Banks: The Disconnect Between Environmental Disclosures and Lending Activities"], "keywords": ["federal-state jurisdiction", "mandatory climate reporting", "regulatory uncertainty", "voluntary disclosure", "scope 3 disclosure"], "datasets": ["sec_edgar", "cdp"], "thread": "2026-10-15#1"}, {"n": 3, "id": "2026-10-31#3", "headline": "Intel expects ~$600M revenue loss from deadly explosion at Israel's Fab 28, hitting 10nm-class Xeon supply", "theme": "Supply Chain Resilience", "source": "DatacenterDynamics", "summary": "An explosion in October 2026 at Intel's Kiryat Gat fab (Fab 28) killed two workers and seriously injured another. Intel expects to lose about $600M in revenue across Q4 2026 and Q1 2027, which works out to roughly $300M per quarter, almost all of it from 10nm-class Xeon server chips. CFO David Zinsner said production would start resuming after a two-week shutdown. Intel reported Q3 revenue of $16.5B (up 21% year over year) and guided Q4 to $15–16B, and its shares fell about 20% after hours.", "rq": "Compare the two-week shutdown with the two-quarter revenue loss, and model it as a recovery curve shaped by cycle time and work-in-process. · Treat a safety incident in the materials-handling stage as an upstream disruption rather than a typical supplier failure. Explore the link between operational safety and resilience. · Use server-chip market share over the following quarters to check whether lost sales were deferred or captured by competitors.", "problem": "A single incident at one fab during routine materials handling removes supply of a specific product line during a demand surge, and the effect lasts two quarters even though the plant was down for only two weeks. The open question is why a short shutdown turns into such a long revenue loss, and how much of that demand is lost for good or shifts to rivals rather than being made up later.", "related": ["Balancing Resilience and Efficiency: A Literature Review on Overcoming Supply Chain Disruptions", "Contracting for Infrequent Restoration and Recovery of Mission-Critical Systems"], "keywords": ["supplier concentration", "cyber-physical risk", "capacity utilization", "common-mode failure", "semiconductor fab disruption"], "datasets": ["call_transcripts", "factset_revere"], "thread": null}, {"n": 4, "id": "2026-10-31#4", "headline": "Meta buys environmental attribute certificates for 200,000 tons of Fortera low-carbon cement to anchor a Missouri plant", "theme": "Sustainable Operations", "source": "Canary Media", "summary": "Meta signed a multi-year agreement, announced around Oct 29, 2026, to buy environmental attribute certificates covering about 200,000 tons of cement from Fortera's first commercial low-carbon cement plant, planned for Ste. Genevieve, Missouri. The physical cement will be sold near the plant at market rates, while Meta claims the low-carbon benefit for data centers it builds elsewhere. Financial terms were not disclosed.", "rq": "Compare certificate offtake for materials with virtual power purchase agreements. The book-and-claim approach is borrowed from electricity markets. · Model the offtake as a demand-signaling contract under capacity investment uncertainty: how much committed volume gets a plant financed? · A puzzle worth noticing: if several buyers hold certificates from the same plant, how do they keep claims from overlapping?", "problem": "Low-carbon materials plants struggle to raise financing without assured demand. Buyers face a mismatch: cement doesn't usually travel far, so Meta cannot physically use output from Missouri at its data center sites. Separating the environmental attribute from the physical product solves the logistics problem but raises questions about whether the claimed reductions are additional and credible. The plant's construction timeline and financing status are not reported.", "related": ["A model for wind farm management with option interactions"], "keywords": ["demand signaling", "long-term supply contracts", "market-based emissions accounting", "embodied carbon", "capacity investment under uncertainty"], "datasets": ["epa_ghgrp", "cdp"], "thread": null}, {"n": 5, "id": "2026-10-31#5", "headline": "Schneider moves its eastern intermodal business from CSX to Norfolk Southern as NS pursues Union Pacific merger", "theme": "Logistics Decarbonization", "source": "FreightWaves", "summary": "Under an agreement announced Oct 29, 2026, Schneider National will make Norfolk Southern (NS) its main eastern rail provider in place of CSX, starting in November. Schneider's company-owned equipment, drivers and logistics operations, including about 23,900 chassis, 26,800 containers and 60+ rail hubs, move onto NS's 22-state intermodal network. Financial terms, the volume moving and a specific cutover date were not disclosed.", "rq": "Look at how NS and CSX intermodal carloads diverge after November, a single customer switch observable in weekly rail data. · Model the choice as a supplier-switching decision with relationship-specific assets such as hubs, chassis and drayage networks. · Consider whether the gain in mode shift is real or a zero-sum transfer between railroads, using emissions intensity per ton-mile across modes.", "problem": "A large intermodal provider is consolidating its eastern business with one railroad just as that railroad seeks a transcontinental merger. This bears on competition between the two eastern railroads, on whether NS's network and terminals can absorb the added volume, and on whether the move actually shifts freight from trucks to rail or mostly reallocates existing rail volume. CSX's response has not been reported.", "related": ["Scheduled Service Network Design for Freight Rail Transportation", "Introducing synchromodality: One missing link between transportation and supply chain management"], "keywords": ["intermodal rail", "mode shift", "supplier switching", "rail merger", "capacity utilization"], "datasets": ["sec_edgar", "freight_rates"], "thread": null}], "papers": [], "also": [{"title": "Massachusetts Will Require New Data Centers to Use Clean Energy", "url": "https://news.google.com/rss/articles/CBMimgFBVV95cUxPdHN0Y2Q2OUJ2TFNNVWNQZ05vZEMxOVdKaXQ5RjFteXVONGFLcFROSmZuQ1JrRTNRT0FIS19GTm9BaFphRnZRb0VTREpsbG9sUXJvZ29ZamFYVU1iX25PZ2lDSzltY3hWcHdNWW1Gb1lwdzMxMFJRdWRWdGVPT2lwbDFlZF9Db2ZyMi1Mc2llTlplcVVBYy0tQ21B?oc=5", "source": "EnergyNow.com"}, {"title": "GM–eVAC split highlights demand-side risk in US magnet buildout", "url": "https://news.google.com/rss/articles/CBMirAFBVV95cUxPanR4bXVmM29qZ19DSTBMY3A4Y3BrQXIzamdzVGMzM2hLUVRxQ2ktek4yU29KY1pvZEVPeVNlakJrSUlqUXB1ZjQ0Wl9jc2JqT1BKVS1rQVpuaDQ4UTR5dFA4cVBCUzZXWWFXU2Jta1FDRFUyNEJNNENkcG5ldi1tNnQ5MkxvUDBScUQ2T3lNdlpKanY0cTdBN2hxV3NiTGhZUFp0dVBIWlI5TFdG?oc=5", "source": "Benchmark Mineral Intelligence"}, {"title": "Major brands at risk of breaching EU deforestation law, investigation reveals", "url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxNN25RVHVJa001SkpQWmljbXV5RjF0REMzdnlUY1o0SjZRZmxoSEJKWHU2Z2pVTnFZdlBzNzV4NEpKbVJ5X3hVQkRjSmNoV05EWkd4bnVGQnBaRHBXX2ZCWlI5Q3ctcko2ekJYeFFPaHNjWkJvSnlNNTUtYTJ6UzgyNmZvT1dQVDZVOVZlWFVDNHNOcHd3SzFEc3JGal9MVHJheUdKS3JwZHlxMG5jTHBfLXBXUQ?oc=5", "source": "ENDS Europe"}, {"title": "US Adds Three Chinese Genomics Companies to Forced Labor Import Restrictions", "url": "https://news.google.com/rss/articles/CBMipgFBVV95cUxQcl9MWjRVQzg4R3p6RTUzWExUYWx4cm9qaEcyLXAtQ3NOUVlvbWNLUHRaQzlVRm1oTGljQjZrMFYyRXJRNU9yVXFVeGpNcERtZ1lzNzUtYzAzUnJXOVAxYzZxWXg3NXpaTGxReVNhcnRFdUFsYkQ5cFJ5czJ3ZXVwM3NzZVVLb3VjWWxpbGprZHJXTVV1dHRoNm5RMzQ1dmtBVWpYbDd3?oc=5", "source": "Clinical Lab Products"}, {"title": "European inland ports push for drought safeguards in EU climate law", "url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxQcGpLWGNkUkJQQThIUW51VjJJaDdIWTA1MkhFdWZySzlhb2k5djYwQ2I1ZnFjMXJkVUl6RS1aUERVb01oTEZ2WVJtYWZCeGhzWUJjbUViTE9QdU40b19EcFI2S3RrUFVyc3lCS2xXc1NLZlptQ2pQd1RIVzFKWWxFTVJVQ01NS1EwdUZQUkdrRWtmSm5C?oc=5", "source": "Splash247"}]}, {"date": "2026-10-30", "intro": "Today's issue covers five operational stories: Ember's estimate that only about 3% of data-centre capacity can shift load by 2030; a policy reversal in Hungary's EV battery hub; Kroger's move toward direct sourcing; BMW's recycled-content push; and carrier-level emissions spreads on container lanes. One POM paper on free-shipping thresholds and product returns closes the issue.", "items": [{"n": 1, "id": "2026-10-30#1", "headline": "Ember: only about 3% of global data-centre capacity can shift power demand by 2030; onsite generation is a much bigger lever", "theme": "Energy & AI Data Centers", "source": "Latitude Media", "summary": "On 29 Oct 2026, think tank Ember estimated that about 3% of global data-centre capacity (not 3% of data centres) could take part in load shifting by 2030. The reason is that about 87% of 2030 capacity is expected to run cloud, enterprise IT and AI inference, which must respond to users in real time. Across nine markets, load shifting cuts peak demand by only about 0.1–0.6% in seven, and by about 1.5% in Ireland and Malaysia, where data centres could reach roughly a quarter of peak demand.", "rq": "Treat flexibility as a portfolio problem: workload mix (training vs inference) determines the shiftable fraction, which in turn sets the value of onsite storage versus generation. · Puzzle: why does flexibility matter far more in Ireland and Malaysia than in Texas? Data-centre share of peak demand looks like the key moderator. · Planning under private information: model a utility that cannot observe a large load's onsite generation and must decide how much capacity to build.", "problem": "If most data-centre load is effectively inflexible, flexibility-based connection deals and demand-response assumptions may overstate how much grid capacity can be avoided. The alternative lever, onsite generation, is often gas and risks fossil lock-in. Malaysia's pairing of data centres with large solar and battery projects is the counterexample. And if planners ignore onsite generation that already exists, two sets of power plants could be built for the same demand, with consumers paying for both.", "related": ["A Review of Flexible Processes and Operations", "Online Rack Placement in Large-Scale Data Centers: Online Sampling Optimization and Deployment"], "keywords": ["data center electricity demand", "demand response", "interruptible load", "load forecasting", "gas turbines"], "datasets": ["eia930", "ercot_reports"], "thread": null}, {"n": 2, "id": "2026-10-30#2", "headline": "Hungary's post-Orban government halts or restricts battery plants, unsettling Europe's EV battery hub", "theme": "Critical Minerals & Batteries", "source": "Automotive News", "summary": "Under new Prime Minister Peter Magyar, elected in April 2026, Hungary has tightened environmental oversight of the battery plants that Viktor Orban courted. Semcorp's separator factory in Debrecen is entering its fifth month of shutdown after contamination was found in tests; Semcorp makes a reported 40% of the world's separators. CATL's €7.34bn, 100 GWh Debrecen project had cell production paused over workers' nickel exposure, and on 16 Aug 2026 the government said key investment projects would no longer be exempt from environmental and planning rules.", "rq": "Real-options lens: how does a political regime change alter the value of the option to expand or abandon a phased battery plant? · Natural experiment: compare announced capacity, expansion phases and supplier-qualification moves by firms with Hungarian versus other EU battery sites before and after April 2026. · Supplier concentration: what does a months-long outage at a separator maker with a reported 40% global share reveal about substitutability in battery bills of materials?", "problem": "Host-country support has reversed for capacity that is already sunk. Firms must now decide whether to remediate and stay, scale back planned phases, or relocate. Downstream carmakers face supply risk for critical components, including a separator supplier with a large global share. Whether CATL's cell production has restarted is not confirmed.", "related": ["Global operations and supply‐chain management under the political economy", "Political Uncertainty and the Timing of Mass Layoffs"], "keywords": ["regulatory uncertainty", "facility siting", "supplier concentration", "regulatory enforcement", "capacity investment under uncertainty"], "datasets": ["battery_supply", "un_comtrade"], "thread": null}, {"n": 3, "id": "2026-10-30#3", "headline": "Kroger targets more than 10% direct sourcing, up from under 1%, with owned import hubs in South America and Asia", "theme": "Supply Chain Resilience", "source": "Supply Chain Dive", "summary": "At its 20 Oct 2026 investor day, Kroger CFO David Kennerley said the grocer aims to source more than 10% of goods directly from producers, up from under 1% today; the target year was not confirmed in the notes. Kroger is launching sourcing hubs in South America and Asia toward a 'fully owned import distribution model over time,' with its first international hire in place in South America and Asia expansion planned for 2027. About 40% of its imported grapes for the November 2026 season were bought directly from growers in Peru.", "rq": "Make-or-buy with risk pooling: when does an intermediary that pools many retailers' seasonal produce demand beat direct sourcing? · Test for shifts in Kroger's consignee and shipper patterns in import records before and after the strategy, product by product (grapes, citrus, shrimp).", "problem": "Cutting out importers and intermediaries captures their margin and gives Kroger more visibility. In exchange, Kroger takes on quality, phytosanitary, logistics and seasonal-volume risk that intermediaries used to pool across many buyers. The question is whether vertical integration of import and distribution improves cost and resilience, or concentrates risk for perishables.", "related": ["Production Chain Organization in the Digital Age: Information Technology Use and Vertical Integration in U.S. Manufacturing", "Supply-Side Story: Risks, Guarantees, Competition, and Information Asymmetry"], "keywords": ["vertical integration", "seasonal sourcing", "produce supply chains", "cold chain", "supplier diversification"], "datasets": ["usda_ams", "census_trade"], "thread": null}, {"n": 4, "id": "2026-10-30#4", "headline": "BMW reports one-third recycled content and targets at least 50% by 2030, betting on direct battery-cell recycling", "theme": "Circular Economy", "source": "Recycling International", "summary": "According to IndexBox relaying Recycling International, BMW told a Berlin audience it has reached one-third recycled content in its vehicles and aims for at least 50% by 2030; what the one-third covers is unclear. BMW's €10m Cell Recycling Competence Centre in Salching, Bavaria, opened in 2025. It develops 'direct recycling' that returns lithium, cobalt, graphite and nickel to battery production without energy-heavy heat or chemical processing.", "rq": "Closed-loop supply models with stochastic, lagged returns: how does EV fleet age limit achievable recycled content compared with relying on production scrap? · Make-or-buy for recycling capability: compare OEMs with in-house recycling centres to those using contracts with independent recyclers.", "problem": "Meeting a 50% recycled-content target requires secure secondary-material supply. Over the near term, though, the main feedstock is production scrap, because the EV fleet is young and few end-of-life packs are returning. BMW also has to decide whether to build in-house direct-recycling capability or rely on external recyclers and the material flows that currently leave Europe.", "related": ["LOOKING FORWARD, PUSHING BACK AND PEERING SIDEWAYS: ANALYZING THE SUSTAINABILITY OF INDUSTRIAL SYMBIOSIS"], "keywords": ["battery recycling", "secondary materials", "closed-loop supply chain", "raw material security", "reverse logistics"], "datasets": ["battery_supply", "usgs_minerals"], "thread": null}, {"n": 5, "id": "2026-10-30#5", "headline": "VesselBot: carrier choice changes well-to-wake emissions intensity by up to 35% on the same container trade", "theme": "Logistics Decarbonization", "source": "Hellenic Shipping News", "summary": "VesselBot's Q3 2026 report covers 83,817 voyages by 6,730 container vessels. It finds a 20–35% gap in well-to-wake emissions intensity between the most and least efficient carriers on four major fronthaul trades. Fleet average intensity was 235.1 g CO₂e per TEU-km (up 0.5% year on year), while total emissions fell 1.9% to 55.5m t and cargo moved rose 1.2% to 712bn TEU-km.", "rq": "Metric choice as a puzzle: per-voyage versus per-TEU-km rankings diverge, and utilization drives most of the gap. Which metric should a procurement contract reward? · Green procurement auction: model a shipper that weights carrier bids by emissions intensity, and ask whether this induces carriers to raise utilization or simply re-sort cargo across lanes.", "problem": "Shippers reporting Scope 3 emissions usually rely on lane-average default factors, which hide large carrier-level differences. That weakens the incentive to choose lower-emission carriers. The ranking also depends on the metric: Evergreen is the worst per voyage but the best per TEU-km.", "related": ["Vessel sharing and its impact on maritime operations and carbon emissions"], "keywords": ["scope 3 disclosure", "capacity utilization", "market-based emissions accounting", "procurement auctions", "chokepoint disruption"], "datasets": ["noaa_ais", "cdp"], "thread": null}], "papers": [{"title": "EXPRESS: The Role of Ease-of-Return Experience on Contingent Free Shipping Policies", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261505545"}], "also": [{"title": "Reshoring and foreign direct investment added 247K jobs in 2025: report", "url": "https://www.manufacturingdive.com/news/reshoring-foreign-direct-investment-247k-jobs-2025-report-reshoring-initiative/873070/", "source": "Manufacturing Dive"}, {"title": "AEP increases investment plan 30% to $100B on gen, transmission spending", "url": "https://www.utilitydive.com/news/aep-transmission-data-center-earnings/873189/", "source": "Utility Dive"}, {"title": "Avocado harvest stoppage in Michoacán threatens US supplies", "url": "https://news.google.com/rss/articles/CBMidkFVX3lxTFB6eE5GaE9ia1Z0Rm9wOENRczk1UnlQSm9TT0pYT3JIOUZ6eVYzWmJzbklfZHg2UDlSNFBGelBnQXFBU0NpaUdhdmhXQ01ONlVpR2ZLSkRYTlA1Z1pHWlllekJUMEhpdkZNcVJFemZLZ1BhN2NoS1E?oc=5", "source": "FreshFruitPortal.com"}, {"title": "Battery supply chain: Congolese workers file complaint with CATL Germany over alleged labor rights violations", "url": "https://news.google.com/rss/articles/CBMi1wFBVV95cUxNUnFrbmJzcmpRanhCUjctVGdMVlNORFBWRmo5emttMHFRbWtaVXFuNmQtWklQdlJOR0pzaTN5ZmpSMmUzbEJiY25ZbzJJQktOY3FaTjFUendaYUlad0VRSzcyYXdlOC1GMjJhWl9uTFh1YWE0ZmJRWTZyQzBfVlJHQVlOUWtWOWQwdm5ONzlUUFgwYTU0dWZCM0x0UkJXUHhqek16ajJuLVpteXpyTFVkaXZvejhmbGtzSFZ1dk9pWEk0M1ZxWGNFY0h3TnpKdmtZMTl5b19uRQ?oc=5", "source": "Table.Briefings"}, {"title": "California AG Bonta sues Waste Connections over closed Chiquita landfill", "url": "https://www.wastedive.com/news/landfill-waste-connections-chiquita-bonta-gfl-wisconsin/873188/", "source": "Waste Dive"}]}, {"date": "2026-10-29", "intro": "Today's issue spans a port–rail bottleneck at LA–Long Beach, a gas-turbine supply crunch reaching 2031, Malaysia's 30% renewables rule for data centers, VW's circular-economy hub at a plant facing possible closure, and Coty's move from air freight to ocean and rail. Most items center on capacity: rail cars, turbine factories, grid power and car-plant floor space.", "items": [{"n": 1, "id": "2026-10-29#1", "headline": "About 35,700 import containers wait for on-dock rail at LA–Long Beach amid record volumes and reported railcar shortages", "theme": "Supply Chain Resilience", "source": "FreightWaves", "summary": "On 26 Oct, 35,688 import containers were waiting for on-dock rail at the ports of Los Angeles and Long Beach. Of these, 10,562 had been at the terminals for nine days or more. Los Angeles had 19,626 waiting (41.4% for nine days or more) and Long Beach had 16,062 (15.1%). Average rail dwell rose to 7.19 days in September from 6.75 in August, while local-truck dwell rose to 3.18 days from 2.95.", "rq": "The gap between the two ports (41.4% vs 15.1% of boxes waiting nine days or more) is a puzzle worth unpacking: terminal operator, railroad mix or carrier alliances? · Queueing and network models of tandem stages (vessel → yard → rail) can show how a bottleneck migrates from berth to rail. · Treat the possible 1 Nov strike as an event: do importers pre-shift cargo to truck or to other ports in anticipation?", "problem": "Marine-side capacity is keeping up, but the inland rail link is not, so containers pile up at terminals. That ties up yard space and delays inland deliveries. Shippers must choose between waiting for rail or switching to more expensive trucking or transloading. A possible strike adds a second, labor-driven shock on top of the capacity squeeze.", "related": ["Scheduled Service Network Design for Freight Rail Transportation", "Introducing synchromodality: One missing link between transportation and supply chain management"], "keywords": ["port congestion", "intermodal rail", "labor disruption", "capacity utilization", "dwell time"], "datasets": ["noaa_ais", "panjiva"], "thread": null}, {"n": 2, "id": "2026-10-29#2", "headline": "Mitsubishi Power says new gas turbine orders now face delivery around 2031", "theme": "Energy & AI Data Centers", "source": "Energy News Beat", "summary": "Akihiro Ondo, CEO of Mitsubishi Power Asia Pacific, said at Singapore International Energy Week on 27 Oct that new gas turbine orders face delivery \"at around 2031.\" He added that 2028–2029 slots are almost full. He projected this year's global orders at about 70–80 GW, well above average, with most demand from North America and growing interest from Southeast Asia, especially Malaysia and Singapore, driven by AI.", "rq": "The situation resembles the semiconductor equipment cycle: think about forecast inflation and phantom orders when buyers race for scarce slots. · Capacity expansion under demand uncertainty in an oligopoly: why might OEMs rationally under-build? · Compare turbine lead times with the timing of data center siting and interconnection to see whether equipment or the grid is the binding constraint.", "problem": "Data center developers and utilities that want firm gas generation face lead times of five years or more. That pushes them to reserve slots early on uncertain demand forecasts, turn to other power sources, or delay projects. OEMs must decide how far to expand capacity without overbuilding if AI demand cools.", "related": ["An Empirical Analysis of Forecast Sharing in the Semiconductor Equipment Supply Chain", "Capacity and Inventory Management: Review, Trends, and Projections"], "keywords": ["supplier concentration", "capacity investment under uncertainty", "data center electricity demand", "pre-buy behavior", "gas turbines"], "datasets": ["eia860", "lbnl_queues"], "thread": null}, {"n": 3, "id": "2026-10-29#3", "headline": "Malaysia approves a 30% renewable energy requirement for data centers", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "On 27 Oct, Deputy Prime Minister and energy transition minister Fadillah Yusof told Parliament that the government has approved a requirement for data centers to use at least 30% renewable energy, based on total capacity or energy consumption. The Energy Commission is drafting a framework covering self-generation and the 30% rule. Operators are encouraged to install their own solar so costs aren't passed on to other consumers. On 28 Oct he added that data centers need backup generators that can be used to manage demand when the grid is under strain.", "rq": "Whether the 30% is measured on capacity or on consumption changes the economics a lot; a simple procurement model can show how. · Cross-country comparison of renewable mandates for data centers, as a policy-design and siting lens. · The 58.5% gap between contracted and used power is a load-forecasting and overbooking puzzle with parallels in US large-load tariffs.", "problem": "The rule tries to decarbonize fast data center growth and protect other ratepayers from the costs. But the compliance basis (capacity vs consumption) is unclear, coverage of existing sites is unconfirmed, and no start date or penalties have been reported. Operators must choose between on-site solar, CRESS contracts and other options under that uncertainty, and the requirement may affect where they choose to build in Southeast Asia.", "related": ["Meeting Corporate Renewable Power Targets"], "keywords": ["data center electricity demand", "regulatory uncertainty", "power purchase agreements", "facility siting", "load forecasting"], "datasets": ["state_puc"], "thread": null}, {"n": 4, "id": "2026-10-29#4", "headline": "VW opens its first circular economy hub at the Zwickau EV plant, which faces possible closure after 2031", "theme": "Circular Economy", "source": "Reuters", "summary": "On 28 Oct, Volkswagen unveiled its first \"Circular Economy Hub\" at its all-electric Zwickau plant in Saxony. From 2027, 100 retrained workers will dismantle 4,100 vehicles a year. VW plans to invest up to €90M and Saxony has pledged €10.7M. The hub is meant to secure up to 1,000 jobs over the longer term, but about 8,000 jobs at the site are at risk and no vehicle production is planned beyond 2031.", "rq": "Remanufacturing procurement under uncertain core condition: what does 4,100 vehicles a year imply for hub utilization? · Repurposing brownfield capacity versus closing it: a real-options or capacity-transition lens. · Compare OEM-run dismantling hubs with independent end-of-life vehicle recyclers on scale and profitability.", "problem": "VW is repurposing stranded vehicle-assembly capacity for dismantling and recycling. But 4,100 vehicles a year is small next to the plant's workforce, and company sources say recycling alone won't save the plant. The open question is whether circular operations can be a viable business or mainly serve as a politically motivated soft landing.", "related": ["Technical Note—Optimal Procurement in Remanufacturing Systems with Uncertain Used-Item Condition", "New-Product Diffusion in Closed-Loop Supply Chains"], "keywords": ["closed-loop supply chain", "reverse logistics", "secondary materials", "capacity utilization", "plant closure"], "datasets": [], "thread": null}, {"n": 5, "id": "2026-10-29#5", "headline": "Coty reports a 48% cut in air freight since 2019 but a 33% jump in air freight emissions in FY2026", "theme": "Logistics Decarbonization", "source": "Supply Chain Dive", "summary": "According to its FY2026 sustainability report, Coty has cut air freight by 48% since 2019 and aims to bring air freight reliance as close to zero as possible. However, air freight emissions rose 33% from FY2025 to FY2026 because of global supply chain disruptions. Coty says moving freight to sea and rail avoided an estimated 3% rise in air freight volumes. Road makes up 91% of shipped weight, and Coty put three EVs into service in Goiânia, Brazil.", "rq": "Treat air freight as an expediting option: inventory models with dual modes (fast vs slow supply) fit naturally. · Notice the puzzle of a falling long-run trend alongside a one-year spike: disruptions can quickly reverse progress on logistics decarbonization. · Compare how transport metrics are disclosed across consumer goods firms, through a greenwashing or disclosure-quality lens.", "problem": "Moving from air to ocean or rail cuts emissions and cost but lengthens lead times and increases exposure to disruptions. When disruptions hit, firms fall back on air, which is what drove the 33% rise. This raises the question of how durable mode-shift commitments are, and how comparable self-reported logistics metrics are across firms.", "related": ["Shipping to Heterogeneous Customers with Competing Carriers", "Introducing synchromodality: One missing link between transportation and supply chain management"], "keywords": ["scope 3 disclosure", "voluntary disclosure", "mode shift", "freight rates", "inventory management"], "datasets": ["cdp", "sec_edgar"], "thread": null}], "papers": [{"title": "From Employer Responsibility to Environmental Irresponsibility: Unintended Impacts of Social Insurance Law on Pollution Emissions", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2025.00714"}], "also": [{"title": "DOE announces $10.1B in loans to Constellation, Alliant, for 3.7 GW", "url": "https://www.utilitydive.com/news/doe-loans-constellation-alliant-nuclear-gas/873011/", "source": "Utility Dive"}, {"title": "EU Sustainable Finance and Investor Groups Push Back Against Weaker Sustainability Reporting Rules for Non-EU Companies", "url": "https://www.esgtoday.com/eu-sustainable-finance-investor-groups-push-back-against-weaker-sustainability-reporting-rules-for-non-eu-companies/?utm_source=rss&utm_medium=rss&utm_campaign=eu-sustainable-finance-investor-groups-push-back-against-weaker-sustainability-reporting-rules-for-non-eu-companies", "source": "ESG Today"}, {"title": "USDA to fund 8 fertilizer manufacturing projects totaling more than $1.3B", "url": "https://www.manufacturingdive.com/news/usda-fund-8-fertilizer-manufacturing-projects-totaling-1-billion/873026/", "source": "Manufacturing Dive"}, {"title": "EUDR Enters Final Countdown as Coffee Industry Faces New Challenge: Soluble Coffee Added to Scope", "url": "https://news.google.com/rss/articles/CBMi0AFBVV95cUxPc1FTQlZRR1RZaXhCYkZTUWQxZkhoUERSLWlvMlFyQTQwNmN1RlBKZ3poR1BMTVJqVmRuemIzaEI0YThjQXNkdnhZTFRWZXBVakRwWXJCRnUtLU9oU2NVN3RRcjhCOHljOGwzUVNjdk9Hdlk5cG91MzdqQk1ob09BNy03OGVxdklsdE5Fb2t5YXRZb0RJVUJKaElTWjRpLXE1R1RwUloycXFZR1ZFbEV2WUhIT0NIUVhBYlBnekYtQVV3OGhsMHBRNzMzVGYyOFQy?oc=5", "source": "StoneX"}, {"title": "O-I Glass feels the pain from higher freight, energy, trade charges", "url": "https://www.packagingdive.com/news/oi-glass-q3-2026-packaging-earnings/872966/", "source": "Packaging Dive"}]}, {"date": "2026-10-28", "intro": "Today's issue covers a battery-recycling acquisition whose headline doesn't match the verified facts, BNEF's first US storage forecast to count on-site data center batteries, the EU's proposed Climate Resilience Law, a Mexican trucker strike over cargo theft, and RepRisk's count of greenwashing shifting toward energy-transition sectors.", "items": [{"n": 1, "id": "2026-10-28#1", "headline": "Clarios completes purchase of Ecobat's German and Austrian lead-acid recycling sites; reported US deal and $6B figure unverified", "theme": "Circular Economy", "source": "Dealroom", "summary": "The source headline claimed Clarios bought Ecobat's US recycling arm in a $6B deal, but no source confirms a US deal or a $6B figure. What is confirmed: in August 2025, Dallas-based Ecobat agreed to sell its lead-acid battery recycling and specialty lead operations in Freiberg and Braubach (Germany) and Arnoldstein (Austria) to Glendale, Wisconsin-based battery maker Clarios, at an undisclosed price. The EU cleared the deal in April 2026, Clarios completed the purchase in early May 2026, and the formal EU decision was published Oct. 14, 2026.", "rq": "Vertical integration into recycling as a feedstock-security move: compare transaction-cost and foreclosure models with closed-loop supply chain models in which the OEM controls returns · Puzzle: why would a recycler sell its mature, cash-generating lead business to fund lithium-ion recycling, whose volumes are still uncertain? · The gap between deal announcement, EU clearance and completion gives event dates to use for studying scrap pricing or competitor responses", "problem": "A battery maker is buying the recyclers that supply its secondary lead. This raises questions about who controls scarce scrap feedstock, whether independent battery makers lose access to recycled lead, and whether recyclers are splitting into legacy lead-acid and growth lithium-ion businesses. The garbled headline is also a reminder to check deal coverage before using it as an event.", "related": ["Closed‐loop supply chains in process industries: An empirical study of producer re‐use issues", "Closed‐loop supply chains with product remanufacturing: Challenges and opportunities"], "keywords": ["battery recycling", "secondary materials", "closed-loop supply chain", "vertical integration", "raw material security"], "datasets": ["usgs_minerals", "sec_edgar"], "thread": null}, {"n": 2, "id": "2026-10-28#2", "headline": "BNEF raises 10-year US storage forecast 30%, counting on-site data center batteries for the first time", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "BloombergNEF's Oct. 22, 2026 outlook raises expected US storage installations over the next decade by 30% versus six months earlier. It projects 213.9 GW cumulative by 2030 and 434.4 GW by 2036, despite a 40.9% combined duty on Chinese stationary batteries and rising project costs. On-site data center storage is forecast to jump from 500 MW / 1.4 GWh in 2025 to 4.9 GW / 7.4 GWh in 2026 and 6.3 GW / 8.4 GWh in 2027.", "rq": "Compare forecast vintages: how much do revisions track announced hyperscaler orders versus policy changes, and what does that mean for capacity investment under uncertainty? · Treat behind-the-meter versus grid-side storage as a make-or-buy decision for flexibility, set against interconnection delay · A virtual power plant (Google/Voltus) and on-site batteries are substitute flexibility strategies; the fact that both are expanding at once is a puzzle worth examining", "problem": "Hyperscalers are deciding whether to put storage behind the meter, alongside on-site gas, or to rely on grid-side storage and demand flexibility. These choices shift who pays for capacity and reliability. They are being made under tariff barriers, cost inflation and forecasts that change by 30% in six months.", "related": ["The Unintended Carbon Impacts of Large-Scale Electricity Storage", "The Value of Coordination in Multimarket Bidding of Grid Energy Storage"], "keywords": ["battery storage", "data center electricity demand", "capacity investment under uncertainty", "interconnection queues", "antidumping duties"], "datasets": ["eia860", "lbnl_queues"], "thread": null}, {"n": 3, "id": "2026-10-28#3", "headline": "European Commission proposes Climate Resilience Law with single reference warming trajectory and mandatory, more frequent risk assessments", "theme": "Climate Risk & Adaptation", "source": "ESG Today", "summary": "On Oct. 27, 2026, the European Commission presented a Climate Resilience Framework built around a proposed European Climate Resilience Law. The law would set one reference global warming trajectory for risk assessments, replace multiple national plans with a single strategic resilience plan, and require better, more frequent climate risk assessments. The Commission estimates about €70B a year is needed for adaptation and says adaptation could return more than 10 times its cost in avoided damage.", "rq": "A shift from many scenarios to one reference trajectory is a standardization shock; look at the disclosure-comparability literature for analogues · Facility siting and supplier selection under a common hazard map: robust or stochastic facility-location models with climate-dependent disruption probabilities · Compare with how heat exposure hits firm revenues (see R25) to think about which sectors gain most from harmonized assessments", "problem": "Physical climate risk is assessed against inconsistent scenarios and plans, so firms, insurers and governments struggle to price and fund adaptation. Requiring a single reference trajectory could change how firms site facilities, choose suppliers and insure assets. But the content and timing are uncertain, and it is unclear whether private capital will actually follow public incentives.", "related": ["IMPACT OF DISASTERS ON FIRMS IN DIFFERENT SECTORS: IMPLICATIONS FOR SUPPLY CHAINS", "Climate Change, Firm Performance, and Investor Surprises"], "keywords": ["supplier region risk", "facility siting", "regulatory uncertainty", "climate adaptation", "mandatory climate reporting"], "datasets": ["cdp", "noaa_storm_events"], "thread": null}, {"n": 4, "id": "2026-10-28#4", "headline": "Mexican trucking groups agree to four rounds of talks with government after strike over cargo theft and extortion", "theme": "Supply Chain Resilience", "source": "FreightWaves", "summary": "A trucker strike over cargo theft, violent highway robbery, extortion and rising costs began Monday, Oct. 26, 2026. On Tuesday, Oct. 27, Mexico's Interior Ministry (Segob) and the CANACAR, HAMOTAC and FEMATRAC trucking groups agreed to four high-level negotiating sessions on highway security, infrastructure, tax incentives, regulation and operating costs. The size of the strike is disputed: Segob counted 38 protest sites in 19 states with 691 vehicles and 858 participants, while CANACAR said protests reached all 32 states.", "rq": "A short, dated strike gives an event window: look for effects on border crossings and cross-border truck volumes and how long recovery takes · Cargo theft as a chronic disruption versus strikes as acute ones: robustness versus resilience framing (see R32) · Puzzle: how do shippers price and allocate theft risk between carriers, insurers and buffer inventory when security is a public good?", "problem": "Insecurity on the roads raises carriers' costs and insurance, and causes losses, delays and now labor action. Shippers and carriers have to choose between absorbing theft risk, rerouting, using escorts or shifting modes. Government responses (security, tax incentives) are under negotiation. Whether this was a one-day shock or the start of a longer pattern remains unclear.", "related": ["A Contingent Resource‐Based Perspective of Supply Chain Resilience and Robustness", "Perspectives on risk management in supply chains"], "keywords": ["cross-border trucking", "nearshoring logistics", "driver supply shock", "freight rates", "labor disruption"], "datasets": ["bts_border_crossing", "bts_transborder"], "thread": "2026-10-27#4"}, {"n": 5, "id": "2026-10-28#5", "headline": "RepRisk: companies linked to greenwashing up 28% to 1,594, with energy-transition sectors' share rising to 29%", "theme": "ESG & Disclosure", "source": "ESG Dive", "summary": "RepRisk's fifth annual Greenwashing Report, released Oct. 6, 2026 for its July–June report year, links 1,594 companies to greenwashing incidents, up 28% from 1,243. Alternative energy, mining, industrial metals, utilities, and software and computer services made up 29% of incidents, up from 18% in 2022, while oil and gas fell 4.9 points. For the first time, biodiversity links (300, up more than 41% from 216) outnumbered climate, emissions and pollution links (275).", "rq": "Separate detection from behavior: does incident growth track media attention (e.g., GDELT volume) more than operational change? · The rise of biodiversity claims points to nature-related disclosure as the next greenwashing frontier · Gap between disclosure and action: compare the 'glossy green' banks evidence (R46) with RepRisk links for financial firms", "problem": "Scrutiny is moving from fossil-fuel firms to companies selling transition products and services, including software and computer services, and to nature claims. These firms' environmental claims may be overstated or simply harder to verify. It is unclear whether the rise reflects more misconduct, more scrutiny or measurement artifacts.", "related": ["Do Corporate Social Responsibility Engagements Lead to Real Environmental, Social, and Governance Impact?", "“Glossy Green” Banks: The Disconnect Between Environmental Disclosures and Lending Activities"], "keywords": ["greenwashing", "biodiversity risk", "nature-related disclosure", "voluntary disclosure", "litigation risk"], "datasets": ["reprisk", "gdelt"], "thread": null}], "papers": [{"title": "EXPRESS: Optimal Return Policies with Heterogeneous Search Rewards", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261504549"}], "also": [{"title": "Gov. Healey executive order restricts data center construction", "url": "https://news.google.com/rss/articles/CBMipwFBVV95cUxOcFpzMVdabHVidzVQRGdfMHR0X3g2V2NvSXRmZWZtUTNyUnJyZEZQRXNWYWQ2TXpnLXExY3N0WXFNNWt0cDJlZTdJbDBuQXV6WUcyejJwQUlBMVE1MjdCVjc3VUZLSHdxVVJuaWp3TFR6X2dsN1hJUU1oSEoxTTAzNWR2NXVvd2VZSDBMckRNcktwOU1CT05fUHpHS3lYTGFzTnFvZ1JCQQ?oc=5", "source": "The Tufts Daily"}, {"title": "Chinese mainland spokesperson slams reports of TSMC asking suppliers to assess alternatives that do not use mainland rare earths", "url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTE9UTEc2d3BYUE9wdkpINVNSX2docEtHaEg0UTVUTk90Y1k1N2FVelI4QUVaOHZhTjlpejZlU2FHbG01bU5QV2I3Rk9QZU9pX09PeUVDU3BtSWd2NVFCSkswMjN3?oc=5", "source": "Global Times"}, {"title": "| Cambodia overtakes India in 9 US apparel categories: $770 mn swing", "url": "https://news.google.com/rss/articles/CBMiiwJBVV95cUxPT3RZbFRBWDFiTnZzUkhBS3kzZDM3Z2trYjJYYUNHOXFWbnBoOHFhZElfXzJRUExLYWRCeXVzWGs3ZlpabENpZFVFQkcxYjJzZUtQMXpGQ0VZUXpOb0NMZVJBSVAway1FcHRRbzJ5dXlCa29yWkhfYnVldDk4WEllX0ZDNFM4VHNlTFlySjQ1dkdvNlY2clQtdnVfWnhYNlRDOGx3aUR4c2hyclZjSGhheUVyaHEzVDNDeHhaY2ZibFROd1RNMExSb004a1VWbXQwc0VKZjdIWGZuNFd6R2JlbTliVjl0NGZwdWFCaVFNRVg3Zk9kU0xqbU5oWTc2UUtyVkRnOHRBamlXVDg?oc=5", "source": "Fibre2Fashion"}, {"title": "Seven Japanese Companies Jointly Announce to Build and Operate Four Ammonia-Fueled Car Carriers and Commercialize the Ammonia Bunkering Business", "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE85dU5sVkY4YWNNOEJhZW9jSGpTUmpaS0o5cTFhWkl1eS04UU8yRGhneUFtUmQyY3JLZDdKcWNKTFZsdnd4U1BjbVNTby1zVTZSSFFnMXpkZUN1dG4zS19LREwwbzk?oc=5", "source": "日本郵船株式会社"}, {"title": "ILWU Watchmen May Strike at LA/Long Beach, With Effects on Half the Port", "url": "https://news.google.com/rss/articles/CBMirwFBVV95cUxObHBhd2F5LURXNTJhSkhwRVNPb2pVazIyTjlyZXpoUkxuME5QdHc5MFNMWTBIMUI2dW5RR2phN1RIdG5HaGJHblNwMlQyQnNYVTNGNnJwRGxlNEl2d3I4T0hVWFJpOWFfTTFrZjFrakl6dWhZNjRDRVNQaUtUMXJndUM5UnpucFEwaVRBYjlaVDlMR1AxUFpFbC1ncGc5NVVGaHlRVGRyV2FPaGFaOHZB?oc=5", "source": "The Maritime Executive"}]}, {"date": "2026-10-27", "intro": "Two hourly clean-power rules are moving in different directions. GHG Protocol is delaying hourly matching for corporate Scope 2 claims, while Spain keeps an 80% hourly renewable requirement for data centers even as it loosens other parts of its draft. Also in this issue: Anthropic's S-1 puts numbers on AI compute contracting, Mexican truckers strike on nearshoring corridors, and Shaw runs carpet take-back on empty backhauls.", "items": [{"n": 1, "id": "2026-10-27#1", "headline": "GHG Protocol proposes delaying mandatory hourly matching and deliverability in Scope 2 accounting after weak corporate support", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "GHG Protocol is revising its Scope 2 standard. It now proposes that companies \"should\" use a stricter Method 1, which requires hourly matching and deliverability, but \"may\" keep current rules (Method 2) until an unspecified future date, and must disclose which method they use. In the consultation, only 12% of companies supported hourly matching and 19% supported deliverability. A new consultation is planned for Q2 2027, feeding a joint GHG Protocol–ISO Corporate Standard expected in Q4 2028.", "rq": "Disclosing which method a firm uses creates a self-selection signal. Which firms voluntarily adopt Method 1 early, and does early adoption correlate with existing 24/7 procurement or grid mix? · Contract-portfolio models of corporate renewable targets (VPPAs under uncertainty) could be extended to ask how hourly constraints change the optimal mix of long-term versus spot procurement. · Consultation responses are a form of corporate lobbying. Comparing who objected with firms' location-based versus market-based Scope 2 gap is one angle.", "problem": "The standard-setter must trade off accuracy against participation. Stricter rules would make renewable claims reflect physical grid impact more closely. But companies warned of these costs:\n- Hourly matching could discourage participation in voluntary clean-energy markets (87%).\n- Hourly matching would add reporting burden and cost (86%).\n- Deliverability would narrow where firms can invest (87%).\n- Deliverability could push buyers from long-term contracts toward spot purchases (72%).\n\nThe compromise leaves the mandatory date open. Method 1 also becomes required only if data meeting quality criteria exists, which could delay it further.", "related": ["Meeting Corporate Renewable Power Targets", "Market Reaction to Mandatory Nonfinancial Disclosure"], "keywords": ["market-based emissions accounting", "sustainability standards", "corporate lobbying", "power purchase agreements", "voluntary disclosure"], "datasets": ["cdp", "eia930"], "thread": null}, {"n": 2, "id": "2026-10-27#2", "headline": "Anthropic's S-1 discloses roughly $265bn in fixed compute commitments and $417bn in new lease and capacity agreements", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "Anthropic filed a 335-page S-1 to list on Nasdaq as ANT. DCD reports three separate commitment figures:\n- About $265.6bn in fixed or minimum commitments, with 1–20 year terms.\n- About $417bn in future minimum payments under new or amended leases and commercial agreements, mostly for compute. These start in 2026–27 and run up to 20 years.\n- An estimated $125–150bn for capacity delivered in 2028–2031.\n\nIn H1 2026, revenue rose 1,300% to $16.3bn. The net loss was $80.7bn, of which $72.4bn was a one-off charge, and the operating loss was $693m. (Disclosure: this newsletter is drafted with Claude, an Anthropic model. Figures come from DCD and have not been checked against the filing.)", "rq": "Capacity reservation contracts with transfer rights are a lens here. What happens when a buyer over-reserves compute and can resell, or can't? · S-1 and 10-K commitment tables (contractual obligations, lease maturities) across AI firms and hyperscalers could be compared to map who bears capacity risk along the chain. · The ratio of compute-cost growth to revenue growth is a quantified scaling signal worth tracking across filings.", "problem": "The firm is locking in decades of fixed capacity while demand is growing fast but highly uncertain. Some agreements have no fixed amount, but the filing says payments are \"expected to be significant.\" This raises three linked questions:\n- How much capacity risk is shifted to suppliers, and how much to Anthropic and its future shareholders?\n- How are payments structured (escrow, convertible notes)?\n- What power, water and climate exposure comes with the capacity?", "related": ["Should suppliers allow capacity transfers?"], "keywords": ["capacity investment under uncertainty", "long-term supply contracts", "data center electricity demand", "supplier concentration", "capital expenditure"], "datasets": ["sec_edgar", "call_transcripts"], "thread": null}, {"n": 3, "id": "2026-10-27#3", "headline": "Spain softens draft data center decree: 10 MW threshold, 36-month matching window, but 80% hourly renewable coverage stays", "theme": "Energy & AI Data Centers", "source": "Reuters", "summary": "On October 26, 2026, Spain's energy ministry released a more flexible draft decree on data centers. Changes reported by Reuters:\n- The rules now apply only above 10 MW, up from 1 MW.\n- New renewable capacity matching each new megawatt can now be built within 36 months before operation, up from 18. Solar has no time limit.\n- Renewables must still cover at least 80% of energy in every operating hour.\n- A new alternative path allows up to five years to reach 80%, under conditions.\n\nBloomberg reports a 60% renewable requirement in peak (P1) hours until 2029.", "rq": "The jump from 1 MW to 10 MW is a regulatory threshold. Watch for bunching of announced project sizes just below 10 MW, a classic notch design. · Compare Spain with jurisdictions using other large-load rules (moratoria, special tariffs, Scope 2-style hourly matching) as a siting-choice problem. · An 80% hourly floor creates a portfolio design problem: what mix of solar, wind and storage meets the floor at least cost, and how does the solar exemption from the time limit change it?", "problem": "Spain wants to keep attracting investment while ensuring new load is met by new clean supply. The first draft was seen as too strict.\n- The higher threshold exempts smaller facilities.\n- The longer window and transition path weaken short-run additionality.\n- The 80% hourly floor still imposes costly firming, such as storage or overbuilding.\n\nIt is unclear how Bloomberg's 60%-until-2029 figure relates to the five-year transition. The full conditions and adoption timing are not reported.", "related": ["The Unintended Carbon Impacts of Large-Scale Electricity Storage"], "keywords": ["regulatory thresholds", "facility siting", "data center electricity demand", "large-load tariffs", "corporate lobbying"], "datasets": [], "thread": null}, {"n": 4, "id": "2026-10-27#4", "headline": "CANACAR launches indefinite nationwide Mexican trucking strike over cargo theft, violence and toll tax credit changes", "theme": "Supply Chain Resilience", "source": "FreightWaves", "summary": "On Monday, October 26, 2026, Mexico's freight chamber CANACAR and other trucking groups began an indefinite nationwide strike. Protests were planned in Nuevo Laredo, Reynosa, Monterrey, Tijuana and Mexico City. The Interior Ministry urged talks and said several other transport groups had agreed to negotiate, but CANACAR kept its protest call. Strike duration, participation and border impact were unknown as of Monday.", "rq": "Event-study the strike against daily or monthly border crossing counts at Laredo versus less affected ports. Its start date is sharp, but the end date and intensity are uncertain. · Chronic risks such as cargo theft and extortion versus acute strikes: does nearshoring risk show up as an inventory buffer, a route shift, or a mode shift to rail? · Port concentration matters: how exposed are firms whose bills of lading flow almost entirely through Nuevo Laredo?", "problem": "Carriers are using collective disruption to push the government on security and cost. Shippers and US buyers relying on Mexican production face possible delays at key freight points.\n- The strike is indefinite.\n- The ministry is negotiating with some transport groups but not CANACAR.\n- No figures on trucks involved, delays or economic cost exist yet.", "related": ["IMPACT OF DISASTERS ON FIRMS IN DIFFERENT SECTORS: IMPLICATIONS FOR SUPPLY CHAINS"], "keywords": ["cross-border trucking", "nearshoring logistics", "chokepoint disruption", "supplier region risk"], "datasets": ["bts_border_crossing", "bts_transborder"], "thread": "2026-10-27#4"}, {"n": 5, "id": "2026-10-27#5", "headline": "Shaw Industries runs carpet tile take-back through its outbound distribution network using empty backhauls", "theme": "Circular Economy", "source": "FreightWaves", "summary": "Starting in 2022–23, Shaw routed used EcoWorx carpet tile returns through its regional distribution centers. Delivery trucks pick up tile, material from several jobs is combined, and it moves to northwest Georgia on backhauls that would otherwise return empty. In November 2023, the free-pickup minimum (re[TURN] program) fell from 500 to 100 square yards. Shaw now turns 100% of the tile into new backing and says it has reclaimed nearly 1 billion pounds of carpet since 2006.", "rq": "Cross-state variation in landfill tipping fees is a natural lens for explaining return rates. Compare high-fee coastal markets with low-fee Southern states. · Vehicle routing with pickups and deliveries (backhaul integration) is a model family for when lowering a minimum pickup size from 500 to 100 sq yd pays off. · Return delays of 7–10 years and uncertain return quantity matter for planning recycled-content inputs in a closed loop.", "problem": "Returns are dispersed, delayed and small, so collection is costly. Shaw won't share its return rate and calls getting tile back \"challenging.\"\n- Returns come most easily where landfill fees are high: California, New York, Massachusetts and Seattle.\n- They are harder in Alabama and Mississippi.\n- Demolition contractors control disposal and often dump everything together, so Shaw has hired specialists in Seattle, Boston and Dallas.\n\nThe cost savings from the backhaul model are not quantified.", "related": ["Managerial Efficiency and Reverse‐Flow Complexity in a Circular Economy", "Closed‐loop supply chains with product remanufacturing: Challenges and opportunities"], "keywords": ["reverse logistics", "closed-loop supply chain", "extended producer responsibility", "secondary materials"], "datasets": ["epa_msw", "state_epr"], "thread": null}], "papers": [], "also": [{"title": "Audi investing $4B to build its first US plant in Georgia", "url": "https://www.manufacturingdive.com/news/audi-investing-4b-to-build-its-first-us-plant-in-georgia/872769/", "source": "Manufacturing Dive"}, {"title": "Climate damage to Philippine ports could cost US$70b a year by 2100", "url": "https://news.google.com/rss/articles/CBMitgFBVV95cUxPU2dKRU80Rk56U2Vra1MxOWhEOXBoTlhqQ01YRWtvTEVJS0ZsZlVNMDBUbjBSTWRKRXAySlVGb0JUbDZ2WVBKSVowd25WbVRXWDYwMEg1RjZKTWxpZWt0SWV1eTh0dUxaTkdTanpXcjF3dUZVZ3JOU2hSeWR5THRMTEFnZ0JsM1NNT2NpYjhEQlVwNjBBb0NrWnVzNDVORXh3N3U3djNIcmF3cXhqZzN2bkpueTlwQdIBtgFBVV95cUxPU2dKRU80Rk56U2Vra1MxOWhEOXBoTlhqQ01YRWtvTEVJS0ZsZlVNMDBUbjBSTWRKRXAySlVGb0JUbDZ2WVBKSVowd25WbVRXWDYwMEg1RjZKTWxpZWt0SWV1eTh0dUxaTkdTanpXcjF3dUZVZ3JOU2hSeWR5THRMTEFnZ0JsM1NNT2NpYjhEQlVwNjBBb0NrWnVzNDVORXh3N3U3djNIcmF3cXhqZzN2bkpueTlwQQ?oc=5", "source": "South China Morning Post"}, {"title": "Production Agriculture Is Driving Grasslands Loss Across North America", "url": "https://insideclimatenews.org/news/26102026/production-agriculture-is-driving-grasslands-loss-across-north-america/", "source": "Inside Climate News"}, {"title": "FCC grants Intel 1-year waiver to permit use of foreign-made robots", "url": "https://www.manufacturingdive.com/news/fcc-grants-intel-1-year-waiver-permit-use-foreign-produced-robots/872745/", "source": "Manufacturing Dive"}, {"title": "USPS to debut weekly fuel fee in 2027, matching FedEx, UPS practices", "url": "https://www.supplychaindive.com/news/usps-to-debut-weekly-fuel-fee-in-2027-matching-fedex-ups-practices/872778/", "source": "Supply Chain Dive"}]}, {"date": "2026-10-26", "intro": "Today's issue spans grid expansion for data centers, strategic stockpiling of oil and critical minerals, a national food-waste program running at half capacity, and Brazil's timber trade as the EU deforestation rule approaches. Several items share one question: who holds buffer capacity, where, and who pays for it.", "items": [{"n": 1, "id": "2026-10-26#1", "headline": "Northern Virginia's data center load drives 765-kV transmission lines across three states, prompting siting fights far from the demand", "theme": "Energy & AI Data Centers", "source": "CNN", "summary": "CNN reported on Oct. 25, 2026 that new high-voltage lines are planned to address a steep power shortage in Northern Virginia, home to the world's largest concentration of data centers. The main project, Valley Link, is a 765-kV line on 160-foot towers running 260 miles from West Virginia through Virginia into Maryland, with a right-of-way as wide as a 16-lane highway. A second Valley Link segment would run 116 miles from rural central Virginia into Northern Virginia, and together the lines could cross dozens of counties home to more than 1.5 million people.", "rq": "Capacity expansion under demand uncertainty with lumpy, irreversible assets: compare the value of committing early to long lines with a staged or flexible build. · Cost-allocation lens: compare 'beneficiary pays' with socialized regional allocation when the load is spatially concentrated. · Puzzle: if local actors cannot block lines, do pushback and delay show up elsewhere, for example in docket duration, route changes or settlement terms?", "problem": "Residents along the routes bear land-use, visual and property costs, while the benefits (power for data centers, tax base) accrue mainly to Loudoun County. Advocates, legal experts and even local officials told CNN residents have almost no means to stop the lines. Per analysts and lobbyists cited by CNN, a federal commission (likely FERC) has historically deferred to power operators' assessments of what transmission is needed. The contested decisions are how much transmission to build, where to route it, and how to allocate its costs and burdens.", "related": ["Adaptive Two-Stage Stochastic Programming with an Analysis on Capacity Expansion Planning Problem", "Cost‐sharing in directed networks: Experimental study of equilibrium choice and system dynamics"], "keywords": ["data center electricity demand", "facility siting", "federal-state jurisdiction", "capacity investment under uncertainty", "cost pass-through"], "datasets": ["ferc_elibrary", "state_puc"], "thread": null}, {"n": 2, "id": "2026-10-26#2", "headline": "Saudi Arabia plans to store crude in Singapore's Jurong Rock Caverns from H2 2027 as the Hormuz disruption hits Asian supply", "theme": "Supply Chain Resilience", "source": "The Economic Times", "summary": "On Oct. 26, 2026, Singapore's energy minister Tan See Leng and Saudi Energy Minister Prince Abdulaziz bin Salman announced a 'joint intent to establish an arrangement' for Saudi crude storage at Singapore's Jurong Rock Caverns starting in the second half of 2027. The caverns lie 150 m underground and hold up to 1.47 million cubic meters (about 9 million barrels). The volume, pricing, and whether Singapore gets first right to buy in a shortage were not disclosed.", "rq": "Inventory pre-positioning and network design with a chokepoint: the trade-off between holding stock at origin and holding it near demand. · Contract-design lens: treat host-country first-purchase rights as a call option and ask how they should be priced against storage fees. · Compare the terms of the Japan, Korea and Singapore arrangements as a small-sample look at how producer storage deals vary with host bargaining power.", "problem": "A producer is choosing to pre-position inventory downstream, near customers, rather than hold it at origin behind a chokepoint. Open questions include how much to store, who owns and controls release, and how priority rights in a shortage are priced or traded off against the producer's commercial flexibility. The arrangement is only a statement of intent, so its final terms are uncertain.", "related": ["Collaborative Prepositioning Network Design for Regional Disaster Response", "Preparedness with a system integrating inventory, capacity, and capability for future pandemics and other disasters"], "keywords": ["chokepoint disruption", "inventory management", "long-term supply contracts", "strategic stockpiling"], "datasets": ["un_comtrade"], "thread": null}, {"n": 3, "id": "2026-10-26#3", "headline": "European Parliament backs JOGMEC-style agency that could take equity stakes and stockpile critical minerals", "theme": "Critical Minerals & Batteries", "source": "Financial Times", "summary": "According to the FT, as relayed in a secondhand rewrite, European Parliament lawmakers voted to propose a Critical Raw Materials Centre. The agency could buy stakes in raw materials companies, build EU stockpiles and track supplies across the bloc. It would get €2bn under the next long-term EU budget, an amount its sponsor, MEP Mohammed Chahim, concedes would need private, national and EIB co-funding to succeed. The model is Japan's JOGMEC, and the push follows US moves such as the Pentagon's $400mn, 15% stake in MP Materials with a 10-year $110/kg NdPr price floor.", "rq": "Compare instruments: equity stakes, price floors, stockpiles and permitting fast-tracks as alternative ways to de-risk supply; contrast the MP Materials deal with the JOGMEC model. · Strategic stockpile design under a dominant, possibly manipulative supplier, including how stockpile size interacts with the supplier's pricing behavior. · Natural-experiment angle: compare strategic-project firms with and without later public financing once the centre's status is settled.", "problem": "Should the EU move from permitting support to direct state participation (equity stakes, stockpiles and possibly price support) to secure supply? The trade-offs are cost against effectiveness: €2bn alone is seen as too small. There is also a risk of swapping one dependency for another; EIT RawMaterials' Bernd Schäfer warns Europe could become as dependent on US rare earths as it is on China. Member states, including previously sceptical Germany and Spain, must still approve, so the outcome is uncertain.", "related": ["Building Supply Chain Resilience through Virtual Stockpile Pooling"], "keywords": ["government equity stakes", "raw material security", "price floors", "industrial policy", "supplier concentration"], "datasets": ["usgs_minerals", "un_comtrade"], "thread": null}, {"n": 4, "id": "2026-10-26#4", "headline": "Türkiye's food-waste-to-animal-feed program covers 74 of 81 provinces but runs at under half its capacity", "theme": "Circular Economy", "source": "Hürriyet Daily News", "summary": "Interior Ministry sources say food waste from public institutions and large catering sites is converted into animal feed in 74 of Türkiye's 81 provinces, with the feed going to stray animals, shelters and designated habitats rather than livestock. Combined daily capacity is 65,352 kg, but actual output is 31,274 kg a day. Seven provinces (Iğdır, Kahramanmaraş, Kırıkkale, Kocaeli, Kütahya, Samsun, Tunceli) have no equipment.", "rq": "Facility location and capacity sizing for reverse logistics: why might a network sit at about 48% utilization, and is adding plants in new provinces the right next move? · Compare institutional sources (dorms, hospitals, hotels) on waste volume predictability and contamination risk. · Food-safety and biosecurity screening as a constraint when diverting condemned or insurance-destroyed food into feed.", "problem": "Capacity is in place but underused, with output under half of installed capacity, while the government plans to expand into more provinces. The open question is whether the bottleneck is supply of waste, collection logistics, demand at shelters, or plant location. The proposal to divert condemned or insurance-destroyed food also raises safety and quality-control questions.", "related": [], "keywords": ["food waste valorization", "reverse logistics", "capacity utilization", "zero waste certification", "biosecurity risk"], "datasets": [], "thread": null}, {"n": 5, "id": "2026-10-26#5", "headline": "Lula wins fourth term as Brazil's timber exports face EU deforestation-rule checks", "theme": "ESG & Disclosure", "source": "Wood Central", "summary": "Lula won Brazil's Oct. 25, 2026 runoff with 51.79% to Flávio Bolsonaro's 48.21%, per the Superior Electoral Court, after trailing in the first round, 47% to 45% per AP. Wood Central reports Amazon deforestation is down 71.2% over four years, the lowest since satellite records began in 1988. It also reports the EU's checks on Brazilian wood under the EU Deforestation Regulation (EUDR) start at the end of the year. Bolsonaro has reportedly refused to concede, and legal challenges over a court-ordered two-hour voting extension are possible.", "rq": "Supplier exclusion versus supplier development under due-diligence regulation: which do buyers choose, and how does regional risk shape the choice? · Event-study or difference-in-differences framing around EUDR enforcement dates, comparing EU-bound with non-EU-bound Brazilian timber flows. · Puzzle: does improving aggregate deforestation reduce firm-level compliance costs, or do the costs stay concentrated in high-risk states?", "problem": "Brazilian timber exporters must show plot-level traceability to keep EU market access, just as political continuity, contested by the losing side, shapes domestic enforcement. EU buyers can invest in verifying Brazilian suppliers or exclude higher-risk regions and suppliers. Strong national deforestation statistics may not translate into supplier-level compliance, especially in the high-deforestation states.", "related": ["Sustainability in multi‐tier supply chains: Understanding the double agency role of the first‐tier supplier", "Toward “Omniscient” supply chains: Enabling and incentivizing sustainable operations"], "keywords": ["deforestation", "multi-tier traceability", "regulatory enforcement", "sourcing restrictions", "regulatory uncertainty"], "datasets": ["un_comtrade"], "thread": null}], "papers": [], "also": [{"title": "Vietnam sourcing surge puts India-ASEAN origin rules under scrutiny", "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxNVk5lZWo1QUNIVExHbFZhai1MbmlVdko4WG0zR3BKb1QyQ2tGdUl3eVFpUk51dDRORlpEU00xSHRxU29qYVAzQXlEUzRaVTBiYjU0UURfcXBHUUlZd2oxUDdkdlk2QlR5aThTMmRuOGhIcFhqTVdILXdBTjFlZjBveGRPSHNMemIxTVM1ZmU4LVVEMFZTWGQtSlhvQWFDT0FhT1RvZHJuODE4QQ?oc=5", "source": "Communications Today"}, {"title": "Germany Potato Production Expected to Decline Nearly 25 Percent in 2026", "url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxPTHJRMTZkQnpuc2ZpcndfeHJMam9BcFZia0FNVTVxNW1VSUxMc3ZwelZfWjk2NXBFVjJMS0tabEVZRlU2X2l1RGhFNTJWaU44aFNmQkxxcnpMQTdWNjJaYUJCbEw1NDVHQndNRTFwc3pmME85Z2haYlp0RVRNZjRaZWFZVEdENEU5eE5ZaTIyYkRUSmZieTctU0tBdTdkTnpzOEJ3?oc=5", "source": "PotatoPro"}, {"title": "LG to Supply Tesla With US$4.3 Billion of Batteries - Energy News, Top Headlines, Commentaries, Features & Events", "url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxOV1BjNER0TEE5c2kzcGZHUXc5VzNYaVNMX1hmVTJScGdHWnN3Z0p5a3QxckhjVkJLQWZSXzZQc2UyYlZ2dnFLX2tsSE5jTlp0NkhuR0pzYlRjcmhVTjVKdTJvNlNjNHp0OEVheHBidUhBaDlWb2VHd0I5VmcyZmxMaFV5cFR1U0gy?oc=5", "source": "EnergyNow.com"}, {"title": "Data centers to strain power supply across four Asian hubs - BMI", "url": "https://news.google.com/rss/articles/CBMinwFBVV95cUxPMkJqc0lVTFpmZmxTU1dEdXozZW5xamg1U1BQOHplZHlmdWFjMjJmbEgxY2VYNm5PVGtsZ2xWR0l0b2w0TlcycTNwTEhBZVBwaTV4UzVITkw0ZnNwVW1VSlozempQMGRoWjFiTTR2akRzY1lwNnB5R21CT0w3X0F1SEwzc3BtZDd6V3d6ajRZTlBJbDloaEdQSmtpT0RJTW8?oc=5", "source": "TNGlobal"}, {"title": "Toyotsu ChemiPlas and two partners to produce high-purity recycled polyol from waste polyurethane foam", "url": "https://news.google.com/rss/articles/CBMiywFBVV95cUxPcUNmb1ZvanpCUWx3M2tXMER4N0tfcDNYam14Mk1HdGpSdXlLOVpuSEYwdU9fbUJmV1VVX1NEa3pDektScXFGWW5FV1pZSDRVbmRaNHVkZ2swYkJaT0hrYzhmQ0pndWFaWF91dWJSX1p6ZG1mQVJQQ3NrMnRaTlJGNVRwbGRvY25oOWlWUWdDTFNBay1ISHQtMHliQW9hM01tOGx4VU45UUZHODV3UHlrMWp6cDNKa0ExWkxwblpXbHBLNlZFTTVuUC00NA?oc=5", "source": "Circular Economy Hub"}]}, {"date": "2026-10-25", "intro": "Today's issue features a regulator rewriting the rules for connecting AI data centers to the grid and an AI firm facing permit penalties for building faster than its approvals. It also covers a Korean circular-feed pathway colliding with disease risk, a still-unconfirmed supply shock in bauxite
