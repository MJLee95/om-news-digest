n brands selling into the U.S. have had shipments detained", "url": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxQVjdLWVB3dXpOdkktWHNfRnhNWERTNWViNFE4WXRXTGpYNkJhTWFXenZkbFhBZlpFVHpwTnB1RVdSOUV1Z2RBbk1vZHozeVhSdVlRQ2JSRUplV05hczFWMWxFMEdtd21menFLc3ZzeEljY3BnWmJScHB1dHpQRDN4ejRDS2JZeGpJZE5iR2JSdXZHMS1XMW9BYml1YzVjQ2tlSlJpN0lOQlIzN2lzbFZET0xEYkZ4d1lSTDBSdWw5U0FmXy04NjZFM055Vlh0ZWV3RjRrVW8xOXk?oc=5", "source": "American Journal of Transportation"}]}, {"date": "2026-10-13", "intro": "Today's issue leads with two data center power stories. FERC rejected most of PJM's large-load interconnection plan but approved a new data center registry, and utilities are using collateral rules to weed out speculative 'phantom' requests. Also covered: Taylor Farms' seasonal sourcing pullback from central Mexico, a driver-visa shock to cross-border trucking, and an Oregon packaging EPR lawsuit paused pending a Ninth Circuit appeal.", "items": [{"n": 1, "id": "2026-10-13#1", "headline": "FERC rejects PJM's curtailment-based large-load interconnection plan, approves data center registry", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "On Oct. 9, 2026, FERC rejected the core of PJM's plan for connecting data centers and other large loads (accession no. 20261009-3055). The rejected Interim Resource Adequacy Service (IRAS) would have let large loads connect without matching new capacity if they accepted curtailment ahead of grid emergencies. FERC found it intruded on state authority over retail rates and appeared to discriminate against large loads, but it approved PJM's large-load definition and a registry of each facility's location, ramp schedule and capacity supply. Jefferies expects PJM capacity prices to stay higher for longer and any revival to be state-led, with Ohio and Pennsylvania the ones to watch; the ruling follows FERC's rejection about five weeks earlier of key parts of PJM's backstop procurement auction.", "rq": "How does excluding interruptible large loads from capacity-market demand curves affect procurement levels, prices and reliability outcomes, compared with requiring matched new capacity?", "problem": "The order shifts curtailment-priority decisions to the states and creates a facility-level registry of large loads, a potential new dataset. Commissioner Rosner warned that leaving curtailable loads out of the capacity auction demand curve could make the auction signal ample capacity even as the region involuntarily sheds thousands of megawatts.", "related": ["Electricity Time‐of‐Use Tariff with Stochastic Demand"], "keywords": ["capacity markets", "interruptible load", "interconnection policy", "data center electricity demand", "federal-state jurisdiction"], "datasets": ["pjm_data", "ferc_elibrary"], "thread": "2026-10-13#1"}, {"n": 2, "id": "2026-10-13#2", "headline": "Utilities use collateral, deposits and longer contracts to filter speculative 'phantom' data center power requests", "theme": "Energy & AI Data Centers", "source": "WSJ", "summary": "According to a Breitbart write-up of a paywalled WSJ report (figures not verified against the WSJ text), Wood Mackenzie rates only 23% of disclosed data center power requests as high confidence. Large-customer requests to Exelon tripled to 18,000 MW. After Exelon required binding commitments and collateral, its high-probability list fell to 11,000 MW, backed by about $1 billion in posted collateral. In Texas, the connection queue exceeds 400,000 MW, large customers now pay a $50,000/MW study deposit, and minimum large-customer contract terms nationally average about 10.8 years versus about 4.6 before 2024 (per Halcyon); Vistra's CEO says demand estimates are overstated by more than 20 times.", "rq": "How much do collateral and deposit requirements reduce queue attrition and forecast error in utility large-load pipelines, and how do they shift which project types (e.g., hyperscaler vs. speculative developer) stay in the queue?", "problem": "This is a clean setting for screening and demand-signaling under capacity investment uncertainty: collateral and contract length act as costly signals that separate serious projects from speculative ones. The figures are second-hand, so treat them as hypotheses to verify.", "related": ["Capacity Reservation and Wholesale Price Contracts under Forecast Sharing: A Behavioral Assessment"], "keywords": ["interconnection queues", "demand signaling", "collateral requirements", "capacity investment under uncertainty", "load forecasting"], "datasets": ["state_puc", "ercot_reports"], "thread": null}, {"n": 3, "id": "2026-10-13#3", "headline": "Taylor Farms halts May–August central Mexico lettuce sourcing after a Cyclospora outbreak linked to nearly 13,000 cases", "theme": "Supply Chain Resilience", "source": "Supply Chain Dive", "summary": "In an Oct. 8 letter, Taylor Farms CEO Bruce Taylor said the company will indefinitely stop harvesting or processing central Mexico iceberg lettuce for the U.S. and Canada during the CDC's Cyclospora season (May 1–Aug. 31), which coincides with the region's rainy season. Cases linked to Taco Bell or to recalled Taylor Farms lettuce reached nearly 13,000 this summer. The FDA closed its investigation on Oct. 2 without establishing the contamination route, though it said traceback evidence pointed to shredded iceberg lettuce from Taylor Farms de Mexico. The company is also expanding water and crop testing, funding detection research and joining an FDA-led task force.", "rq": "After a major outbreak, do produce buyers reallocate sourcing away from implicated regions only during high-risk seasons, and how does that affect import volumes, prices and subsequent outbreak or recall rates?", "problem": "This is a seasonal, risk-based sourcing exclusion rather than a full exit, a firm-level response to a food safety disruption whose root cause was never established. It raises questions about whether such responses come from learning or from signaling.", "related": ["Learning from Conformance Quality Failures That Triggered Product Recalls: The Role of Direct and Indirect Experience", "Product safety and security in the global supply chain: Issues, challenges and research opportunities"], "keywords": ["food safety recalls", "seasonal sourcing", "produce supply chains", "traceback", "supplier region risk"], "datasets": ["panjiva", "openfda_enforcement"], "thread": null}, {"n": 4, "id": "2026-10-13#4", "headline": "FreightWaves: revocation of about 25,000 Mexican drivers' B-1 visas tightens US–Mexico border trucking capacity", "theme": "Trade & Industrial Policy", "source": "FreightWaves", "summary": "FreightWaves reports that U.S. authorities have revoked B-1 visas for about 25,000 Mexican truck drivers; the revoking agency and the timing were not stated, and the figure is unverified. SONAR data show El Paso tender rejections peaking at about 24–25% in early July and still near 20%, San Diego/Otay Mesa at about 10% versus 3.9% a year ago, and Laredo rising from 6.07% (Oct. 3) to 7.78% (Oct. 10). Year-over-year spot rates are up 57% on San Diego–Phoenix and 43% on Laredo–Dallas. Mexico freight volumes are fairly stable, so FreightWaves attributes the pressure to lost driver supply and expects tight conditions to last well into 2027.", "rq": "How does a sudden loss of cross-border driver capacity pass through to tender rejections, spot-contract rate spreads and shippers' mode or port-of-entry substitution (e.g., rail, transloading)?", "problem": "A labor-supply shock to a specific mode and geography, while demand stays roughly flat, offers a rare chance to separate capacity effects from demand effects in freight markets. Canada lanes, where the issue is a freight imbalance rather than a driver shortage, offer a contrast.", "related": ["Estimating the Operational Impact of Container Inspections at International Ports", "Shock and Awe: A Theoretical Framework and Data Sources for Studying the Impact of 2025 Tariffs on Global Supply Chains"], "keywords": ["cross-border trucking", "driver supply shock", "tender rejection", "freight rates", "nearshoring logistics"], "datasets": ["bts_transborder", "bts_border_crossing"], "thread": null}, {"n": 5, "id": "2026-10-13#5", "headline": "Lollicup's challenge to Oregon's packaging EPR law to be paused pending NAW's Ninth Circuit appeal", "theme": "Circular Economy", "source": "Packaging Dive", "summary": "On Oct. 9, foodservice ware supplier Lollicup USA and Oregon DEQ director Leah Feldon jointly moved to stay Lollicup's June class action over Oregon's packaging EPR law. The stay would last until the Ninth Circuit decides the National Association of Wholesaler-Distributors' appeal, after Judge Michael Simon upheld the law in August. NAW's opening brief is due Dec. 17, and status reports would begin April 16, 2027. An Arnold & Porter partner noted that companies must still comply in the meantime, and that a Lollicup–DEQ enforcement-limiting agreement appears to have expired Aug. 31, 2026; EPR suits are also pending in California and Colorado.", "rq": "Does legal uncertainty over state EPR programs delay producers' packaging redesign (material substitution, lightweighting) or registration with producer responsibility organizations, compared with states where the law is not under challenge?", "problem": "Legal uncertainty over state packaging EPR programs is a live friction for producers' compliance, fee and packaging-design decisions. The appellate timeline creates identifiable windows in which that uncertainty resolves.", "related": ["Extended Producer Responsibility for Durable Products", "Interplay between Competing and Coexisting Policy Regimens within Supply Chain Configurations"], "keywords": ["extended producer responsibility", "packaging regulation", "regulatory uncertainty", "state environmental policy", "litigation risk"], "datasets": ["state_epr", "sec_edgar"], "thread": null}], "papers": [{"title": "Designing Surprise Bags for Surplus Foods", "journal": "M&SOM", "url": "https://doi.org/10.1287/msom.2026.0294"}, {"title": "Collective Activism", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2025.02975"}], "also": []}], "registry": {"categories": {"energy": "Energy & grid", "emissions": "Emissions & environment", "esg": "ESG ratings & incidents", "firms": "Firm financials & disclosures", "trade": "Supply chain links & trade", "logistics": "Logistics & transportation", "food": "Food, agriculture & product safety", "circular": "Circular economy & waste", "climate": "Climate hazards & disasters", "minerals": "Critical minerals", "policy": "Regulation & policy records"}, "access": {"public": "Public", "university": "University license", "commercial": "Commercial", "request": "On request"}, "datasets": [{"id": "eia860", "name": "EIA-860 generator inventory", "category": "energy", "access": "public", "url": "https://www.eia.gov/electricity/data/eia860/", "alt": null}, {"id": "eia861", "name": "EIA-861 utility sales & customers", "category": "energy", "access": "public", "url": "https://www.eia.gov/electricity/data/eia861/", "alt": null}, {"id": "eia923", "name": "EIA-923 plant generation & fuel", "category": "energy", "access": "public", "url": "https://www.eia.gov/electricity/data/eia923/", "alt": null}, {"id": "eia930", "name": "EIA-930 hourly grid monitor", "category": "energy", "access": "public", "url": "https://www.eia.gov/electricity/gridmonitor/", "alt": null}, {"id": "pjm_data", "name": "PJM Data Miner & capacity auction results", "category": "energy", "access": "public", "url": "https://dataminer2.pjm.com/", "alt": null}, {"id": "ercot_reports", "name": "ERCOT interconnection & large-load reports", "category": "energy", "access": "public", "url": "https://www.ercot.com/gridinfo/resource", "alt": null}, {"id": "lbnl_queues", "name": "LBNL 'Queued Up' interconnection queue data", "category": "energy", "access": "public", "url": "https://emp.lbl.gov/queues", "alt": null}, {"id": "epa_ghgrp", "name": "EPA GHGRP facility emissions", "category": "emissions", "access": "public", "url": "https://www.epa.gov/ghgreporting", "alt": null}, {"id": "epa_tri", "name": "EPA Toxics Release Inventory (TRI)", "category": "emissions", "access": "public", "url": "https://www.epa.gov/toxics-release-inventory-tri-program", "alt": null}, {"id": "epa_egrid", "name": "EPA eGRID power-sector emissions", "category": "emissions", "access": "public", "url": "https://www.epa.gov/egrid", "alt": null}, {"id": "cdp", "name": "CDP climate & supply chain responses", "category": "emissions", "access": "request", "url": "https://www.cdp.net/en/data", "alt": "Firms' own sustainability reports; EPA GHGRP for US facilities"}, {"id": "sbti", "name": "SBTi target dashboard", "category": "emissions", "access": "public", "url": "https://sciencebasedtargets.org/target-dashboard", "alt": null}, {"id": "msci_esg", "name": "MSCI ESG ratings", "category": "esg", "access": "university", "url": null, "alt": null}, {"id": "lseg_esg", "name": "LSEG (Refinitiv) ESG scores", "category": "esg", "access": "university", "url": null, "alt": null}, {"id": "reprisk", "name": "RepRisk ESG incidents", "category": "esg", "access": "university", "url": null, "alt": "News-based measures you build yourself (e.g., GDELT)"}, {"id": "gdelt", "name": "GDELT global news event data", "category": "esg", "access": "public", "url": "https://www.gdeltproject.org/", "alt": null}, {"id": "compustat", "name": "Compustat fundamentals", "category": "firms", "access": "university", "url": null, "alt": null}, {"id": "crsp", "name": "CRSP stock returns", "category": "firms", "access": "university", "url": null, "alt": null}, {"id": "sec_edgar", "name": "SEC EDGAR filings (10-K, 8-K, N-PX)", "category": "firms", "access": "public", "url": "https://www.sec.gov/edgar/search/", "alt": null}, {"id": "call_transcripts", "name": "Earnings call transcripts", "category": "firms", "access": "university", "url": null, "alt": "8-K <script>
const D = JSON.parse(document.getElementById('data').textContent);
window.STAR_CFG = {repo: D.repo, initial: D.stars,
  headlines: Object.fromEntries(D.issues.flatMap(d => d.items.map(it => [it.id, it.headline])))};
</script>
<script src="stars.js"></script>
<script>
const ISSUES = D.issues;
const ITEMS = ISSUES.flatMap(d => d.items.map(it => ({...it, date: d.date})));
const BY_ID = Object.fromEntries(ITEMS.map(it => [it.id, it]));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const short = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric'});
const link = it => `issues/${it.date}.html#item-${it.n}`;
const NARROW = matchMedia('(max-width:760px)'), KW_TOP = () => NARROW.matches ? 12 : 30;

// threads
const THREADS = {};
ITEMS.forEach(it => { if (it.thread) (THREADS[it.thread] ||= []).push(it); });
Object.values(THREADS).forEach(list => list.sort((a, b) => a.date.localeCompare(b.date) || a.n - b.n));
const THREAD_LIST = Object.entries(THREADS).sort((a, b) => b[1].at(-1).date.localeCompare(a[1].at(-1).date));

// datasets: registry entries (datasets.yaml) with the stories that used them
const REG = D.registry, DS_BY_ID = Object.fromEntries(REG.datasets.map(d => [d.id, d]));
const DATASETS = {};
ITEMS.forEach(it => (it.datasets || []).forEach(id => { if (DS_BY_ID[id]) (DATASETS[id] ||= []).push(it); }));
const DATASET_LIST = Object.keys(DATASETS);
let dsAccess = null, dsShowAll = false;

// filters: one theme + any number of keywords (an article must have all of them) + search text
let state = {tab: 'issues', theme: null, kws: [], q: '', open: null, day: null, month: null, page: 1}, showAllKw = false;

// calendar + paging
const ISSUE_DATES = new Set(ISSUES.map(d => d.date));
const NEWEST = ISSUES[0]?.date || new Date().toISOString().slice(0, 10);
let calView = NEWEST.slice(0, 7);   // 'YYYY-MM' shown in the calendar
let perPage = 7;
try { perPage = +localStorage.getItem('perPage') || 7; } catch (e) {}
const inRange = date => (!state.day || date === state.day) && (!state.month || date.startsWith(state.month));
const monthName = ym => new Date(ym + '-15T12:00:00').toLocaleDateString('en-US', {month: 'long', year: 'numeric'});
const shiftMonth = (ym, k) => { const d = new Date(ym + '-15T12:00:00'); d.setMonth(d.getMonth() + k); return d.toISOString().slice(0, 7); };

function renderCal() {
  const [y, m] = calView.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  const cells = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => `<div class="dow">${d}</div>`);
  for (let i = 0; i < first; i++) cells.push('<div></div>');
  for (let d = 1; d <= days; d++) {
    const iso = `${calView}-${String(d).padStart(2, '0')}`;
    cells.push(ISSUE_DATES.has(iso)
      ? `<button class="d${state.day === iso ? ' on' : ''}" data-calday="${iso}" title="${fmt(iso)}">${d}</button>`
      : `<div class="d">${d}</div>`);
  }
  const n = ISSUES.filter(x => x.date.startsWith(calView)).length;
  const sel = state.day ? fmt(state.day) : state.month ? monthName(state.month) : 'All issues';
  $('cal').innerHTML = `<div class="cal-head"><button data-calnav="-1" aria-label="Previous month">‹</button>
    <button class="mon${state.month === calView ? ' on' : ''}" data-calmonth="${calView}" title="Show this month">${monthName(calView)}</button>
    <button data-calnav="1" aria-label="Next month">›</button></div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-foot"><span>${n} issue${n === 1 ? '' : 's'} this month · showing ${esc(sel)}</span>
    ${state.day || state.month ? '<button data-calall>Show all</button>' : ''}</div>`;
}

function pager(total, size) {
  const pages = Math.max(1, Math.ceil(total / size));
  state.page = Math.min(Math.max(1, state.page), pages);
  const nums = [];
  for (let i = 1; i <= pages; i++)
    if (i === 1 || i === pages || Math.abs(i - state.page) <= 1) nums.push(i);
    else if (nums.at(-1) !== '…') nums.push('…');
  const btns = pages > 1 ? `<button data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>‹ Newer</button>
    ${nums.map(i => i === '…' ? '<span>…</span>' : `<button data-page="${i}" class="${i === state.page ? 'on' : ''}">${i}</button>`).join('')}
    <button data-page="${state.page + 1}" ${state.page === pages ? 'disabled' : ''}>Older ›</button>` : '';
  return {slice: arr => arr.slice((state.page - 1) * size, state.page * size),
          html: `<div class="pager">${btns}<span style="margin-left:8px">Per page</span>
            <select id="perPage">${[5, 7, 10].map(k => `<option ${k === perPage ? 'selected' : ''}>${k}</option>`).join('')}</select></div>`};
}
const filtering = () => !!(state.theme || state.kws.length || state.q);

const matchQ = it => !state.q || (it.headline + ' ' + it.summary + ' ' + it.rq + ' ' + (it.problem || '') + ' ' + it.keywords.join(' ') + ' ' +
  (it.related || []).join(' ') + ' ' + (it.datasets || []).join(' ')).toLowerCase().includes(state.q.toLowerCase());
const matches = (it, {ignoreTheme = false} = {}) =>
  (ignoreTheme || !state.theme || it.theme === state.theme) && state.kws.every(k => it.keywords.includes(k)) && matchQ(it);

function tally(items, key) {
  const m = new Map();
  items.forEach(it => [].concat(it[key]).forEach(v => m.set(v, (m.get(v) || 0) + 1)));
  return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const ALL_KW = tally(ITEMS, 'keywords');

const TABS = [
  ['issues', 'Issues', ISSUES.length],
  ['threads', 'Story threads', THREAD_LIST.length],
  ['datasets', 'Datasets', DATASET_LIST.length],
  ['starred', '★ Starred', null],
  ['weekly', 'Weekly reviews', D.weekly.length],
];

function chip(kind, v, n) {
  const on = kind === 'theme' ? state.theme === v : state.kws.includes(v);
  return `<button class="chip${on ? ' on' : ''}" data-kind="${kind}" data-tag="${esc(v)}" aria-pressed="${on}">${esc(v)}${n ? `<small>${n}</small>` : ''}</button>`;
}

function hi(s) {
  if (!state.q) return esc(s);
  const re = new RegExp('(' + state.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(s).replace(re, '<mark>$1</mark>');
}

const starBtn = it => D.repo ? `<a class="star${Stars.isStarred(it.id) ? ' on' : ''}" href="#" data-star="${esc(it.id)}">${Stars.isStarred(it.id) ? '★' : '☆'}</a>` : '';

function row(it, {withDate = false, showRq = false, note = null} = {}) {
  const thread = it.thread && THREADS[it.thread].length > 1
    ? `<button class="chip thread" data-thread="${esc(it.thread)}">🧵 ${THREADS[it.thread].length} in thread</button>` : '';
  const kw = it.keywords.map(k => chip('keywords', k)).join('');
  const noteHtml = note === null ? '' : `<div class="note">${note ? esc(note) : '<span class="meta">No note yet.</span>'}
    <button class="clear" data-note="${esc(it.id)}" style="margin-left:6px">${note ? 'Edit note' : 'Add note'}</button></div>`;
  return `<div class="row">${starBtn(it)}<div class="body"><a class="go" href="${link(it)}">
    <div class="meta">${withDate ? fmt(it.date) + ' · ' : ''}<span class="theme">${esc(it.theme)}</span> · ${esc(it.source)}</div>
    <div class="hl">${hi(it.headline)}</div>
    ${state.q ? `<div class="snip">${hi(it.summary)}</div>` : ''}
    ${showRq ? `<div class="snip"><b>▸</b> ${hi(it.rq)}</div>` : ''}</a>
    ${noteHtml}
    <div class="kw">${thread}${kw}</div></div></div>`;
}

function renderSide() {
  // themes still possible with the chosen keywords/search; keywords present in the current results
  const themes = tally(ITEMS.filter(it => matches(it, {ignoreTheme: true})), 'theme');
  if (state.theme && !themes.some(([t]) => t === state.theme)) themes.unshift([state.theme, 0]);
  $('themes').innerHTML = themes.map(([v, n]) => chip('theme', v, n)).join('') || '<span class="meta">No themes match.</span>';
  const pool = filtering() ? tally(ITEMS.filter(it => matches(it)), 'keywords') : ALL_KW;
  const chosen = state.kws.map(k => [k, (pool.find(([v]) => v === k) || [k, 0])[1]]);
  const rest = pool.filter(([v]) => !state.kws.includes(v));
  const kws = [...chosen, ...(showAllKw ? rest : rest.slice(0, Math.max(0, KW_TOP() - chosen.length)))];
  $('keywords').innerHTML = kws.map(([v, n]) => chip('keywords', v, n)).join('') || '<span class="meta">No keywords match.</span>';
  $('moreKw').hidden = chosen.length + rest.length <= KW_TOP();
  $('moreKw').textContent = showAllKw ? 'Show fewer' : `Show all ${chosen.length + rest.length}`;
  $('nThemes').textContent = themes.length; $('nKw').textContent = chosen.length + rest.length;
  const nStar = ITEMS.filter(it => Stars.isStarred(it.id)).length;
  $('tabs').innerHTML = TABS.map(([k, label, n]) =>
    `<button class="tab${state.tab === k ? ' on' : ''}" data-tab="${k}">${label}<small>${k === 'starred' ? nStar : n}</small></button>`).join('');
}

function bar(title, sub, clear) {
  $('bar').innerHTML = `<strong>${title}</strong>${sub ? `<span class="meta">${sub}</span>` : ''}${clear ? '<button class="clear" id="clear">Clear</button>' : ''}`;
  if (clear) $('clear').onclick = () => { state = {...state, theme: null, kws: [], q: '', open: null, day: null, month: null, page: 1}; $('q').value = ''; update(); };
}

function filterBar(n) {
  const tags = [
    ...(state.theme ? [`<button class="chip on" data-kind="theme" data-tag="${esc(state.theme)}">${esc(state.theme)} ✕</button>`] : []),
    ...state.kws.map(k => `<button class="chip on" data-kind="keywords" data-tag="${esc(k)}">${esc(k)} ✕</button>`),
    ...(state.q ? [`<span class="meta">search “${esc(state.q)}”</span>`] : []),
  ].join('');
  $('bar').innerHTML = `<div class="chips">${tags}</div><span class="meta">${n} article${n === 1 ? '' : 's'}${state.kws.length > 1 ? ' with all selected keywords' : ''}</span>
    <button class="clear" id="clear">Clear all</button>`;
  $('clear').onclick = () => { state = {...state, theme: null, kws: [], q: '', open: null}; $('q').value = ''; update(); };
}

const VIEWS = {
  issues() {
    if (filtering()) {
      const hits = ITEMS.filter(it => matches(it) && inRange(it.date)).sort((a, b) => b.date.localeCompare(a.date) || a.n - b.n);
      filterBar(hits.length);
      const pg = pager(hits.length, perPage * 5);
      return hits.length ? `<div class="card">${pg.slice(hits).map(it => row(it, {withDate: true})).join('')}</div>${pg.html}` : '<div class="empty">No articles match all of these filters.</div>';
    }
    const issues = ISSUES.filter(d => inRange(d.date));
    const pg = pager(issues.length, perPage);
    if (state.day) bar(fmt(state.day), '', true);
    else if (state.month) bar(monthName(state.month), `${issues.length} issue${issues.length === 1 ? '' : 's'}`, true);
    else bar('All issues', `newest first · ${issues.length} issue${issues.length === 1 ? '' : 's'}`);
    return issues.length ? pg.slice(issues).map(d => `<section class="card">
      <h3><a href="issues/${d.date}.html">${fmt(d.date)}</a></h3>
      <p class="intro">${esc(d.intro)}</p>
      ${d.items.map(it => row({...it, date: d.date})).join('')}
      ${d.papers.map(p => `<div class="paper">📄 <a href="${esc(p.url)}">${esc(p.title)}</a> — ${esc(p.journal)}</div>`).join('')}
      ${(d.also || []).length ? `<details><summary>Also worth noting · ${d.also.length}</summary>${d.also.map(a => `<div class="paper"><a href="${esc(a.url)}">${esc(a.title)}</a> — ${esc(a.source)}</div>`).join('')}</details>` : ''}
    </section>`).join('') + pg.html : `<div class="empty">${ISSUES.length ? 'No issue on this date.' : 'No issues yet.'}</div>`;
  },
  threads() {
    let list = THREAD_LIST.filter(([, its]) => its.some(matchQ));
    if (state.open) list = list.filter(([id]) => id === state.open);
    bar(state.open ? 'Story thread' : 'Story threads', state.open ? '' : 'ongoing stories covered more than once', !!state.open || !!state.q);
    if (!list.length) return `<div class="empty">${THREAD_LIST.length ? 'No matching threads.' :
      'No story threads yet. When a new story is a follow-up to something covered earlier, the two are linked here as a timeline.'}</div>`;
    return list.map(([id, its]) => {
      const b = D.threadBriefs[id];
      return `<section class="card">
      <h3>${b ? `<a href="threads/${b.slug}.html">${esc(b.title)}</a>` : esc(its.at(-1).headline)}</h3>
      <p class="intro">${its.length} articles · ${short(its[0].date)} → ${short(its.at(-1).date)}${b ? ` · brief updated ${short(b.updated)}` : ''}</p>
      ${b ? `<p style="margin:0 0 6px">${esc(b.summary)}</p>
        ${b.note ? `<p class="meta" style="margin:0 0 8px"><b>Latest:</b> ${esc(b.note)}</p>` : ''}
        <p style="margin:0 0 10px"><a href="threads/${b.slug}.html" style="color:var(--accent);font-weight:600;text-decoration:none">Read the story brief →</a></p>` : ''}
      ${its.map(it => row(it, {withDate: true})).join('')}</section>`;
    }).join('');
  },
  datasets() {
    const q = state.q.toLowerCase();
    const used = id => (DATASETS[id] || []).filter(matchQ);
    const visible = REG.datasets.filter(d => (!dsAccess || d.access === dsAccess) &&
      (dsShowAll || used(d.id).length) &&
      (!q || used(d.id).length || (d.name + ' ' + (d.alt || '')).toLowerCase().includes(q)));
    bar('Datasets', `${DATASET_LIST.length} of ${REG.datasets.length} in your list used so far`, !!state.q);
    const accessChip = (k, label) => `<button class="chip${dsAccess === k ? ' on' : ''}" data-dsaccess="${k || ''}">${label}</button>`;
    const filters = `<div class="filters">${accessChip(null, 'All')}${Object.entries(REG.access).map(([k, l]) => accessChip(k, l)).join('')}
      <button class="clear" data-dsall>${dsShowAll ? 'Hide unused' : 'Show full list'}</button></div>
      <p class="help">The list lives in <code>datasets.yaml</code>. Each story links to at most two entries; datasets outside the list are kept as candidates below. Access tiers are general guidance — check what UMD actually licenses.</p>`;
    const groups = Object.entries(REG.categories).map(([cat, label]) => [label, visible.filter(d => d.category === cat)]).filter(([, ds]) => ds.length);
    const dsRow = d => {
      const its = used(d.id).sort((a, b) => b.date.localeCompare(a.date));
      const name = d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${hi(d.name)}</a>` : hi(d.name);
      return `<details class="ds${its.length ? '' : ' unused'}" ${q && its.length ? 'open' : ''}>
        <summary>${name}<span class="badge ${d.access}">${esc(REG.access[d.access])}</span><span class="n">${its.length || ''}</span></summary>
        ${d.alt ? `<div class="alt">Alternative / note: ${esc(d.alt)}</div>` : ''}
        ${its.map(it => row(it, {withDate: true, showRq: true})).join('')}</details>`;
    };
    const body = groups.length ? groups.map(([label, ds]) => `<section class="card"><h3 style="font-size:16px">${esc(label)}</h3>
      ${ds.map(dsRow).join('')}</section>`).join('') : '<div class="empty">No datasets match.</div>';
    const cands = D.candidates.filter(c => !q || c.name.toLowerCase().includes(q));
    const candHtml = cands.length ? `<details class="card"><summary>Candidates not in your list · ${cands.length}</summary>
      <p class="help" style="margin-top:8px">Named in stories but not in <code>datasets.yaml</code>. Ones mentioned 2+ times also appear in the weekly review; add the useful ones to the list.</p>
      ${cands.map(c => `<div class="paper">${esc(c.name)} <span class="meta">· ${c.mentions} mention${c.mentions === 1 ? '' : 's'}</span></div>`).join('')}</details>` : '';
    return filters + body + candHtml;
  },
  starred() {
    const its = ITEMS.filter(it => Stars.isStarred(it.id) && matchQ(it)).sort((a, b) => b.date.localeCompare(a.date));
    bar('★ Starred', `${its.length} stor${its.length === 1 ? 'y' : 'ies'}`, !!state.q);
    const conn = Stars.connected()
      ? `GitHub connected in this browser · <button class="clear" data-act="disconnect">Disconnect</button>`
      : `<button class="clear" data-act="connect">Connect GitHub</button> (one-time, needed to star from this browser)`;
    const help = `<p class="help">Click ☆ to star a story and ★ to un-star it. Starred stories and their notes steer future picks
      and the weekly review.<br>${conn}</p>`;
    return help + (its.length ? `<div class="card">${its.map(it => row(it, {withDate: true, showRq: true, note: Stars.note(it.id)})).join('')}</div>`
      : '<div class="empty">Nothing starred yet.</div>');
  },
  weekly() {
    bar('Weekly reviews', 'every Sunday');
    return D.weekly.length ? D.weekly.map(w => `<section class="card">
      <h3><a href="weekly/${w.date}.html">Week ending ${fmt(w.date)}</a></h3>
      <p class="intro">${esc(w.overview)}</p>
      ${w.ideas.map(t => `<div class="paper">💡 ${esc(t)}</div>`).join('')}</section>`).join('')
      : '<div class="empty">The first weekly review arrives on Sunday.</div>';
  },
};

function toHash() {
  const p = new URLSearchParams();
  if (state.open) p.set('thread', state.open);
  else if (state.tab !== 'issues') p.set('tab', state.tab);
  if (state.theme) p.set('theme', state.theme);
  state.kws.forEach(k => p.append('kw', k));
  if (state.day) p.set('day', state.day);
  else if (state.month) p.set('month', state.month);
  if (state.page > 1) p.set('page', state.page);
  return p.toString();
}
function fromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const tab = p.get('tab');
  state = {...state, tab: VIEWS[tab] ? tab : 'issues', theme: p.get('theme'), kws: [...p.getAll('kw'), ...p.getAll('tag')], open: p.get('thread'),
           day: p.get('day'), month: p.get('month'), page: +p.get('page') || 1};
  if (state.day || state.month) calView = (state.day || state.month).slice(0, 7);
  if (state.open) state.tab = 'threads';
}

function update() {
  const h = toHash();
  history.replaceState(null, '', h ? '#' + h : location.pathname);
  renderSide();
  renderCal();
  $('list').innerHTML = VIEWS[state.tab]();
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { state = {...state, tab: tab.dataset.tab, open: null}; return update(); }
  const th = e.target.closest('[data-thread]');
  if (th) { e.preventDefault(); state = {...state, tab: 'threads', open: th.dataset.thread}; update(); return window.scrollTo({top: 0, behavior: 'smooth'}); }
  const nt = e.target.closest('[data-note]');
  if (nt) {
    const id = nt.dataset.note, v = prompt('Why is this story interesting? (used to guide future picks)', Stars.note(id));
    if (v !== null) Stars.setNote(id, v.trim());
    return;
  }
  const cal = e.target.closest('[data-calnav],[data-calmonth],[data-calday],[data-calall],[data-page]');
  if (cal) {
    const ds = cal.dataset;
    if (ds.calnav) { calView = shiftMonth(calView, +ds.calnav); return renderCal(); }
    if (ds.page) { state.page = +ds.page; update(); return $('bar').scrollIntoView({behavior: 'smooth'}); }
    if (ds.calall !== undefined) state = {...state, day: null, month: null};
    else if (ds.calmonth) state = {...state, day: null, month: state.month === ds.calmonth ? null : ds.calmonth};
    else state = {...state, month: null, day: state.day === ds.calday ? null : ds.calday};
    state = {...state, tab: 'issues', open: null, page: 1};
    update(); return (NARROW.matches ? $('bar') : document.body).scrollIntoView({behavior: 'smooth'});
  }
  const dsa = e.target.closest('[data-dsaccess]');
  if (dsa) { dsAccess = dsa.dataset.dsaccess || null; return update(); }
  if (e.target.closest('[data-dsall]')) { dsShowAll = !dsShowAll; return update(); }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'connect') return Stars.connect(update);
  if (act && act.dataset.act === 'disconnect') { Stars.disconnect(); return update(); }
  const c = e.target.closest('.chip[data-kind]');
  if (!c) return;
  e.preventDefault();
  const {kind, tag} = c.dataset;
  if (kind === 'theme') state.theme = state.theme === tag ? null : tag;
  else state.kws = state.kws.includes(tag) ? state.kws.filter(k => k !== tag) : [...state.kws, tag];
  state = {...state, tab: 'issues', open: null, page: 1};
  update(); (NARROW.matches ? $('bar') : document.body).scrollIntoView({behavior: 'smooth'});
});
$('moreKw').onclick = () => { showAllKw = !showAllKw; renderSide(); };
$('q').oninput = e => { state.q = e.target.value.trim(); state.page = 1; renderSide(); $('list').innerHTML = VIEWS[state.tab](); };
document.addEventListener('change', e => {
  if (e.target.id !== 'perPage') return;
  perPage = +e.target.value; state.page = 1;
  try { localStorage.setItem('perPage', perPage); } catch (err) {}
  update();
});
window.addEventListener('hashchange', () => { fromHash(); update(); });
Stars.onChange(update);

fromHash();
$('kwBox').open = !NARROW.matches;
update();
</script>
<script>
(() => {
  const btn = document.getElementById('themeToggle');
  const ORDER = ['system', 'light', 'dark'];
  const LABEL = {system: ['◐', 'System'], light: ['☀︎', 'Light'], dark: ['☾', 'Dark']};
  let mode = 'system';
  try { mode = localStorage.getItem('theme') || 'system'; } catch (e) {}
  if (!ORDER.includes(mode)) mode = 'system';
  const apply = () => {
    if (mode === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = mode;
    const [ic, label] = LABEL[mode];
    btn.innerHTML = `<span class="ic">${ic}</span>${label}`;
    btn.title = `Theme: ${label} (click to change)`;
    btn.setAttribute('aria-label', `Color theme: ${label}. Click to change.`);
  };
  btn.onclick = () => {
    mode = ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length];
    try { mode === 'system' ? localStorage.removeItem('theme') : localStorage.setItem('theme', mode); } catch (e) {}
    apply();
  };
  apply();
})();
</script>
</body></html>
