<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#dcdad3;--accent:#1f6f5c;--chip:#ebe9e2;--chip-on:#1d1d1b;--chip-on-ink:#f4f3ef;--star:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615;--star:#e6b450}}
:root[data-theme="dark"]{--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615;--star:#e6b450}
:root{--toggle-bg:var(--card);--toggle-ink:var(--ink);--toggle-line:var(--line)}

.theme-toggle{position:fixed;top:12px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;
  border:1px solid var(--toggle-line);background:var(--toggle-bg);color:var(--toggle-ink);border-radius:999px;
  padding:7px 13px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.theme-toggle:hover{border-color:var(--toggle-ink)}
.theme-toggle .ic{font-size:14px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:0;padding-right:120px}
.sub{color:var(--muted);margin:4px 0 16px}
a{color:inherit}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px/1 inherit;padding:10px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab small{font-weight:400;margin-left:4px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:16px}
@media (max-width:760px){aside{position:static}}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
details{margin-top:18px}
summary{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";font-size:11px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
summary .n{margin-left:auto;letter-spacing:0;text-transform:none}
details .chips{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--ink);font:13px/1.4 inherit;cursor:pointer}
.chip:hover{outline:1px solid var(--muted)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip small{color:var(--muted);margin-left:3px}
.chip.on small{color:inherit;opacity:.7}
.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font:inherit;font-size:13px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;min-height:28px}
.bar strong{font-size:17px}
.clear{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;padding:3px 8px;font:inherit;font-size:13px}
.card{background:var(--card);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-family:Georgia,serif;font-size:19px}
.card h3 a{text-decoration:none}
.card .intro{color:var(--muted);font-size:14px;margin:0 0 10px}
.row{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.row .body{flex:1;min-width:0}
.row a.go{text-decoration:none;display:block}
.row a.go:hover .hl{text-decoration:underline}
.star{flex:none;text-decoration:none;color:var(--muted);font-size:17px;line-height:1.2;padding:2px 2px 0}
.star.on{color:var(--star)}
.star:hover{color:var(--star)}
.meta{font-size:12px;color:var(--muted)}
.theme{font-weight:600;color:var(--accent)}
.hl{font-weight:600}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kw .chip{font-size:11px;padding:2px 8px}
.chip.thread{background:none;border:1px solid var(--line);color:var(--accent)}
.snip{font-size:13px;color:var(--muted);margin-top:3px}
.note{font-size:13px;margin-top:4px;padding:6px 10px;border-left:3px solid var(--star);background:var(--chip);border-radius:4px}
.paper{font-size:13px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line)}
.card details{margin-top:8px}
details.card{margin:0 0 8px;padding:12px 18px}
details.card>summary{padding:2px 0}
details.card[open]>summary{margin-bottom:6px}
.empty{color:var(--muted);padding:24px 0;line-height:1.6}
.help{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.55}
mark{background:#f2dc8a;color:#1d1d1b;border-radius:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.public{background:#dcefe6;color:#1f5f4c}.badge.university{background:#dfe7f6;color:#28497f}
.badge.commercial{background:#f6e3d6;color:#8a4a1c}.badge.request{background:#efe3f3;color:#6a3a7a}
:root[data-theme="dark"] .badge{filter:brightness(.85) saturate(1.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{filter:brightness(.85) saturate(1.2)}}
.ds{border-top:1px solid var(--line);padding:8px 0}
.ds>summary{font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;padding:2px 0}
.ds .alt{font-size:12px;color:var(--muted);margin:2px 0 4px 17px}
.ds.unused>summary{color:var(--muted);font-weight:400}
.cal{background:var(--card);border-radius:10px;padding:12px 12px 10px;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head button{background:none;border:0;color:var(--ink);font:600 14px/1 inherit;cursor:pointer;padding:6px 8px;border-radius:6px}
.cal-head button:hover{background:var(--chip)}
.cal-head .mon.on{background:var(--chip-on);color:var(--chip-on-ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--muted);padding:2px 0 4px}
.cal-grid .d{font:13px/1 inherit;padding:7px 0;border-radius:6px;color:var(--muted);opacity:.45;border:0;background:none}
.cal-grid button.d{opacity:1;color:var(--ink);font-weight:600;cursor:pointer;position:relative}
.cal-grid button.d::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal-grid button.d:hover{background:var(--chip)}
.cal-grid button.d.on{background:var(--chip-on);color:var(--chip-on-ink)}
.cal-grid button.d.on::after{background:var(--chip-on-ink)}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.cal-foot button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 20px;font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;min-width:34px}
.pager button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}

<script id="data" type="application/json">{"issues": [{"date": "2026-10-17", "intro": "Today: PJM ran on two-thirds of its fleet during an October heat event as data-center load turns shoulder seasons into stress periods; the FMC targets Spanish-flagged ships; Haleon prices carbon into supplier bids; Patagonia merges resale into its main store; and Hormuz attacks sink a container feeder.", "items": [{"n": 1, "id": "2026-10-17#1", "headline": "PJM ran on 66% of its generation fleet during October Maximum Generation Alerts; about a quarter of outages were unplanned", "theme": "Energy & AI Data Centers", "source": "PA Environment Digest Blog", "summary": "During the week of Oct. 12, 2026, PJM had just over 61,000 MW of generation out (only 66% of fleet capacity available). More than two-thirds of outages were planned maintenance and about 15,000 MW were unplanned (preliminary), roughly a quarter rather than the one-third in some headlines. PJM recalled about 10,000 MW and called Demand Response on Oct. 13–14 for weather it called warm but 'not extreme.' DR has now been used on 15 days in 2025–2026 versus 8 in all of 2015–2024. PJM blames year-round data center load growing faster than supply and transmission, plus longer weather extremes that push into spring and fall maintenance seasons.", "rq": "How does growth in year-round large-load demand change the optimal timing of generator maintenance, and has it raised shoulder-season scarcity events and prices in PJM?", "related": ["Dynamic Pricing of Peak Production"], "keywords": ["data center electricity demand", "grid reliability standards", "maintenance scheduling", "demand response", "load forecasting"], "datasets": ["pjm_data", "eia930"], "thread": null}, {"n": 2, "id": "2026-10-17#2", "headline": "FMC proposes $200,000 per-voyage fee on Spanish-flagged vessels and possible limits on Spanish imports", "theme": "Trade & Industrial Policy", "source": "Supply Chain Dive", "summary": "On Oct. 14 the Federal Maritime Commission proposed a $200,000 per-voyage fee on Spanish-flagged vessels and possible import restrictions on Spanish perfumery and cosmetics, oils and fats, ceramics, stone articles, and sugar and confectionery (docket FMC-2026-0463). The action follows a 2024 investigation finding Spain denied port access to U.S.-flagged ships, including two Maersk vessels carrying Maritime Security Program cargo; Spain cited EU regulations. Comments are due Dec. 14, Spain will be offered a hearing, and the docket expects restricted goods to be replaced mostly from other countries.", "rq": "Following the FMC announcement, how fast do U.S. importers of the targeted Spanish product categories shift to alternative origins, and does pre-buying occur before restrictions take effect?", "related": ["Interplay between Competing and Coexisting Policy Regimens within Supply Chain Configurations"], "keywords": ["sourcing restrictions", "supplier diversification", "pre-buy behavior", "maritime policy"], "datasets": ["usitc_dataweb", "federal_register"], "thread": null}, {"n": 3, "id": "2026-10-17#3", "headline": "Haleon adds an EU ETS carbon price to supplier bids, shifting 1–2 of every 10 deals", "theme": "Sustainable Operations", "source": "Trellis", "summary": "Haleon asks most suppliers to estimate the carbon footprint of each purchase. It multiplies that figure by the EU ETS price (about €80/t CO2) and adds it to the bid, so the lowest combined total wins. The charge averages about 2% of bid value (about 10% for plastic bottles, about 1% for acetaminophen) and shifts 1–2 in 10 deals to pricier, lower-carbon bidders, per Haleon's Chris Low. Nearly a quarter of key suppliers now measure emissions directly, up from none in 2024. Haleon is piloting contracts with annual emission-reduction commitments and financial penalties, toward a 42% Scope 3 cut over 2022–2030; its latest report shows 13%.", "rq": "In a scoring auction that adds a carbon charge based on supplier-reported footprints, when does the buyer gain from rewarding primary measurement over industry-average estimates, and how much emission reduction does the charge buy per dollar of higher procurement cost?", "related": ["Helping hampered bidders—Do subsidy auctions work as intended?", "Customer base environmental disclosure and supplier greenhouse gas emissions: A signaling theory perspective"], "keywords": ["supplier emissions", "scope 3 disclosure", "internal carbon pricing", "procurement auctions"], "datasets": ["cdp", "sbti"], "thread": null}, {"n": 4, "id": "2026-10-17#4", "headline": "Patagonia folds Worn Wear resale into its main store after selling ~160,000 used items ($13M) in fiscal 2026", "theme": "Circular Economy", "source": "Trellis", "summary": "Patagonia is closing the separate nine-year-old Worn Wear site and listing used items next to new ones on its main store, with a shared cart and the same warranty. It sold almost 160,000 verified secondhand items (about $13M) in fiscal 2026. More than 40 staff in Reno processed about 230,000 garments in 2025, and about 80% were resellable. The switch took a multiyear IT overhaul to handle unique SKUs, discontinued items and condition-based pricing that Trove previously managed.", "rq": "Does listing used items alongside new ones on a brand's main site cannibalize or complement new-product sales, and how should condition-based prices be set when returns supply is uncertain?", "related": ["The Future of Retail Operations"], "keywords": ["closed-loop supply chain", "recommerce", "cannibalization", "condition-based pricing"], "datasets": [], "thread": null}, {"n": 5, "id": "2026-10-17#5", "headline": "Hormuz attacks hit a record six ships in one day; Singapore-flagged feeder GFS Pride sinks with containers aboard", "theme": "Supply Chain Resilience", "source": "FreightWaves", "summary": "At least 10 vessels were attacked in or near the Strait of Hormuz from Oct. 11, including six on that day alone, the most in a single day since the U.S.–Iran war began in February. UKMTO logged 12 attacks Oct. 5–11, a weekly record. The 2,824-TEU feeder GFS Pride was struck Oct. 13 and sank off Oman with all 21 crew safe; the cause is disputed between a mine and projectiles or a drone. GFS Giselle and DP World Kaveri were also hit, and Maersk, ONE, PIL and OOCL had schedules on some affected ships. Kpler counted 131 transits in the week to Oct. 14 versus 176 the week before, with crude flows down to about 12.6M b/d from about 15M at end-September.", "rq": "How do carriers adjust capacity sharing (slot charters on third-party feeders) and freight rates in response to escalating chokepoint attack intensity?", "related": [], "keywords": ["freight rates", "chokepoint disruption", "war-risk insurance", "slot sharing"], "datasets": ["gdelt", "ocean_schedules"], "thread": null}], "papers": [{"title": "Operations Management in the Sharing Economy: Advances, Challenges, and Opportunities", "journal": "M&SOM", "url": "https://doi.org/10.1287/msom.2025.0643"}, {"title": "The Buy-in Effect: When Increasing Initial Effort Encourages Follow-Through", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2023.03600"}], "also": [{"title": "PUC Invites Comments On Regulations To Give Electric Utilities New Tools To Manage Data Centers During Emergency Periods Of Strained Electricity Supplies And Curtailments To Maintain Grid Reliability ", "url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxQbnFRNjVKQ1JHQWxJYlRWdVU4eG5nZzI2SVk2am9SbmE2RlktaXlnbTFOdGpIZ01OM21nc3BOY0lvVFZCY3FKdFRvVjdDZjgtQnZfRVdSbkJ0SjkzVnhSZFNjSjB4SlRRaDh1T1NYSHZEdXBtQWJmY2xYQVh2ajFLWVo0aUhEeThlWGwwcHk4Rkt6TkVI?oc=5", "source": "PA Environment Digest Blog"}, {"title": "Korean battery makers shift to domestic LFP cathodes amid US IRA rules - CHOSUNBIZ", "url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxON3doMVFSSElwNC1lc3d6TElTZmRmOEc2SVR2c3FFZXZQMXg1aHFGMU9uNWRleGJUcDllMmFuRmNFdHlRWFlnblhYMGx5R0xlemxlR3doN1dYSVUzRUNNZ21pdWJOSTRxREd1Qkh6cUhld2lNTFVOSW9TYU5JLVplYndB0gGWAUFVX3lxTE44VU5XYk5RR29Fd19qRFVmeER5ek1UUEFPRmFQZGxwYkYtXzNHOEY3Y2VKZkwzcFoySjA0SE8yblp5Sk5DenFuSHpDQUlSYVVLM0dWMWd2MGYtZjZLQlpfRDRabFBlUnFucDhyektvT2hKUzVnNHloaW8xOEtRakRpdWN3bnppR2w0TDNYYklrZ3lBNXNFQQ?oc=5", "source": "Chosunbiz"}, {"title": "El Niño Threatens Global Sugar Supply", "url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxQV1RWcnM4OTluS2ZWX09xNHpRNmgwSFRrTF92NDJMQVlGYWhDaTdDTjdyZkExSTFyYXhPclBHQmJja0NTS2Y1Z2pINENUQjMtX3J6RWszcHdWOHI3dFF4N0p4RE5rSndiLWRNajNDMS1XY2ZhWHlPOU15UFVEQ2VFRXhUWVlnRjhab3dRTzFRbzQ?oc=5", "source": "The New York Times"}, {"title": "Uncertain IMO Rules Weigh on Shipping’s Demand for Cleaner Marine Fuels", "url": "https://news.google.com/rss/articles/CBMif0FVX3lxTE1BWFFGdk1VdW03X0dxdk9RT0YxcGdOaTlUdGgyMzhEMkNWLVNJSlJvb0ZOd1pvMl9DVUdxSnk0Rlh4ejUyZlY0Wkd0WW8yM29pMlp6Vkxrbm5HMHJJekFudWVjYm1ZZkNCVENncUpBeFFtVXRYYzdRN1FJTjI2Q2c?oc=5", "source": "Marine Link"}, {"title": "Hawaiian reuse program to feature metal containers rather than plastic", "url": "https://www.packagingdive.com/news/perpetual-sourcing-reusable-foodservice-ware/832647/", "source": "Packaging Dive"}]}, {"date": "2026-10-16", "intro": "Today's issue covers a proposed size threshold for regulating AI data center grid connections, a new solar trade shock, a voluntary nature-disclosure sample, a closed-loop EV battery deal, and a traceability problem in the nickel behind EV batteries.", "items": [{"n": 1, "id": "2026-10-16#1", "headline": "NERC stakeholders approve reliability standards for data centers and crypto miners of 50 MW+ at 100 kV+", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "NERC stakeholders passed new standards for 'computational loads' (Project 2026-02; CLO-001-1 and CLO-002-1) in a final ballot announced Oct. 15, 2026. The standards next go to the NERC Board of Trustees and then to FERC. They appear to cover loads of 50 MW or more connected at 100 kV or higher and address interconnection modeling, operational data and communications, load protection coordination and disturbance monitoring. They follow a rare Level 3 alert NERC issued in May after data centers suddenly dropped load or swung demand; NERC forecasts 224 GW of summer peak growth over 10 years, 24% above 2025.", "rq": "After the standards were proposed, do new computational-load projects bunch just below 50 MW or connect below 100 kV, and does that bunching vary with how stringent the requirements are expected to be?", "related": ["Robust Generator Maintenance Schedule for Frequency-Secure Power Systems"], "keywords": ["data center electricity demand", "interconnection policy", "facility siting", "regulatory thresholds", "grid reliability standards"], "datasets": ["ercot_reports", "ferc_elibrary"], "thread": null}, {"n": 2, "id": "2026-10-16#2", "headline": "ITC finds solar cell imports from India, Indonesia and Laos injured US makers, clearing way for AD/CVD orders", "theme": "Trade & Industrial Policy", "source": "Utility Dive", "summary": "On Oct. 14, 2026, the ITC voted that crystalline silicon solar cell imports from India, Indonesia and Laos injured US producers. The decision follows Commerce's final determination last month. Petitioners, led by First Solar, Hanwha Qcells USA and Mission Solar, cite India dumping margins of 123% and countervailing duty rates of 126%, and they expect final orders around Nov. 2. They also say Ethiopia has become the third-largest US solar import source, up more than 3,000% in 12 months, and have asked Commerce to investigate possible tariff evasion. A Section 232 polysilicon tariff takes effect Dec. 4.", "rq": "How quickly and how completely do US solar cell imports shift to non-covered countries such as Ethiopia after successive AD/CVD actions, and does each new shift indicate transshipment, judged by the importer and supplier networks involved?", "related": ["Shock and Awe: A Theoretical Framework and Data Sources for Studying the Impact of 2025 Tariffs on Global Supply Chains", "Return to the United States: Impact of Reshoring Announcements and Reshoring Risks on Market Valuation"], "keywords": ["sourcing restrictions", "supplier diversification", "antidumping duties", "tariff circumvention"], "datasets": ["usitc_dataweb", "federal_register"], "thread": null}, {"n": 3, "id": "2026-10-16#3", "headline": "836 organizations in 57 countries now commit to TNFD nature reporting as ISSB and ISO standards approach", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "The TNFD reports that 836 organizations in 57 countries have committed to report under its recommendations, a 14% increase in under a year. They include financial institutions with more than $26 trillion in assets and listed firms worth over $10.5 trillion. More than 1,100 organizations make at least one TNFD-aligned disclosure, averaging 8 of the 14 recommended disclosures. The ISSB is about to issue a non-mandatory practice statement on nature-related disclosure, and ISO has approved turning the TNFD's LEAP approach into an ISO standard.", "rq": "Are firms with more upstream exposure to nature-intensive sectors more likely to adopt TNFD early, and does adoption change their supplier mix or sourcing disclosures afterward?", "related": ["Supply Chain Carbon Footprinting and Climate Change Disclosures of Global Firms", "When does it pay to be green? The strategic benefits of adoption speed"], "keywords": ["nature-related disclosure", "voluntary disclosure", "biodiversity risk", "scope 3 disclosure"], "datasets": ["cdp", "compustat"], "thread": null}, {"n": 4, "id": "2026-10-16#4", "headline": "Rivian widens Redwood deal: manufacturing scrap recycling plus second-life packs powering its Illinois plant", "theme": "Circular Economy", "source": "Electric Cars Report", "summary": "On Oct. 14, 2026, Rivian and Redwood Materials announced that Redwood will also recycle battery scrap from Rivian's manufacturing. Redwood will keep collecting used Rivian packs through Rivian's nationwide service centers; each pack is checked and either reused for stationary storage or recycled. Redwood also provides storage at Rivian's plant in Normal, Illinois, building on an April 2026 deal for a 10 MWh system made from more than 100 second-life packs to cut electricity costs and peak grid strain. Financial terms and volumes were not disclosed.", "rq": "For a manufacturer collecting used packs through its service network, what grading threshold and inventory policy should decide between second-life storage at its own sites and recycling, given its plant's peak electricity charges and recycled-material prices?", "related": ["LOOKING FORWARD, PUSHING BACK AND PEERING SIDEWAYS: ANALYZING THE SUSTAINABILITY OF INDUSTRIAL SYMBIOSIS"], "keywords": ["battery storage", "second-life batteries", "closed-loop supply chain", "battery recycling"], "datasets": ["sec_edgar", "state_puc"], "thread": null}, {"n": 5, "id": "2026-10-16#5", "headline": "Guardian analysis links nickel in VW, Ford and Tesla batteries to deforestation on Indigenous land in Sulawesi", "theme": "Critical Minerals & Batteries", "source": "The Guardian", "summary": "A Guardian analysis published Oct. 16, 2026, using company filings, two years of trade data and satellite imagery, links mines in the battery supply chains of Volkswagen, Ford and Tesla to tree loss on Tolaki Indigenous land in Sulawesi, Indonesia. Sulawesi holds the world's largest nickel deposits. According to a secondary summary, ore from the Cahaya and Hengjaya mines moves through local smelters to Zhejiang Huayou Cobalt plants in China, and Huayou supplies cathode materials to CATL. The batteries only 'may contain' this nickel, because public documents cannot tie specific shipments to specific cars.", "rq": "When investigations publicly link automakers to upstream environmental harm through multi-tier mineral chains, do the automakers or their cathode and cell suppliers change sourcing or traceability disclosures, and are the market effects concentrated on the brand or spread to the intermediate tiers?", "related": ["Chain liability in multitier supply chains? Responsibility attributions for unsustainable supplier behavior", "Cascading Sustainability in Multi‐tier Supply Chains: When Do Chinese Suppliers Adopt Sustainable Procurement?"], "keywords": ["supplier region risk", "multi-tier traceability", "nickel supply chain", "deforestation"], "datasets": ["un_comtrade", "reprisk"], "thread": null}], "papers": [{"title": "EXPRESS: Mind the Cost of Disturbance: Firm-Level Supply Chain Risk and the Bank Loan Cost", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261499809"}, {"title": "Shipment Monitoring, Allocation, and the Impact on Food Waste", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2024.07382"}], "also": [{"title": "California diesel prices remain above $8 per gallon as truckers call for relief", "url": "https://www.supplychaindive.com/news/california-diesel-prices-remain-above-8-per-gallon-as-truckers-call-for-re/833092/", "source": "Supply Chain Dive"}, {"title": "Texas county sues to close WM landfill over alleged RCRA violations", "url": "https://www.wastedive.com/news/texas-county-sues-to-close-wm-landfill-over-alleged-rcra-violations/833101/", "source": "Waste Dive"}, {"title": "AEP in deal to buy up to 1.6 GW of Mainspring linear generators", "url": "https://www.utilitydive.com/news/aep-mainspring-linear-generators-bloom-fuel-cell-google-wyoming/833104/", "source": "Utility Dive"}, {"title": "LCCI Warns EU Deforestation Rules Could Threaten Over Half Of Nigeria’s Cocoa Exports", "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxPU0JHR29fc215NTZ3SHduVXJId0wwTkFNVVhPYU1KVG12N01MWU9NVHVjamVfbnppVHo5WEdvaFd6XzlsaXE1QTNqbnBIZEZWcGh0WEdRb3BGdVpaY2JWcmRnSEQ3bVZuRG52NVJ5ZEl4dXFwRGJCNTcwY2pOVzZhVUx5VGdMeHNZY3B1dmFaMnhFZUU0amxGUGRDMjFiVHUtS1A0OG5lUkFDUQ?oc=5", "source": "Arise News"}, {"title": "Best Buy pilots battery-powered vehicles at California distribution sites", "url": "https://www.esgdive.com/news/best-buy-pilots-battery-powered-vehicles-at-california-distribution-sites/833103/", "source": "ESG Dive"}]}, {"date": "2026-10-15", "intro": "Today's issue covers two regulatory deadlines and three operational stress points. California has locked in the first mandatory US state climate-reporting deadline, and CBP has proposed a rule that would compress filing windows for low-value imports. PJM will study a 10-GW AI campus with its own gas fleet, Greece has drafted a renewable mandate for data centers, and California's packaging EPR plan has been revised with lower budgets.", "items": [{"n": 1, "id": "2026-10-15#1", "headline": "California finalizes SB 253 rules, setting November 10, 2026 as the first deadline for corporate GHG reports", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "California's Office of Administrative Law approved CARB's initial corporate GHG reporting regulation on Oct. 12, 2026, effective immediately, leaving companies about a month to file. Firms with more than $1B in revenue doing business in California must report Scope 1 and 2 emissions by Nov. 10, 2026, and Scope 3 begins in 2027. In year one, CARB will accept reports without third-party assurance and lets firms use emissions data they have already collected. CARB's preliminary list puts more than 4,000 companies likely in scope. Enforcement of SB 261, the climate-risk reporting law for firms above $500M in revenue, remains paused under a Ninth Circuit injunction.", "rq": "Did firms newly covered by SB 253 change how they measure and report Scope 1 and 2 emissions relative to similar uncovered firms? Did their suppliers start receiving, and answering, more emissions-data requests?", "related": ["Are Firms Voluntarily Disclosing Emissions Greener?", "Engaging Supply Chains in Climate Change"], "keywords": ["mandatory climate reporting", "scope 3 disclosure", "supplier emissions", "state environmental policy"], "datasets": ["cdp", "sec_edgar"], "thread": null}, {"n": 2, "id": "2026-10-15#2", "headline": "PJM to study SoftBank's ~10-GW Ohio AI campus and its gas generation and 765-kV lines under the state agreement approach", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "PJM has filed a study agreement at FERC to evaluate SoftBank's 'Flagship' AI data center complex in Ohio, along with the generation and transmission needed to serve it, under its state agreement approach. An AEP Ohio data center tariff will serve an initial 800-MW phase. The PJM study covers another 9.6 GW of load plus 10.2 GW of new gas generation that SB Energy would build in phases through 2032. The February announcement had instead cited about $33B for 9.2 GW of gas. AEP Ohio plans three 765-kV lines, and most of the project would sit at DOE's former Portsmouth uranium enrichment site in Pike County.", "rq": "How does planning large data center loads together with dedicated generation under PJM's state agreement approach change interconnection timelines and transmission cost allocation, compared with the standard interconnection queue?", "related": [], "keywords": ["interconnection policy", "data center electricity demand", "interconnection queues", "federal-state jurisdiction", "capacity investment under uncertainty"], "datasets": ["ferc_elibrary", "state_puc"], "thread": null}, {"n": 3, "id": "2026-10-15#3", "headline": "Greek draft law would require 60% renewable power for data centers, a €200k/MW grid-queue guarantee and a public registry", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "Greece's energy ministry has drafted a law requiring data centers to source at least 60% of their electricity from renewables, met through direct connection to renewables or storage or through PPAs. Sources disagree on whether the rule covers only new sites. Developers would post a €200,000/MW bank guarantee to reserve grid capacity, could not split projects to get lighter rules, and could be offered flexible, capped connections where the grid is constrained. Grid operators would publish regional connection capacity every quarter, and the regulator RAAEY would create a data center registry. Public comment runs until Oct. 24, 2026.", "rq": "How does a per-MW collateral requirement combined with a 60% renewable sourcing mandate affect the volume of speculative data center connection requests and where data centers choose to locate?", "related": ["Meeting Corporate Renewable Power Targets"], "keywords": ["collateral requirements", "capacity caps", "facility siting", "interconnection queues", "data center electricity demand"], "datasets": [], "thread": null}, {"n": 4, "id": "2026-10-15#4", "headline": "Circular Action Alliance cuts first-year California SB 54 EPR budget to about $1.1B in revised plan; CEO to depart", "theme": "Circular Economy", "source": "Waste Dive", "summary": "Circular Action Alliance submitted a revised 495-page SB 54 packaging EPR plan to CalRecycle on Oct. 13, 2026, after a public comment period that drew more than 2,400 comments. The 2027 budget falls from up to $1.87B to about $1.11B, and the five-year range falls from $9.35B–$17.2B to $7.81B–$13.1B. The 2027 budget includes a $500M mitigation fund and a MRF capital fund capped at $100M, and the plan concedes that even PET and HDPE bottles fall short of the first plastic recycling target. CalRecycle has 75 days to act, and founding CEO Jeff Fielkow will leave later this year, with Jeff Meyers as interim CEO.", "rq": "How do producer fees and MRF capital allocations in SB 54's program plan relate to material-level recycling gaps? Do these fee structures create incentives for packaging redesign?", "related": ["Do E‐Waste Laws Create Behavioral Spillovers? Quasi‐Experimental Evidence from California"], "keywords": ["extended producer responsibility", "packaging regulation", "state environmental policy", "litigation risk"], "datasets": ["state_epr", "epa_msw"], "thread": null}, {"n": 5, "id": "2026-10-15#5", "headline": "CBP proposes requiring filing by arrival for imports of $2,500 or less, plus a new postal entry type with 15-day abandonment", "theme": "Trade & Industrial Policy", "source": "Supply Chain Dive", "summary": "CBP's proposed rule, published Oct. 8, 2026, would require electronic Type 11 informal entries to be filed on or before arrival, instead of within 15 days after. CBP's own sample of September–November 2025 entries found more than half would have missed that deadline. A new Entry Type 13 would cover mail shipments of $2,500 or less, with tracking numbers placed on manifests. Mail shipments not filed within 15 days would be deemed abandoned, compared with USPS's current 30-day hold. CBP says it cannot certify that the rule avoids significant impacts on small businesses, and comments are due Dec. 7, 2026.", "rq": "How would moving informal entries to filing-before-arrival change clearance times, abandonment rates and the split of low-value imports between postal and express channels?", "related": ["Estimating the Operational Impact of Container Inspections at International Ports", "Securing the Containerized Supply Chain: Analysis of Government Incentives for Private Investment"], "keywords": ["regulatory uncertainty", "de minimis", "customs compliance", "cross-border e-commerce"], "datasets": ["federal_register", "census_trade"], "thread": null}], "papers": [{"title": "Operations management for sustainable development and public policy making", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261499103"}], "also": [{"title": "LG Energy Solution Reshuffles Battery Equipment Supply Chain After Partner Default", "url": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxNOVJxaVlNbC1nMXB4QkVHRkFUcmd6WWtjd0ZSVm45R0NxdVFmZUpFb1gtei1lRTBsam83eVdsNkdzYkxEV1cxYWljYy15S2ZocVF5aW9YZ1EyLXg1UWFLTjdNa1Nia3VqMlhMZHB4NlpVTUthV1dkQjZpNFZnWWlKX3FfQVA1bXdoOG4zbUVzQVVsWjc4aWoxZ2p1a3dMQTVCbzJ4anVNZFRhSkVTbW1lYTJubGdnZUhP?oc=5", "source": "https://www.briefasia.com/"}, {"title": "Houthi attacks add new geopolitical risk to softening container rates", "url": "https://www.freightwaves.com/news/houthi-attacks-add-new-geopolitical-risk-to-softening-container-rates", "source": "FreightWaves"}, {"title": "Thai industries’ flood losses estimated at B6-7bn", "url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxNcHV6YlZBX2toRWlHVlRObTNPWkhuU3JwdVZwQ2xubFE1Z0QyUUI4M01RVTRLcUFENzg1NmVqSzJwNlRKRHJaNGd2d0ZCNDN5QjJrTWNLWmRoaVU3cTdqT3I0aXE3R25fQjJqVHpRUFhBelhhV1ozcFM4UkV0OHo2WTE4TjM0anV1T2V6eFVvOFdhU1FpTDZGYm9neW9oWU9QcXc?oc=5", "source": "Bangkok Post"}, {"title": "Only a handful of major apparel brands pay garment workers a living wage: report", "url": "https://www.esgdive.com/news/few-apparel-brands-pay-garment-workers-living-wage-report/833099/", "source": "ESG Dive"}, {"title": "All Eight Major Fertilizer Nutrients Cost More Than Last Harvest", "url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxPNEcxZHJPZ3hnYjVXallGRmZUNVBXZWpocG9MVTZ3MDY4VUw4U0R6ZF9Lekl6MlhWNV9POW9aZlJmV2NMWFFIaTZxUkRPYzhTQVl6cklyRHVTRTZCZ3V4cGpsRGszUTd3UFJQc09TbnhOM1JFZTQ5YnF3NWU2VzlKek5ZN2pfa2xSV0NFQjhzYw?oc=5", "source": "RFD-TV"}]}, {"date": "2026-10-14", "intro": "Today's issue covers two hard policy shocks to energy infrastructure, Israel's proposed 200 MW cap on new data centers and a US order restricting Chinese grid equipment. It also covers a proposed rollback of Australia's Scope 3 reporting, a cyberattack that disrupted supermarket refrigeration across France, and a regulation-driven pre-buy surge in Mexican heavy-truck exports.", "items": [{"n": 1, "id": "2026-10-14#1", "headline": "Israel's Electricity Authority moves to cap new data centers at 200 MW as grid requests reach ~27 GW", "theme": "Energy & AI Data Centers", "source": "CTech", "summary": "Calcalist/CTech reports that Israel's Electricity Authority plans to limit any new data center to 200 MW, citing anonymous members of its governing board. A draft grid-connection decision was expected to go out for public comment. Grid operator Noga already holds connection requests from 50 facilities above 200 MW, including Mega DC (1,100 MW, Hadera) and SDS (875 MW, Nesher), which could not be approved as planned. This follows a 140-day freeze on applications of 8 MW or more, imposed after requests hit about 27,000 MW, close to three times average national load; data centers could use about 20% of Israel's electricity by 2030.", "rq": "How do per-site capacity caps change data-center project sizing, geographic dispersion and queue attrition compared with queue-based rationing such as moratoria or deposits, and what is the cost in lost scale economies?", "related": ["How Sustainable Is Big Data?", "Meeting Corporate Renewable Power Targets"], "keywords": ["data center electricity demand", "interconnection policy", "interconnection queues", "capacity caps", "facility siting"], "datasets": ["lbnl_queues", "ercot_reports"], "thread": null}, {"n": 2, "id": "2026-10-14#2", "headline": "Australian opposition introduces bill to scrap mandatory Scope 3 reporting and drop smaller firms from climate disclosure", "theme": "ESG & Disclosure", "source": "AFR", "summary": "On 14 Oct 2026, the opposition Liberal–National Coalition announced the Treasury Laws Amendment (Scrapping Scope 3) Bill 2026. Senator Jane Hume will introduce it in the Senate. The bill would remove mandatory Scope 3 reporting, which is due to start for large firms next financial year, and exempt 'Group 3' entities with $50m–$200m revenue, who join from 1 July 2027. Treasury estimates Scope 3 modelling at about $245,000 per firm in year one and about $160,000 a year after that; the Coalition puts Group 3 first-year costs at up to $70,000.", "rq": "Does regulatory uncertainty over a pending Scope 3 mandate cause in-scope Australian firms to delay supplier engagement and Scope 3 data collection compared with firms facing a settled mandate?", "related": ["Market Reaction to Mandatory Nonfinancial Disclosure", "Customer base environmental disclosure and supplier greenhouse gas emissions: A signaling theory perspective"], "keywords": ["scope 3 disclosure", "mandatory climate reporting", "regulatory uncertainty", "supplier emissions"], "datasets": ["cdp"], "thread": null}, {"n": 3, "id": "2026-10-14#3", "headline": "Cyberattack on Danfoss refrigeration controllers hits ~700 French supermarkets, forcing food disposal", "theme": "Supply Chain Resilience", "source": "Food Manufacturing", "summary": "France's finance minister said on 13 Oct 2026 that cyberattacks disrupted refrigeration systems at about 700 of the country's 10,000 supermarkets, including stores of Coopérative U (80 of 2,000 stores, some of which discarded food), Carrefour and Monoprix. Danish supplier Danfoss said most affected systems were older products no longer receiving security updates. The Paris prosecutor's cybercrime unit is investigating losses from spoiled food and possible fires. Separately, and not linked by AP, Ahold Delhaize is restoring systems it shut down after a 'security issue.'", "rq": "How do the age of a retailer's installed equipment and vendor end-of-support policies affect its exposure to cyber-physical disruptions and the resulting perishable inventory losses?", "related": ["Strange Dance Partners: Supply Chain Cyberattacks and Chained Vulnerability", "Impact of cybersecurity on operations and supply chain management: Emerging trends and future research directions"], "keywords": ["cyber-physical risk", "cold chain", "vendor end-of-support", "common-mode failure", "perishable inventory"], "datasets": ["reprisk", "gdelt"], "thread": null}, {"n": 4, "id": "2026-10-14#4", "headline": "Rystad: battery storage is most exposed under US executive order restricting Chinese grid equipment", "theme": "Trade & Industrial Policy", "source": "Review Energy", "summary": "Executive Order 14421 (26 Aug 2026) restricts foreign grid equipment that poses a national-security risk, citing AI and data-center growth. It covers transformers, inverters, battery storage, breakers, turbines and UPS batteries at critical infrastructure. Rystad finds China supplied 50% of US lithium-ion battery imports by value in the 12 months to June 2026, against 3% for transformers and under 1% for breakers; the next-largest battery suppliers are South Korea (15%) and Japan (13%). Implementing rules due by 24 Dec 2026 will define 'Covered Foreign Entity', and a broad definition could also catch Korean or Mexican plants that use Chinese components or capital.", "rq": "How does a sourcing restriction's impact on project costs and delays depend on prior supplier concentration, comparing batteries (50% from China) with transformers and breakers (diversified)?", "related": ["Product safety and security in the global supply chain: Issues, challenges and research opportunities"], "keywords": ["supplier concentration", "battery storage", "foreign entity of concern", "sourcing restrictions", "supplier diversification"], "datasets": ["usitc_dataweb", "eia860"], "thread": null}, {"n": 5, "id": "2026-10-14#5", "headline": "Mexican heavy-truck exports up 145% in September as US buyers pre-buy ahead of 2027 EPA standards", "theme": "Logistics Decarbonization", "source": "FreightWaves", "summary": "Mexico exported 12,707 heavy-duty vehicles in September 2026, up 144.6% year on year, while production rose to 15,181 from 6,857 (INEGI data presented by ANPACT). Domestic retail sales fell 11.3%, the eighth straight monthly decline, and no electric or natural-gas trucks were produced or exported. ANPACT attributes the surge to US customers ordering ahead of EPA emissions standards scheduled for 2027. A 25% US truck tariff takes effect 1 Nov, and part of the jump reflects a weak September 2025 comparison.", "rq": "How large is the regulation-induced pre-buy of heavy trucks ahead of the 2027 EPA standards, and how much does the subsequent demand trough offset the rule's near-term emissions benefits?", "related": ["Accelerating vehicle fleet turnover to achieve sustainable mobility goals", "Compliance Strategies under Permits for Emissions"], "keywords": ["pre-buy behavior", "fleet turnover", "emissions standards", "cross-border trucking", "nearshoring logistics"], "datasets": ["usitc_dataweb", "bts_transborder"], "thread": null}], "papers": [{"title": "Modeling collective action in POM: The Strategy–Operations–People framework", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261489977"}, {"title": "Comment Letters, Connected Investors, and Corporate Bond Issuance", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2024.07607"}], "also": [{"title": "FERC approves Duke large load transmission rules despite cost-shift concerns", "url": "https://www.utilitydive.com/news/ferc-duke-energy-large-load-tariff-nitsa/832847/", "source": "Utility Dive"}, {"title": "Drought-Driven Low Rhine Water Levels Disrupt European Grain and Feed Supply Chains", "url": "https://news.google.com/rss/articles/CBMisAFBVV95cUxNVWo0Ty1iMy1zd1NJTFc4aWx6dlN5MWdOS2V0WkVYUUotOEJWOG1VTXVfUkY0SkZGTzlTU3NqUS1HT3lqOWZUX1B2dFhsMVJsaW1hZDRmcGdsWlItbjRvRUVuYnQzNG9PSDJlWHV0bzJUMzZrTG0tUGdnWVAwOHZfZVJVY3FMLUNIbWEybm9aZkZiSHhGa0hjc2JiTktrUlpaRENsZlBCTjN0TTNTTjIzeg?oc=5", "source": "CMB News"}, {"title": "Nigeria risks $1bn export loss over EU deforestation rules —NEPC", "url": "https://news.google.com/rss/articles/CBMimwFBVV95cUxQNWc1QTBXSlZRaThGeVBmd3pWYmNxSDZlcG16SUktTUlIZHV4Y1hCa1NXMTFVc2EtTld4LXN4cEg5ZlNXaV9DRnIzZjQxYmI5Y2hMX3FsU2RSWFc5Rkw4eFo2eE92cExGaGlBMG5YbmhxNnFMMGR0bWhYWVUxLWFXLWNORG0tUkNXZ2tkUWRTRVA1Sm12N0MxQWxSNA?oc=5", "source": "Tribune Online"}, {"title": "Pro Disposal receives ‘multimillion dollar’ MRF loan from Closed Loop", "url": "https://www.wastedive.com/news/pro-disposal-loan-closed-loop-partners-for-pennsylvania-mrf-equipment/832843/", "source": "Waste Dive"}, {"title": "TrusTrace launches new report: More than one in five fashion brands selling into the U.S. have had shipments detained", "url": "https://news.google.com/rss/articles/CBMi2AFBVV95cUxQVjdLWVB3dXpOdkktWHNfRnhNWERTNWViNFE4WXRXTGpYNkJhTWFXenZkbFhBZlpFVHpwTnB1RVdSOUV1Z2RBbk1vZHozeVhSdVlRQ2JSRUplV05hczFWMWxFMEdtd21menFLc3ZzeEljY3BnWmJScHB1dHpQRDN4ejRDS2JZeGpJZE5iR2JSdXZHMS1XMW9BYml1YzVjQ2tlSlJpN0lOQlIzN2lzbFZET0xEYkZ4d1lSTDBSdWw5U0FmXy04NjZFM055Vlh0ZWV3RjRrVW8xOXk?oc=5", "source": "American Journal of Transportation"}]}, {"date": "2026-10-13", "intro": "Today's issue leads with two data center power stories. FERC rejected most of PJM's large-load interconnection plan but approved a new data center registry, and utilities are using collateral rules to weed out speculative 'phantom' requests. Also covered: Taylor Farms' seasonal sourcing pullback from central Mexico, a driver-visa shock to cross-border trucking, and an Oregon packaging EPR lawsuit paused pending a Ninth Circuit appeal.", "items": [{"n": 1, "id": "2026-10-13#1", "headline": "FERC rejects PJM's curtailment-based large-load interconnection plan, approves data center registry", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "On Oct. 9, 2026, FERC rejected the core of PJM's plan for connecting data centers and other large loads (accession no. 20261009-3055). The rejected Interim Resource Adequacy Service (IRAS) would have let large loads connect without matching new capacity if they accepted curtailment ahead of grid emergencies. FERC found it intruded on state authority over retail rates and appeared to discriminate against large loads, but it approved PJM's large-load definition and a registry of each facility's location, ramp schedule and capacity supply. Jefferies expects PJM capacity prices to stay higher for longer and any revival to be state-led, with Ohio and Pennsylvania the ones to watch; the ruling follows FERC's rejection about five weeks earlier of key parts of PJM's backstop procurement auction.", "rq": "How does excluding interruptible large loads from capacity-market demand curves affect procurement levels, prices and reliability outcomes, compared with requiring matched new capacity?", "related": ["Electricity Time‐of‐Use Tariff with Stochastic Demand"], "keywords": ["capacity markets", "interruptible load", "interconnection policy", "data center electricity demand", "federal-state jurisdiction"], "datasets": ["pjm_data", "ferc_elibrary"], "thread": null}, {"n": 2, "id": "2026-10-13#2", "headline": "Utilities use collateral, deposits and longer contracts to filter speculative 'phantom' data center power requests", "theme": "Energy & AI Data Centers", "source": "WSJ", "summary": "According to a Breitbart write-up of a paywalled WSJ report (figures not verified against the WSJ text), Wood Mackenzie rates only 23% of disclosed data center power requests as high confidence. Large-customer requests to Exelon tripled to 18,000 MW. After Exelon required binding commitments and collateral, its high-probability list fell to 11,000 MW, backed by about $1 billion in posted collateral. In Texas, the connection queue exceeds 400,000 MW, large customers now pay a $50,000/MW study deposit, and minimum large-customer contract terms nationally average about 10.8 years versus about 4.6 before 2024 (per Halcyon); Vistra's CEO says demand estimates are overstated by more than 20 times.", "rq": "How much do collateral and deposit requirements reduce queue attrition and forecast error in utility large-load pipelines, and how do they shift which project types (e.g., hyperscaler vs. speculative developer) stay in the queue?", "related": ["Capacity Reservation and Wholesale Price Contracts under Forecast Sharing: A Behavioral Assessment"], "keywords": ["interconnection queues", "demand signaling", "collateral requirements", "capacity investment under uncer <script>
const D = JSON.parse(document.getElementById('data').textContent);
window.STAR_CFG = {repo: D.repo, initial: D.stars,
  headlines: Object.fromEntries(D.issues.flatMap(d => d.items.map(it => [it.id, it.headline])))};
</script>
<script src="stars.js"></script>
<script>
const ISSUES = D.issues;
const ITEMS = ISSUES.flatMap(d => d.items.map(it => ({...it, date: d.date})));
const BY_ID = Object.fromEntries(ITEMS.map(it => [it.id, it]));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const short = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric'});
const link = it => `issues/${it.date}.html#item-${it.n}`;
const NARROW = matchMedia('(max-width:760px)'), KW_TOP = () => NARROW.matches ? 12 : 30;

// threads
const THREADS = {};
ITEMS.forEach(it => { if (it.thread) (THREADS[it.thread] ||= []).push(it); });
Object.values(THREADS).forEach(list => list.sort((a, b) => a.date.localeCompare(b.date) || a.n - b.n));
const THREAD_LIST = Object.entries(THREADS).sort((a, b) => b[1].at(-1).date.localeCompare(a[1].at(-1).date));

// datasets: registry entries (datasets.yaml) with the stories that used them
const REG = D.registry, DS_BY_ID = Object.fromEntries(REG.datasets.map(d => [d.id, d]));
const DATASETS = {};
ITEMS.forEach(it => (it.datasets || []).forEach(id => { if (DS_BY_ID[id]) (DATASETS[id] ||= []).push(it); }));
const DATASET_LIST = Object.keys(DATASETS);
let dsAccess = null, dsShowAll = false;

// filters: one theme + any number of keywords (an article must have all of them) + search text
let state = {tab: 'issues', theme: null, kws: [], q: '', open: null, day: null, month: null, page: 1}, showAllKw = false;

// calendar + paging
const ISSUE_DATES = new Set(ISSUES.map(d => d.date));
const NEWEST = ISSUES[0]?.date || new Date().toISOString().slice(0, 10);
let calView = NEWEST.slice(0, 7);   // 'YYYY-MM' shown in the calendar
let perPage = 7;
try { perPage = +localStorage.getItem('perPage') || 7; } catch (e) {}
const inRange = date => (!state.day || date === state.day) && (!state.month || date.startsWith(state.month));
const monthName = ym => new Date(ym + '-15T12:00:00').toLocaleDateString('en-US', {month: 'long', year: 'numeric'});
const shiftMonth = (ym, k) => { const d = new Date(ym + '-15T12:00:00'); d.setMonth(d.getMonth() + k); return d.toISOString().slice(0, 7); };

function renderCal() {
  const [y, m] = calView.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  const cells = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => `<div class="dow">${d}</div>`);
  for (let i = 0; i < first; i++) cells.push('<div></div>');
  for (let d = 1; d <= days; d++) {
    const iso = `${calView}-${String(d).padStart(2, '0')}`;
    cells.push(ISSUE_DATES.has(iso)
      ? `<button class="d${state.day === iso ? ' on' : ''}" data-calday="${iso}" title="${fmt(iso)}">${d}</button>`
      : `<div class="d">${d}</div>`);
  }
  const n = ISSUES.filter(x => x.date.startsWith(calView)).length;
  const sel = state.day ? fmt(state.day) : state.month ? monthName(state.month) : 'All issues';
  $('cal').innerHTML = `<div class="cal-head"><button data-calnav="-1" aria-label="Previous month">‹</button>
    <button class="mon${state.month === calView ? ' on' : ''}" data-calmonth="${calView}" title="Show this month">${monthName(calView)}</button>
    <button data-calnav="1" aria-label="Next month">›</button></div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-foot"><span>${n} issue${n === 1 ? '' : 's'} this month · showing ${esc(sel)}</span>
    ${state.day || state.month ? '<button data-calall>Show all</button>' : ''}</div>`;
}

function pager(total, size) {
  const pages = Math.max(1, Math.ceil(total / size));
  state.page = Math.min(Math.max(1, state.page), pages);
  const nums = [];
  for (let i = 1; i <= pages; i++)
    if (i === 1 || i === pages || Math.abs(i - state.page) <= 1) nums.push(i);
    else if (nums.at(-1) !== '…') nums.push('…');
  const btns = pages > 1 ? `<button data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>‹ Newer</button>
    ${nums.map(i => i === '…' ? '<span>…</span>' : `<button data-page="${i}" class="${i === state.page ? 'on' : ''}">${i}</button>`).join('')}
    <button data-page="${state.page + 1}" ${state.page === pages ? 'disabled' : ''}>Older ›</button>` : '';
  return {slice: arr => arr.slice((state.page - 1) * size, state.page * size),
          html: `<div class="pager">${btns}<span style="margin-left:8px">Per page</span>
            <select id="perPage">${[5, 7, 10].map(k => `<option ${k === perPage ? 'selected' : ''}>${k}</option>`).join('')}</select></div>`};
}
const filtering = () => !!(state.theme || state.kws.length || state.q);

const matchQ = it => !state.q || (it.headline + ' ' + it.summary + ' ' + it.rq + ' ' + it.keywords.join(' ') + ' ' +
  (it.related || []).join(' ') + ' ' + (it.datasets || []).join(' ')).toLowerCase().includes(state.q.toLowerCase());
const matches = (it, {ignoreTheme = false} = {}) =>
  (ignoreTheme || !state.theme || it.theme === state.theme) && state.kws.every(k => it.keywords.includes(k)) && matchQ(it);

function tally(items, key) {
  const m = new Map();
  items.forEach(it => [].concat(it[key]).forEach(v => m.set(v, (m.get(v) || 0) + 1)));
  return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const ALL_KW = tally(ITEMS, 'keywords');

const TABS = [
  ['issues', 'Issues', ISSUES.length],
  ['threads', 'Story threads', THREAD_LIST.length],
  ['datasets', 'Datasets', DATASET_LIST.length],
  ['starred', '★ Starred', null],
  ['weekly', 'Weekly reviews', D.weekly.length],
];

function chip(kind, v, n) {
  const on = kind === 'theme' ? state.theme === v : state.kws.includes(v);
  return `<button class="chip${on ? ' on' : ''}" data-kind="${kind}" data-tag="${esc(v)}" aria-pressed="${on}">${esc(v)}${n ? `<small>${n}</small>` : ''}</button>`;
}

function hi(s) {
  if (!state.q) return esc(s);
  const re = new RegExp('(' + state.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(s).replace(re, '<mark>$1</mark>');
}

const starBtn = it => D.repo ? `<a class="star${Stars.isStarred(it.id) ? ' on' : ''}" href="#" data-star="${esc(it.id)}">${Stars.isStarred(it.id) ? '★' : '☆'}</a>` : '';

function row(it, {withDate = false, showRq = false, note = null} = {}) {
  const thread = it.thread && THREADS[it.thread].length > 1
    ? `<button class="chip thread" data-thread="${esc(it.thread)}">🧵 ${THREADS[it.thread].length} in thread</button>` : '';
  const kw = it.keywords.map(k => chip('keywords', k)).join('');
  const noteHtml = note === null ? '' : `<div class="note">${note ? esc(note) : '<span class="meta">No note yet.</span>'}
    <button class="clear" data-note="${esc(it.id)}" style="margin-left:6px">${note ? 'Edit note' : 'Add note'}</button></div>`;
  return `<div class="row">${starBtn(it)}<div class="body"><a class="go" href="${link(it)}">
    <div class="meta">${withDate ? fmt(it.date) + ' · ' : ''}<span class="theme">${esc(it.theme)}</span> · ${esc(it.source)}</div>
    <div class="hl">${hi(it.headline)}</div>
    ${state.q ? `<div class="snip">${hi(it.summary)}</div>` : ''}
    ${showRq ? `<div class="snip"><b>Q:</b> ${hi(it.rq)}</div>` : ''}</a>
    ${noteHtml}
    <div class="kw">${thread}${kw}</div></div></div>`;
}

function renderSide() {
  // themes still possible with the chosen keywords/search; keywords present in the current results
  const themes = tally(ITEMS.filter(it => matches(it, {ignoreTheme: true})), 'theme');
  if (state.theme && !themes.some(([t]) => t === state.theme)) themes.unshift([state.theme, 0]);
  $('themes').innerHTML = themes.map(([v, n]) => chip('theme', v, n)).join('') || '<span class="meta">No themes match.</span>';
  const pool = filtering() ? tally(ITEMS.filter(it => matches(it)), 'keywords') : ALL_KW;
  const chosen = state.kws.map(k => [k, (pool.find(([v]) => v === k) || [k, 0])[1]]);
  const rest = pool.filter(([v]) => !state.kws.includes(v));
  const kws = [...chosen, ...(showAllKw ? rest : rest.slice(0, Math.max(0, KW_TOP() - chosen.length)))];
  $('keywords').innerHTML = kws.map(([v, n]) => chip('keywords', v, n)).join('') || '<span class="meta">No keywords match.</span>';
  $('moreKw').hidden = chosen.length + rest.length <= KW_TOP();
  $('moreKw').textContent = showAllKw ? 'Show fewer' : `Show all ${chosen.length + rest.length}`;
  $('nThemes').textContent = themes.length; $('nKw').textContent = chosen.length + rest.length;
  const nStar = ITEMS.filter(it => Stars.isStarred(it.id)).length;
  $('tabs').innerHTML = TABS.map(([k, label, n]) =>
    `<button class="tab${state.tab === k ? ' on' : ''}" data-tab="${k}">${label}<small>${k === 'starred' ? nStar : n}</small></button>`).join('');
}

function bar(title, sub, clear) {
  $('bar').innerHTML = `<strong>${title}</strong>${sub ? `<span class="meta">${sub}</span>` : ''}${clear ? '<button class="clear" id="clear">Clear</button>' : ''}`;
  if (clear) $('clear').onclick = () => { state = {...state, theme: null, kws: [], q: '', open: null, day: null, month: null, page: 1}; $('q').value = ''; update(); };
}

function filterBar(n) {
  const tags = [
    ...(state.theme ? [`<button class="chip on" data-kind="theme" data-tag="${esc(state.theme)}">${esc(state.theme)} ✕</button>`] : []),
    ...state.kws.map(k => `<button class="chip on" data-kind="keywords" data-tag="${esc(k)}">${esc(k)} ✕</button>`),
    ...(state.q ? [`<span class="meta">search “${esc(state.q)}”</span>`] : []),
  ].join('');
  $('bar').innerHTML = `<div class="chips">${tags}</div><span class="meta">${n} article${n === 1 ? '' : 's'}${state.kws.length > 1 ? ' with all selected keywords' : ''}</span>
    <button class="clear" id="clear">Clear all</button>`;
  $('clear').onclick = () => { state = {...state, theme: null, kws: [], q: '', open: null}; $('q').value = ''; update(); };
}

const VIEWS = {
  issues() {
    if (filtering()) {
      const hits = ITEMS.filter(it => matches(it) && inRange(it.date)).sort((a, b) => b.date.localeCompare(a.date) || a.n - b.n);
      filterBar(hits.length);
      const pg = pager(hits.length, perPage * 5);
      return hits.length ? `<div class="card">${pg.slice(hits).map(it => row(it, {withDate: true})).join('')}</div>${pg.html}` : '<div class="empty">No articles match all of these filters.</div>';
    }
    const issues = ISSUES.filter(d => inRange(d.date));
    const pg = pager(issues.length, perPage);
    if (state.day) bar(fmt(state.day), '', true);
    else if (state.month) bar(monthName(state.month), `${issues.length} issue${issues.length === 1 ? '' : 's'}`, true);
    else bar('All issues', `newest first · ${issues.length} issue${issues.length === 1 ? '' : 's'}`);
    return issues.length ? pg.slice(issues).map(d => `<section class="card">
      <h3><a href="issues/${d.date}.html">${fmt(d.date)}</a></h3>
      <p class="intro">${esc(d.intro)}</p>
      ${d.items.map(it => row({...it, date: d.date})).join('')}
      ${d.papers.map(p => `<div class="paper">📄 <a href="${esc(p.url)}">${esc(p.title)}</a> — ${esc(p.journal)}</div>`).join('')}
      ${(d.also || []).length ? `<details><summary>Also worth noting · ${d.also.length}</summary>${d.also.map(a => `<div class="paper"><a href="${esc(a.url)}">${esc(a.title)}</a> — ${esc(a.source)}</div>`).join('')}</details>` : ''}
    </section>`).join('') + pg.html : `<div class="empty">${ISSUES.length ? 'No issue on this date.' : 'No issues yet.'}</div>`;
  },
  threads() {
    let list = THREAD_LIST.filter(([, its]) => its.some(matchQ));
    if (state.open) list = list.filter(([id]) => id === state.open);
    bar(state.open ? 'Story thread' : 'Story threads', state.open ? '' : 'ongoing stories covered more than once', !!state.open || !!state.q);
    if (!list.length) return `<div class="empty">${THREAD_LIST.length ? 'No matching threads.' :
      'No story threads yet. When a new story is a follow-up to something covered earlier, the two are linked here as a timeline.'}</div>`;
    return list.map(([id, its]) => `<section class="card">
      <h3>${esc(its.at(-1).headline)}</h3>
      <p class="intro">${its.length} updates · ${short(its[0].date)} → ${short(its.at(-1).date)}</p>
      ${its.map(it => row(it, {withDate: true})).join('')}</section>`).join('');
  },
  datasets() {
    const q = state.q.toLowerCase();
    const used = id => (DATASETS[id] || []).filter(matchQ);
    const visible = REG.datasets.filter(d => (!dsAccess || d.access === dsAccess) &&
      (dsShowAll || used(d.id).length) &&
      (!q || used(d.id).length || (d.name + ' ' + (d.alt || '')).toLowerCase().includes(q)));
    bar('Datasets', `${DATASET_LIST.length} of ${REG.datasets.length} in your list used so far`, !!state.q);
    const accessChip = (k, label) => `<button class="chip${dsAccess === k ? ' on' : ''}" data-dsaccess="${k || ''}">${label}</button>`;
    const filters = `<div class="filters">${accessChip(null, 'All')}${Object.entries(REG.access).map(([k, l]) => accessChip(k, l)).join('')}
      <button class="clear" data-dsall>${dsShowAll ? 'Hide unused' : 'Show full list'}</button></div>
      <p class="help">The list lives in <code>datasets.yaml</code>. Each story links to at most two entries; datasets outside the list are kept as candidates below. Access tiers are general guidance — check what UMD actually licenses.</p>`;
    const groups = Object.entries(REG.categories).map(([cat, label]) => [label, visible.filter(d => d.category === cat)]).filter(([, ds]) => ds.length);
    const dsRow = d => {
      const its = used(d.id).sort((a, b) => b.date.localeCompare(a.date));
      const name = d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${hi(d.name)}</a>` : hi(d.name);
      return `<details class="ds${its.length ? '' : ' unused'}" ${q && its.length ? 'open' : ''}>
        <summary>${name}<span class="badge ${d.access}">${esc(REG.access[d.access])}</span><span class="n">${its.length || ''}</span></summary>
        ${d.alt ? `<div class="alt">Alternative / note: ${esc(d.alt)}</div>` : ''}
        ${its.map(it => row(it, {withDate: true, showRq: true})).join('')}</details>`;
    };
    const body = groups.length ? groups.map(([label, ds]) => `<section class="card"><h3 style="font-size:16px">${esc(label)}</h3>
      ${ds.map(dsRow).join('')}</section>`).join('') : '<div class="empty">No datasets match.</div>';
    const cands = D.candidates.filter(c => !q || c.name.toLowerCase().includes(q));
    const candHtml = cands.length ? `<details class="card"><summary>Candidates not in your list · ${cands.length}</summary>
      <p class="help" style="margin-top:8px">Named in stories but not in <code>datasets.yaml</code>. Ones mentioned 2+ times also appear in the weekly review; add the useful ones to the list.</p>
      ${cands.map(c => `<div class="paper">${esc(c.name)} <span class="meta">· ${c.mentions} mention${c.mentions === 1 ? '' : 's'}</span></div>`).join('')}</details>` : '';
    return filters + body + candHtml;
  },
  starred() {
    const its = ITEMS.filter(it => Stars.isStarred(it.id) && matchQ(it)).sort((a, b) => b.date.localeCompare(a.date));
    bar('★ Starred', `${its.length} stor${its.length === 1 ? 'y' : 'ies'}`, !!state.q);
    const conn = Stars.connected()
      ? `GitHub connected in this browser · <button class="clear" data-act="disconnect">Disconnect</button>`
      : `<button class="clear" data-act="connect">Connect GitHub</button> (one-time, needed to star from this browser)`;
    const help = `<p class="help">Click ☆ to star a story and ★ to un-star it. Starred stories and their notes steer future picks
      and the weekly review.<br>${conn}</p>`;
    return help + (its.length ? `<div class="card">${its.map(it => row(it, {withDate: true, showRq: true, note: Stars.note(it.id)})).join('')}</div>`
      : '<div class="empty">Nothing starred yet.</div>');
  },
  weekly() {
    bar('Weekly reviews', 'every Sunday');
    return D.weekly.length ? D.weekly.map(w => `<section class="card">
      <h3><a href="weekly/${w.date}.html">Week ending ${fmt(w.date)}</a></h3>
      <p class="intro">${esc(w.overview)}</p>
      ${w.ideas.map(t => `<div class="paper">💡 ${esc(t)}</div>`).join('')}</section>`).join('')
      : '<div class="empty">The first weekly review arrives on Sunday.</div>';
  },
};

function toHash() {
  const p = new URLSearchParams();
  if (state.open) p.set('thread', state.open);
  else if (state.tab !== 'issues') p.set('tab', state.tab);
  if (state.theme) p.set('theme', state.theme);
  state.kws.forEach(k => p.append('kw', k));
  if (state.day) p.set('day', state.day);
  else if (state.month) p.set('month', state.month);
  if (state.page > 1) p.set('page', state.page);
  return p.toString();
}
function fromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const tab = p.get('tab');
  state = {...state, tab: VIEWS[tab] ? tab : 'issues', theme: p.get('theme'), kws: [...p.getAll('kw'), ...p.getAll('tag')], open: p.get('thread'),
           day: p.get('day'), month: p.get('month'), page: +p.get('page') || 1};
  if (state.day || state.month) calView = (state.day || state.month).slice(0, 7);
  if (state.open) state.tab = 'threads';
}

function update() {
  const h = toHash();
  history.replaceState(null, '', h ? '#' + h : location.pathname);
  renderSide();
  renderCal();
  $('list').innerHTML = VIEWS[state.tab]();
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { state = {...state, tab: tab.dataset.tab, open: null}; return update(); }
  const th = e.target.closest('[data-thread]');
  if (th) { e.preventDefault(); state = {...state, tab: 'threads', open: th.dataset.thread}; update(); return window.scrollTo({top: 0, behavior: 'smooth'}); }
  const nt = e.target.closest('[data-note]');
  if (nt) {
    const id = nt.dataset.note, v = prompt('Why is this story interesting? (used to guide future picks)', Stars.note(id));
    if (v !== null) Stars.setNote(id, v.trim());
    return;
  }
  const cal = e.target.closest('[data-calnav],[data-calmonth],[data-calday],[data-calall],[data-page]');
  if (cal) {
    const ds = cal.dataset;
    if (ds.calnav) { calView = shiftMonth(calView, +ds.calnav); return renderCal(); }
    if (ds.page) { state.page = +ds.page; update(); return $('bar').scrollIntoView({behavior: 'smooth'}); }
    if (ds.calall !== undefined) state = {...state, day: null, month: null};
    else if (ds.calmonth) state = {...state, day: null, month: state.month === ds.calmonth ? null : ds.calmonth};
    else state = {...state, month: null, day: state.day === ds.calday ? null : ds.calday};
    state = {...state, tab: 'issues', open: null, page: 1};
    update(); return (NARROW.matches ? $('bar') : document.body).scrollIntoView({behavior: 'smooth'});
  }
  const dsa = e.target.closest('[data-dsaccess]');
  if (dsa) { dsAccess = dsa.dataset.dsaccess || null; return update(); }
  if (e.target.closest('[data-dsall]')) { dsShowAll = !dsShowAll; return update(); }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'connect') return Stars.connect(update);
  if (act && act.dataset.act === 'disconnect') { Stars.disconnect(); return update(); }
  const c = e.target.closest('.chip[data-kind]');
  if (!c) return;
  e.preventDefault();
  const {kind, tag} = c.dataset;
  if (kind === 'theme') state.theme = state.theme === tag ? null : tag;
  else state.kws = state.kws.includes(tag) ? state.kws.filter(k => k !== tag) : [...state.kws, tag];
  state = {...state, tab: 'issues', open: null, page: 1};
  update(); (NARROW.matches ? $('bar') : document.body).scrollIntoView({behavior: 'smooth'});
});
$('moreKw').onclick = () => { showAllKw = !showAllKw; renderSide(); };
$('q').oninput = e => { state.q = e.target.value.trim(); state.page = 1; renderSide(); $('list').innerHTML = VIEWS[state.tab](); };
document.addEventListener('change', e => {
  if (e.target.id !== 'perPage') return;
  perPage = +e.target.value; state.page = 1;
  try { localStorage.setItem('perPage', perPage); } catch (err) {}
  update();
});
window.addEventListener('hashchange', () => { fromHash(); update(); });
Stars.onChange(update);

fromHash();
$('kwBox').open = !NARROW.matches;
update();
</script>
<script>
(() => {
  const btn = document.getElementById('themeToggle');
  const ORDER = ['system', 'light', 'dark'];
  const LABEL = {system: ['◐', 'System'], light: ['☀︎', 'Light'], dark: ['☾', 'Dark']};
  let mode = 'system';
  try { mode = localStorage.getItem('theme') || 'system'; } catch (e) {}
  if (!ORDER.includes(mode)) mode = 'system';
  const apply = () => {
    if (mode === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = mode;
    const [ic, label] = LABEL[mode];
    btn.innerHTML = `<span class="ic">${ic}</span>${label}`;
    btn.title = `Theme: ${label} (click to change)`;
    btn.setAttribute('aria-label', `Color theme: ${label}. Click to change.`);
  };
  btn.onclick = () => {
    mode = ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length];
    try { mode === 'system' ? localStorage.removeItem('theme') : localStorage.setItem('theme', mode); } catch (e) {}
    apply();
  };
  apply();
})();
</script>
</body></html>
