<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#dcdad3;--accent:#1f6f5c;--chip:#ebe9e2;--chip-on:#1d1d1b;--chip-on-ink:#f4f3ef;--star:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615;--star:#e6b450}}
:root[data-theme="dark"]{--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615;--star:#e6b450}
:root{--toggle-bg:var(--card);--toggle-ink:var(--ink);--toggle-line:var(--line)}

.theme-toggle{position:fixed;top:12px;right:12px;z-index:50;display:flex;align-items:center;gap:6px;
  border:1px solid var(--toggle-line);background:var(--toggle-bg);color:var(--toggle-ink);border-radius:999px;
  padding:7px 13px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.theme-toggle:hover{border-color:var(--toggle-ink)}
.theme-toggle .ic{font-size:14px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:0;padding-right:120px}
.sub{color:var(--muted);margin:4px 0 16px}
a{color:inherit}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px/1 inherit;padding:10px 12px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab small{font-weight:400;margin-left:4px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:16px}
@media (max-width:760px){aside{position:static}}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
details{margin-top:18px}
summary{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";font-size:11px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
summary .n{margin-left:auto;letter-spacing:0;text-transform:none}
details .chips{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--ink);font:13px/1.4 inherit;cursor:pointer}
.chip:hover{outline:1px solid var(--muted)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip small{color:var(--muted);margin-left:3px}
.chip.on small{color:inherit;opacity:.7}
.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font:inherit;font-size:13px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;min-height:28px}
.bar strong{font-size:17px}
.clear{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;padding:3px 8px;font:inherit;font-size:13px}
.card{background:var(--card);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-family:Georgia,serif;font-size:19px}
.card h3 a{text-decoration:none}
.card .intro{color:var(--muted);font-size:14px;margin:0 0 10px}
.row{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.row .body{flex:1;min-width:0}
.row a.go{text-decoration:none;display:block}
.row a.go:hover .hl{text-decoration:underline}
.star{flex:none;text-decoration:none;color:var(--muted);font-size:17px;line-height:1.2;padding:2px 2px 0}
.star.on{color:var(--star)}
.star:hover{color:var(--star)}
.meta{font-size:12px;color:var(--muted)}
.theme{font-weight:600;color:var(--accent)}
.hl{font-weight:600}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kw .chip{font-size:11px;padding:2px 8px}
.chip.thread{background:none;border:1px solid var(--line);color:var(--accent)}
.snip{font-size:13px;color:var(--muted);margin-top:3px}
.note{font-size:13px;margin-top:4px;padding:6px 10px;border-left:3px solid var(--star);background:var(--chip);border-radius:4px}
.paper{font-size:13px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line)}
.card details{margin-top:8px}
details.card{margin:0 0 8px;padding:12px 18px}
details.card>summary{padding:2px 0}
details.card[open]>summary{margin-bottom:6px}
.empty{color:var(--muted);padding:24px 0;line-height:1.6}
.help{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.55}
mark{background:#f2dc8a;color:#1d1d1b;border-radius:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.public{background:#dcefe6;color:#1f5f4c}.badge.university{background:#dfe7f6;color:#28497f}
.badge.commercial{background:#f6e3d6;color:#8a4a1c}.badge.request{background:#efe3f3;color:#6a3a7a}
:root[data-theme="dark"] .badge{filter:brightness(.85) saturate(1.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{filter:brightness(.85) saturate(1.2)}}
.ds{border-top:1px solid var(--line);padding:8px 0}
.ds>summary{font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;padding:2px 0}
.ds .alt{font-size:12px;color:var(--muted);margin:2px 0 4px 17px}
.ds.unused>summary{color:var(--muted);font-weight:400}
.cal{background:var(--card);border-radius:10px;padding:12px 12px 10px;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head button{background:none;border:0;color:var(--ink);font:600 14px/1 inherit;cursor:pointer;padding:6px 8px;border-radius:6px}
.cal-head button:hover{background:var(--chip)}
.cal-head .mon.on{background:var(--chip-on);color:var(--chip-on-ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--muted);padding:2px 0 4px}
.cal-grid .d{font:13px/1 inherit;padding:7px 0;border-radius:6px;color:var(--muted);opacity:.45;border:0;background:none}
.cal-grid button.d{opacity:1;color:var(--ink);font-weight:600;cursor:pointer;position:relative}
.cal-grid button.d::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal-grid button.d:hover{background:var(--chip)}
.cal-grid button.d.on{background:var(--chip-on);color:var(--chip-on-ink)}
.cal-grid button.d.on::after{background:var(--chip-on-ink)}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.cal-foot button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 20px;font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;min-width:34px}
.pager button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.pager button:disabled{opacity:.4;cursor:default}
.pager select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}

<script id="data" type="application/json">{"issues": [{"date": "2026-10-20", "intro": "Today's issue spans two live supply shocks (China's yttrium squeeze on Japan and a UK AI data center lost to grid delays), a capacity glut in non-Chinese battery recycling, and two EU rules that turn disclosure and traceability into operating constraints: ESMA's first CSRD-era enforcement priorities and the EUDR's projected impact on Ethiopian coffee smallholders.", "items": [{"n": 1, "id": "2026-10-20#1", "headline": "Japan could run short of yttrium by end-2026 as China's export curbs persist", "theme": "Critical Minerals & Batteries", "source": "Financial Times", "summary": "Secondary outlets reporting a Financial Times story (around 19–20 Oct 2026; the FT original was not seen) say Japanese officials and trading-house executives warn that yttrium shortages could begin as early as end-2026 unless Beijing eases controls or substitutes or extra stockpiles are found. Yttrium oxide outside China has reportedly risen 179-fold in two years, to about $1,150/kg versus about $9/kg inside China. According to unnamed sources, Tokyo has asked the US government and large US firms to lobby Beijing.", "rq": "Stockpile pooling and allocation under a known-finite horizon: the case resembles a rationing game more than a classic random-yield disruption. · Compare the 2010 China–Japan rare-earth episode with this one to see whether a decade of 'diversification' rhetoric actually changed exposure. · Treat the China/ex-China price wedge as a measure of market segmentation under export controls.", "problem": "Japanese manufacturers face running down finite stocks of an input with few short-run substitutes, while a single dominant supplier rations volumes for political reasons. A US official reportedly said China lets Japan buy only 'the bare minimum it needs'. Firms must decide how to allocate scarce stock across product lines, whether to pay extreme ex-China prices, and whether to invest in substitution or non-Chinese supply that may not pay off if controls are lifted. Stockpile size and the exact run-out date are unknown.", "related": ["Building Supply Chain Resilience through Virtual Stockpile Pooling", "The Implications of Firm‐Specific Policy Risk, Policy Uncertainty, and Industry Factors for Inventory: A Resource Dependence Perspective"], "keywords": ["raw material security", "supplier concentration", "sourcing restrictions", "supplier diversification", "export controls"], "datasets": ["un_comtrade", "usgs_minerals"], "thread": null}, {"n": 2, "id": "2026-10-20#2", "headline": "Battery recyclers outside China face idle capacity as EV adoption slows and scrap flows to China", "theme": "Circular Economy", "source": "Nikkei Asia", "summary": "Nikkei Asia (19 Oct 2026, Tokyo) reports that global EV battery recycling capacity far exceeds the volume of discarded material. The causes it gives are a slower-than-expected EV transition and a supply chain concentrating in China. Japan's JX Advanced Metals, whose plants can recover lithium, nickel and cobalt from used EV batteries, is named. Only the article's opening was verified; it should also be checked for sponsored-content status.", "rq": "Capacity investment under lagged, uncertain returns flows: what EV sales scenarios were these plants sized for? · Ask whether scrap export restrictions or recycled-content mandates could anchor feedstock locally, and compare with how waste-export bans have worked in other materials. · Collection and competition models from the remanufacturing literature, where the recycler competes with a third party for cores, map well onto this scrap market.", "problem": "Recycling plants are capital-intensive and need high utilisation, but their feedstock depends on past EV sales and on who wins the scrap competition. With slower adoption and Chinese processors outbidding them, non-Chinese recyclers face stranded capacity. That undermines the case for regional closed-loop supply as a mineral-security strategy.", "related": ["Accelerating vehicle fleet turnover to achieve sustainable mobility goals"], "keywords": ["battery recycling", "closed-loop supply chain", "capacity investment under uncertainty", "secondary materials"], "datasets": ["battery_supply", "un_comtrade"], "thread": null}, {"n": 3, "id": "2026-10-20#3", "headline": "Microsoft exits Nscale's Loughton AI data center after grid connection pushed to the 2030s", "theme": "Energy & AI Data Centers", "source": "Blockspace Media", "summary": "Microsoft has ended its anchor-tenant agreement for Nscale's planned AI data centre in Loughton, Essex, reported around 18–19 Oct 2026 and confirmed by Nscale. UK Power Networks reportedly told Nscale the site would not get enough power until the early-to-mid 2030s, against a planned ready date of late 2026 or early 2027. The site was planned at 50 MW, expandable to 90 MW, with 23,040 Nvidia GB300 GPUs for Azure; investment was reported as about $3bn or £2bn depending on the source.", "rq": "Real options view of hyperscaler leasing: anchor contracts as options exercised or abandoned based on power-date signals. · Compare UK distribution-level connection timelines with US large-load queues (e.g., ERCOT, PJM) to see where power constraints bind on siting. · Puzzle: why sign a flagship tenant before a firm connection date? Look at contract structure and risk allocation between developer and tenant.", "problem": "The binding constraint was the grid connection date, not land, chips or capital. A tenant with time-sensitive compute demand will not wait several years for power. Nscale now holds a site without a tenant or adequate power and is exploring alternative power sources and other UK sites. Termination penalties have not been disclosed.", "related": [], "keywords": ["data center electricity demand", "interconnection queues", "facility siting", "capacity investment under uncertainty"], "datasets": ["lbnl_queues", "ercot_reports"], "thread": null}, {"n": 4, "id": "2026-10-20#4", "headline": "ESMA's 2026 enforcement priorities target CSRD materiality and links between impacts, risks and targets", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "On 13 Oct 2026, ESMA published its 2026 European Common Enforcement Priorities for listed issuers' 2026 annual reports. For ESRS sustainability statements, it prioritises how firms apply the materiality assessment and how they link impacts, risks and opportunities (IROs) to policies, actions and targets (PATs) and metrics. Enforcers will focus on ESRS E1 (Climate Change) and S1 (Own Workforce).", "rq": "Enforcement priorities as a staggered treatment: compare E1/S1 disclosure quality with other ESRS topics before and after. · Text-analysis angle: do 'science-based' or '1.5°C' labels without methodology predict weaker actual target progress? · Ask whether demands for upstream IRO coverage change buyer–supplier data flows, for example through CDP supply chain requests.", "problem": "Early ESRS reports show selective disclosure. Some issuers detail positive impacts more than negative ones, call targets 'science-based' or '1.5 degrees' without explanation, and report emission intensity without absolute values. ESMA wants IROs to cover upstream and downstream value chains, wants firms to say when no PATs exist for a material IRO, and wants targets to be measurable, time-bound and outcome-oriented, with status reported as met, missed or dropped. The tension is between pushing enforcement rigour and the EU's simplification agenda.", "related": ["Toward “Omniscient” supply chains: Enabling and incentivizing sustainable operations", "Administrative environmental innovations, supply network structure, and environmental disclosure"], "keywords": ["mandatory climate reporting", "scope 3 disclosure", "materiality assessment", "regulatory enforcement"], "datasets": ["sbti", "cdp"], "thread": null}, {"n": 5, "id": "2026-10-20#5", "headline": "ODI study: EUDR traceability rules could exclude up to 60% of Ethiopian coffee smallholders from the EU", "theme": "Food & Agriculture", "source": "Birr Metrics", "summary": "An ODI Global study published 16 Oct 2026 estimates that up to 60% of Ethiopian coffee smallholders could be shut out of the EU market under the EU Deforestation Regulation (EUDR). It also finds that traceability gaps affect up to 57% of coffee supply chains. In adverse scenarios GDP could fall by up to 0.5%; both figures are modelled estimates, not observed outcomes, and were reported via Birr Metrics rather than the report itself.", "rq": "Fixed compliance cost vs plot size: a supplier-selection model in which traceability costs create a minimum efficient supplier scale. · Natural experiment: compare EU vs non-EU coffee import shifts by origin before and after 30 Dec 2026. · Contrast commodity-exchange pooling with direct-trade or cooperative channels as traceability architectures.", "problem": "A traceability mandate aimed at deforestation may exclude the smallest, least-documented farmers even where deforestation risk is low. EU buyers may respond by sourcing from traceable large farms or other origins rather than investing in smallholder mapping.", "related": ["“I Am Because We Are”: The Role of Sub‐Saharan Africa's Collectivist Culture in Achieving Traceability and Global Supply Chain Resilience", "Sustainability in multi‐tier supply chains: Understanding the double agency role of the first‐tier supplier"], "keywords": ["deforestation", "multi-tier traceability", "sourcing restrictions", "smallholder inclusion"], "datasets": ["un_comtrade"], "thread": null}], "papers": [], "also": [{"title": "AEP signs 960-MW Indiana nuclear pact with Amazon, X-energy", "url": "https://www.utilitydive.com/news/aep-signs-advanced-960-mw-nuclear-amazon-x-energy/833341/", "source": "Utility Dive"}, {"title": "Port of Savannah to build 3.5M TEU container terminal", "url": "https://www.supplychaindive.com/news/port-of-savannah-to-build-35m-teu-container-terminal/833246/", "source": "Supply Chain Dive"}, {"title": "New emissions rules force Aarhus to rethink port discounts", "url": "https://news.google.com/rss/articles/CBMiiAFBVV95cUxORktzaUI3NXJfblpwM1pyRE5JMTFiNkFQQWVCMEdWeUlxb3YtTzlFSEpTaUtBX1J0UXFySXFoR3NfTWdtRXFEcEVvYURLTkFvZHRYcmgzOEY0R0dtcjc4dU5yYkw3VGRrUUpDSzA4MzFCWmhySFhFXzR6bEhjQXFWX2dKY0dpcW9P?oc=5", "source": "Splash247"}, {"title": "Rising Global Temperatures Increase Data Center Water Vulnerability to One-Third", "url": "https://news.google.com/rss/articles/CBMiYEFVX3lxTE5PZ05ERjA5RzlHZnk2YTYyX3FlVlAzLXJ4YTdSYUxuVmVwTGhROC1hTlA4OG14ZUNJeVFKd0xPd0pMV1hqeU9TazBVUG5xWVFTZTVNZnctemF2U2FTRzlpWg?oc=5", "source": "AZoCleantech"}, {"title": "Few major apparel brands pay garment workers a living wage: report", "url": "https://www.supplychaindive.com/news/few-major-apparel-brands-pay-garment-workers-a-living-wage-report/833275/", "source": "Supply Chain Dive"}]}, {"date": "2026-10-19", "intro": "Today's issue covers a capex-based forecast that hyperscaler emissions will rise 57% in 2026, a case for recovering landfilled aluminum instead of building power-hungry smelters, a reported (and possibly stale) US critical-minerals price floor, and Microsoft's 20-year, 1.1 GW power deal in Indiana. A fifth story, on Indian exporters possibly having to track Scope 3 emissions, is held back because the article could not be verified.", "items": [{"n": 1, "id": "2026-10-19#1", "headline": "Startup forecasts 57% jump in 2026 emissions for five hyperscalers, using capex to predict emissions before disclosure", "theme": "Energy & AI Data Centers", "source": "Trellis", "summary": "Bricola Group, a startup founded by former Amazon economist Jimmy Gillan, forecasts that combined emissions of Alphabet, AWS, Meta, Microsoft and Oracle will rise 57% in 2026 to 215 million tCO2e gross. Net of renewable energy certificates and similar purchases, the forecast is 140 million tCO2e, up from 87 million in 2025; AWS and Alphabet are each expected at just over 53 million tCO2e. The model maps past capex to past emissions. Capex is reported in 10-Ks 5–9 months before sustainability reports, and the five firms' combined 2025–2026 capex is expected to exceed $1 trillion. These are first-use model estimates with no outside validation, and Alphabet, AWS and Meta rely on capex guidance rather than reported figures.", "rq": "How well does capital expenditure predict a firm's later-reported Scope 1, 2 and 3 emissions, and does the predictive gap widen during capacity build-outs such as AI data centers?", "problem": "Capex-to-emissions mapping is a forward-looking emissions estimator, and it can be tested against what firms later report. The forecast also measures how far AI capacity growth outruns corporate decarbonization, including the gap between gross and certificate-adjusted (market-based) accounting.", "related": ["How Sustainable Is Big Data?", "Online Rack Placement in Large-Scale Data Centers: Online Sampling Optimization and Deployment"], "keywords": ["data center electricity demand", "emissions forecasting", "capital expenditure", "market-based emissions accounting"], "datasets": ["compustat", "cdp"], "thread": null}, {"n": 2, "id": "2026-10-19#2", "headline": "Experts argue better sorting and updated bottle bills could ease US aluminum shortage more cheaply than new smelters", "theme": "Circular Economy", "source": "Canary Media", "summary": "Amid a global aluminum shortage and US tariffs, Canary Media reports that millions of tons of US aluminum scrap still end up in landfills. Recycled aluminum needs only 5% of the energy of primary metal, while new or restarted smelters must compete with data centers for cheap power. SAFE's report says the US imports 84% of its primary aluminum, runs only five smelters in 2026, and faces primary demand rising from 4.4 to 5.1 million tons by 2029. Proposed fixes include Sortera's alloy-sorting plants (a $45M raise for a second site in Tennessee) and updating the 10 state bottle bills; Massachusetts' 5-cent deposit is 43 years old.", "rq": "Do states with bottle-deposit laws, and higher deposit values, achieve higher aluminum recovery and lower landfill disposal, and does that translate into more domestic secondary aluminum supply?", "problem": "This is a concrete primary-versus-secondary sourcing trade-off in which energy prices, tariffs and collection policy all set the economics of closed-loop supply. Sorting quality decides whether scrap becomes high-value alloy or is downcycled into low-value products.", "related": ["Managerial Efficiency and Reverse‐Flow Complexity in a Circular Economy"], "keywords": ["secondary materials", "closed-loop supply chain", "state environmental policy", "deposit return systems", "raw material security"], "datasets": ["epa_msw", "census_trade"], "thread": null}, {"n": 3, "id": "2026-10-19#3", "headline": "US reportedly weighing critical-minerals price floor with allies; reports conflict on whether it will proceed", "theme": "Critical Minerals & Batteries", "source": "Stocktwits", "summary": "Citing Bloomberg, Stocktwits reported a multi-agency US plan for a critical-minerals price floor, to be rolled out through the Pax Silica program after a 55-country summit, with reported agreements with the EU, Japan and Mexico. MP, USAR, UAMY and TMC each rose more than 2% pre-market. On January 28, Reuters had reported the administration was stepping back from price floors because Congress had not funded them, and those stocks fell 5–10% after hours. MP Materials said its own $110/kg floor contract for light rare earths remains in force. The article is stamped March 5, 2026, so it is roughly seven months old, and the policy's current status is unverified.", "rq": "How do announcements and reversals of price-floor support change rare-earth producers' valuations and their announced capacity investments, compared with downstream buyers'?", "problem": "A guaranteed minimum price is a market-design intervention that shifts demand risk from producers to the government, which should change capacity investment and buyers' sourcing decisions. The back-and-forth news flow gives clean event dates for testing that.", "related": [], "keywords": ["industrial policy", "raw material security", "capacity investment under uncertainty", "price floors", "regulatory uncertainty"], "datasets": ["crsp", "sec_edgar"], "thread": null}, {"n": 4, "id": "2026-10-19#4", "headline": "Microsoft signs 20-year, 1.1 GW deal with NiSource for Indiana data center, paying for all new infrastructure", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "Microsoft agreed to a 20-year contract with NiSource for about 1,100 MW of generation for a northwest Indiana data center campus, starting in 2028. DCD thinks the site is likely La Porte, but this is unconfirmed. Power flows through NiSource's GenCo subsidiary under a new rate structure for very large customers. Microsoft pays for all required generation and transmission, and GenCo has contracted 600 MW of battery storage. NiSource raised its estimate of savings for existing customers from its data center contracts to about $1.75B, up from $1.4B, or up to $140 per customer per year.", "rq": "Do dedicated large-load tariffs and generation-subsidiary structures like NiSource's GenCo shield residential rates from data center load growth, compared with utilities that serve data centers under standard tariffs?", "problem": "Under this 'pay your own way' structure, a dedicated generation subsidiary and the large customer carry the build-out risk. That is a contract design for allocating capacity risk between hyperscalers and regulated ratepayers, and it is likely to spread to other utilities.", "related": ["Meeting Corporate Renewable Power Targets", "The Value of Coordination in Multimarket Bidding of Grid Energy Storage"], "keywords": ["data center electricity demand", "long-term supply contracts", "battery storage", "large-load tariffs", "facility siting"], "datasets": ["state_puc", "eia861"], "thread": null}], "papers": [], "also": [{"title": "PJM Issues Electric Power Capacity Advisory For Oct. 19 As A Result Of About 72,000 MW Of Planned Generation Outages; About 60% Of Generating Capacity Is Available To Meet Demand - PA Environment Dige", "url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxNbDZxWXozYU1tejIxY3B3bFBxUHowQ3BjSzdhZkdkeUhtUkFjUmk1b1ZOTVllMXIxTUpBZUVUbFNiaHFlSnliUW1JeDcxY0VqdFdfV0dELVNHY3BvVElETjlrOXdRbzBmZFBDSVY3dWZneExJREN6c3YzZU5LZ09YMnhNZHcwb1RISGZ3dHFtZw?oc=5", "source": "PA Environment Digest Blog"}, {"title": "Shippers To Lose N1.3trn On Agric Commodities To EU Regulations", "url": "https://news.google.com/rss/articles/CBMilgFBVV95cUxOWHR1ZUdhcDh3QXZ0NWQxU3UwQVBtRVJ2RHZ1OWQxSzNNUU5NZGNvR2UxQWMtSkJ0Z1VOaE81QkhpZm1ZVWo1NWU3Z2U2UVMwdENPYjBzRFowTnI5S1FReDc5YUloX0VySDlHVTBsaUZfOE1QSHp5ekdWbFhuT2FSMUU4ZGpzTmpjY1hsSTBfcG0wSTNRSUE?oc=5", "source": "New Telegraph"}, {"title": "Corporate demand could support up to 1.9 million tonnes of SAF by 2030, study finds", "url": "https://news.google.com/rss/articles/CBMiugFBVV95cUxQNE9fUllqV2c3U2dyV0VpUGFUdUZldDh4dUpGYmZqOGNQU0s3dXhwaHFzY3V1Nm02WWN4Y3h2cnVyX05YQ2xTUTZGR1lsQ1FicnFhcUZWWk9kM2ZFUG1iRmdjUUFld3I3UFl4SkVBRGNQTHZROUVpMm83WVU2U2FlanF1U3hNSlE3b1B6eXBkaGVqal9VbTdjZ2dMT2kzMm1lT1Etak5zby1sT3B6YVVEN2U2ejRFV0dYeFE?oc=5", "source": "TTGmice"}, {"title": "NOAA certifies American Metal's bid to mine the Pacific seafloor for critical minerals", "url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxOZWEyYk1ERGdZUXFJVUVVVzhPaDU3Ml9VXzNKYUY5ck93eFQ2VUVNcTVYUkEtcUdOTmFSZ2dhaVVQaUhNQ0tBc2lld2lLZlc2T3hFdUd3NXF0dy0tZzJXMkZMV0hiRDJhMmd0a3dVTTMtQWRjRm9qdmp6OGZwOXNYZ3lVUFhnTWs0NWtoTUZhQlJxWUdPWk5ONUNoUzZUY3M1REZSaTdBNnd4dDNpNU12MGJVZw?oc=5", "source": "Startup Fortune"}, {"title": "DIC and Toyo Ink Standardize Flexible Packaging Recycling Evaluation Across the Industry: Common Protocol Established for Deinking and Delamination Assessment", "url": "https://news.google.com/rss/articles/CBMilAJBVV95cUxOcEFiZkhsenRZVWd5ZHlYUGhBcTBYSVV3bkQzd242Zk5PQ0hEdHBJaWs1ZVNfQV82ZkdmdEt4LVZUR3pYTGtmeFNwN2NhYjhHSGU3d0RiUUFZbGtQRXh4T0FhMVJiVG41ZFVnMmdVbFZFVEVvSXVSVHFPMC1MUEduUEtSa3o2d1k2NzVVaXFrVFczdl9yZkh3Mmp4U2dFaDczMURkT21yY2Z3d21IYS01X2gyQ2hBalZVRmY0azVsM3BJSkJiRl9EYnU3ZlhIN20xem83ZC1hNkhzbGl5Z05kQWd6d2pvdzhaRHpwMVNFbHVjU0JMSG1UaFRIenRwcnBzQlVqS3J2ZnVmckJoanJMbUZsMjA?oc=5", "source": "Circular Economy Hub"}]}, {"date": "2026-10-18", "intro": "Today's issue: Pennsylvania moves to curtail data centers first in grid emergencies, a lobbying record behind the EU deforestation law's dilution, and Infineon's multi-sourcing of silicon carbide wafers. Also: India's draft steel policy with a circular-economy angle, and a Pentagon equity-style investment in US tungsten.", "items": [{"n": 1, "id": "2026-10-18#1", "headline": "Pennsylvania PUC proposes curtailing new data centers before other customers during grid emergencies", "theme": "Energy & AI Data Centers", "source": "NorthcentralPA.com", "summary": "On Oct. 1, 2026 the Pennsylvania PUC voted 4-0 for a Tentative Order. Under it, utilities would curtail eligible new large loads, such as data centers that haven't secured enough new capacity, before other customers during PJM 'Interim Resource Adequacy Service' events, and could not classify data centers as exempt 'critical load.' Utilities would also have to keep large-load registries and set notification procedures. A PUC-commissioned study found PJM failing its reliability planning standard from 2027 to 2030, with modeled risk nearly six times the standard by 2030. Comments are due within 30 days plus 15 for replies, and CBS reports a final order is expected at the end of January.", "rq": "Does a state rule placing un-backed large loads first in the curtailment queue shift data-center siting, or the speed of bring-your-own-capacity deals, away from Pennsylvania toward other PJM states?", "problem": "This turns large-load interruptibility into a regulated priority rule, which changes the expected cost of siting a data center in one PJM state versus its neighbors. It is a clean setting for studying curtailment priority, capacity procurement and facility location together.", "related": ["A Deep Demand Response Program for Local Electricity Systems", "Electricity Time‐of‐Use Tariff with Stochastic Demand"], "keywords": ["interruptible load", "data center electricity demand", "grid reliability standards", "facility siting", "federal-state jurisdiction"], "datasets": ["state_puc", "pjm_data"], "thread": "2026-10-13#1"}, {"n": 2, "id": "2026-10-18#2", "headline": "Mighty Earth report: US firms held 350+ EU meetings to delay and weaken the Deforestation Regulation", "theme": "ESG & Disclosure", "source": "The Guardian", "summary": "The Guardian (Oct. 17, 2026) reported a Mighty Earth investigation finding that 24 US companies and trade groups held more than 350 meetings with EU officials between July 2024 and July 2026 over the EUDR: 173 with MEPs and 178 with senior Commission officials. These figures are relayed second-hand. Named players include Cargill, Bunge, Mondelēz, the US Soybean Export Council and AmCham EU. After a July 2025 Trump–von der Leyen meeting, a joint statement promised the US special treatment, and the Commission called the US 'negligible risk.' The firms deny coordinating and cite implementation problems such as IT systems and unclear obligations.", "rq": "Do commodity firms with greater exposure to EUDR-covered sourcing lobby more intensively, and did 'negligible risk' country designations shift EU sourcing of soy and wood products toward low-risk-rated origins?", "problem": "Traceability and due-diligence costs in commodity supply chains depend on how the rules end up written. Lobbying intensity and country-risk designations are measurable inputs that shape those rules.", "related": ["A theoretical model on how firms can leverage political resources to align with supply chain strategy for competitive advantage", "The NGO's Dilemma: How to Influence Firms to Replace a Potentially Hazardous Substance"], "keywords": ["deforestation", "multi-tier traceability", "regulatory uncertainty", "corporate lobbying"], "datasets": ["un_comtrade"], "thread": null}, {"n": 3, "id": "2026-10-18#3", "headline": "Infineon adds Wolfspeed 200mm silicon carbide wafers in multi-year supply deal", "theme": "Supply Chain Resilience", "source": "ELE Times", "summary": "On Oct. 15, 2026 Infineon and Wolfspeed announced a multi-year agreement for Wolfspeed to supply 200mm SiC wafers. Wolfspeed calls it an expansion and extension of their existing 150mm deal, a relationship of more than 20 years, while Infineon frames it as supporting its move from 150mm to 200mm. Infineon cites its multi-supplier strategy and rising SiC demand from EVs, renewables and AI data center power systems. Value, volumes and duration were not disclosed.", "rq": "When a critical input undergoes a technology node transition (150mm to 200mm SiC), do buyers lengthen contracts and add suppliers, and how does supplier financial distress affect those choices?", "problem": "This is a long-term contract signed during a technology transition, with the buyer deliberately multi-sourcing a concentrated input. It is useful for studying how wafer-size transitions interact with supplier diversification and the risk of a supplier failing.", "related": ["Procurement Strategies with Unreliable Suppliers Under Correlated Random Yields", "Wholesale Price Contracts for Reliable Supply"], "keywords": ["supplier diversification", "supplier concentration", "long-term supply contracts", "silicon carbide"], "datasets": ["sec_edgar", "compustat_segments"], "thread": null}, {"n": 4, "id": "2026-10-18#4", "headline": "India's draft National Steel Policy 2047 targets 604 MT and emphasizes circularity and secondary producers", "theme": "Circular Economy", "source": "ET Manufacturing", "summary": "PTI reported on Oct. 17 that industry welcomed India's draft National Steel Policy 2047, released for comment. Its 2047 targets are 604 MT of crude steel (sources disagree on whether this is capacity or production), 505 MT of finished-steel demand, 302 kg per capita consumption and 45 MT of exports. The draft stresses value addition, raw-material security, decarbonisation, coated and specialty steel, and support for secondary producers. RHI Magnesita India highlighted the draft's recognition of refractory recovery.", "rq": "How do policy commitments to secondary steel producers and material recovery change the mix of primary and secondary steelmaking capacity, and India's import dependence for scrap and raw materials?", "problem": "This is a large policy shift in the world's fastest-growing major steel market, linking circularity (secondary steel, refractory recovery) with raw-material security and decarbonisation. It is relevant to recycling capacity and secondary-material sourcing.", "related": [], "keywords": ["steel decarbonization", "secondary materials", "raw material security", "industrial policy"], "datasets": ["un_comtrade"], "thread": null}, {"n": 5, "id": "2026-10-18#5", "headline": "Pentagon commits $450M to tungsten producer Elmet in exchange for preferred equity and warrants", "theme": "Critical Minerals & Batteries", "source": "Stocktwits", "summary": "On Sept. 14, 2026 Elmet Group announced a $450M committed investment from the US Department of War to expand tungsten mining, processing and manufacturing: $200M at closing, with further drawdowns. In return the government gets redeemable preferred equity, warrants for up to 19.9% of common stock, and a board seat plus an observer. The Department also took about a 10% stake through roughly $35.6M of transactions involving Trilogy Metals and South32's Alaska projects. This is a late-September wrap; ELMT rose over 33% that week, and the deal's closing and the subsequent Trump–Xi meeting outcome are unconfirmed here.", "rq": "How do markets and firms respond when the US government takes equity stakes in critical-mineral producers? Specifically, do recipients accelerate capacity investment, and do rivals' valuations move?", "problem": "Governments are moving from grants and loans to equity and governance rights in mineral suppliers. That raises questions about how state ownership changes capacity investment and sourcing for concentrated inputs like tungsten.", "related": ["Return to the United States: Impact of Reshoring Announcements and Reshoring Risks on Market Valuation"], "keywords": ["supplier concentration", "capacity investment under uncertainty", "government equity stakes", "tungsten"], "datasets": ["sec_edgar", "usgs_minerals"], "thread": null}], "papers": [{"title": "EXPRESS: Valuation Bottlenecks: Why Isn’t a Better Business Enough for a Higher Market Capitalization?", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261499473"}], "also": [{"title": "Doppa: 58,000 Sarawak oil palm smallholders risk losing market access under EUDR", "url": "https://news.google.com/rss/articles/CBMivAFBVV95cUxNcG0ybWhSZGZ3ZTNNQlNicXUyZXQ3ZDQzZElYSi1FVEl6RlBBdEJqaGJWUENtMXBxQUwzc3FnbThqSlg0NGpjLXdCVFdjQVhEOTlBbkkzQ2RyMTFmR0tLb29XbnFJajNOYnBNNkNZQVFpakR2SFRzc092Y1lfVGRSajhkckZDTU5DM0JtcjM5MkZlVTYtSm5vU0s4cWdKQjBlbVMwN3UzdU1nUUdvWnRDS1ROQXNMUlNBaEpydw?oc=5", "source": "Borneo Post"}, {"title": "More emissions 'deleters' pardoned by Trump", "url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxQbVpXb3hJeHhiU3Y3MWU1TjZOSDd2bEtrS1N4TzAxRUxLNF81MWhIYXVsbm5IcUJCbVJLQ1pjeVc5bk5lSWdMREg1UUNFOGJUdmwxNUhaNDZTWGU3RGFFUXdEakRWa19kNkJKdEtoUlpJaTI5NEkyclZwaXBDVkVkRTA3VE1QalV0cHJ1TXU4TjhWTE16OTNOMFp4QUJjYmxJRFhCZw?oc=5", "source": "Overdrive Magazine"}, {"title": "No signs of truckload capacity recovering", "url": "https://www.freightwaves.com/news/no-signs-of-truckload-capacity-recovering", "source": "FreightWaves"}, {"title": "Data center moratorium bills stack up ahead of Virginia legislative session in January", "url": "https://news.google.com/rss/articles/CBMi1AFBVV95cUxPU2h2UTFaY0dxNk9rTkY5aGlaWGVMLUpJZi1iZDMycVVUd2hUdmZ0UjJUMnpzczdCeWRaU25GM1ExRjFOWXFrQWtUMWhValMtSzV4WlBjTm55LWRraWw4X29zNnlMZXViWF9NX2hTN0hxNFRCbV9IMlNpMTNPdHc2azRkUEFZTmZmd28zS1owN2ZndWE4THVTRjA0bElKbkN3b0h1a2V5MURzaHBpVWtrMkxnT25taXBCZGxvSWxxdTlrNkhSaVpsN0RDNVhzUzFMX1REdA?oc=5", "source": "Fredericksburg Free Press"}, {"title": "K-battery Q3 also shows green light for earnings… U.S. ESS quarterly installations continue to hit record highs", "url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE1yYWNlRVZzS3ZQNkxPd3JzQXdYSHNOR1REczdTdDk1Q0JJY2U1bFpkalYwMVIyLUdyTE0yaWRTNjBIOUhlQjJXLVA2Q05QaU42Q2xCbG9OaXp2WmxrVWJBdFZZaWw2bWNoaGxRazZROFc?oc=5", "source": "머니투데이"}]}, {"date": "2026-10-17", "intro": "Today: PJM ran on two-thirds of its fleet during an October heat event as data-center load turns shoulder seasons into stress periods; the FMC targets Spanish-flagged ships; Haleon prices carbon into supplier bids; Patagonia merges resale into its main store; and Hormuz attacks sink a container feeder.", "items": [{"n": 1, "id": "2026-10-17#1", "headline": "PJM ran on 66% of its generation fleet during October Maximum Generation Alerts; about a quarter of outages were unplanned", "theme": "Energy & AI Data Centers", "source": "PA Environment Digest Blog", "summary": "During the week of Oct. 12, 2026, PJM had just over 61,000 MW of generation out (only 66% of fleet capacity available). More than two-thirds of outages were planned maintenance and about 15,000 MW were unplanned (preliminary), roughly a quarter rather than the one-third in some headlines. PJM recalled about 10,000 MW and called Demand Response on Oct. 13–14 for weather it called warm but 'not extreme.' DR has now been used on 15 days in 2025–2026 versus 8 in all of 2015–2024. PJM blames year-round data center load growing faster than supply and transmission, plus longer weather extremes that push into spring and fall maintenance seasons.", "rq": "How does growth in year-round large-load demand change the optimal timing of generator maintenance, and has it raised shoulder-season scarcity events and prices in PJM?", "problem": "Planned-maintenance scheduling is a classic OM problem, and data center load is flattening the seasonal demand trough it depends on. Outage coordination, recall decisions and DR use now trade reliability against winter readiness.", "related": ["Dynamic Pricing of Peak Production"], "keywords": ["data center electricity demand", "grid reliability standards", "maintenance scheduling", "demand response", "load forecasting"], "datasets": ["pjm_data", "eia930"], "thread": "2026-10-13#1"}, {"n": 2, "id": "2026-10-17#2", "headline": "FMC proposes $200,000 per-voyage fee on Spanish-flagged vessels and possible limits on Spanish imports", "theme": "Trade & Industrial Policy", "source": "Supply Chain Dive", "summary": "On Oct. 14 the Federal Maritime Commission proposed a $200,000 per-voyage fee on Spanish-flagged vessels and possible import restrictions on Spanish perfumery and cosmetics, oils and fats, ceramics, stone articles, and sugar and confectionery (docket FMC-2026-0463). The action follows a 2024 investigation finding Spain denied port access to U.S.-flagged ships, including two Maersk vessels carrying Maritime Security Program cargo; Spain cited EU regulations. Comments are due Dec. 14, Spain will be offered a hearing, and the docket expects restricted goods to be replaced mostly from other countries.", "rq": "Following the FMC announcement, how fast do U.S. importers of the targeted Spanish product categories shift to alternative origins, and does pre-buying occur before restrictions take effect?", "problem": "This is a narrow, product-specific trade shock with a clear announcement date. It allows study of importer sourcing substitution and of carrier flag or routing responses.", "related": ["Interplay between Competing and Coexisting Policy Regimens within Supply Chain Configurations"], "keywords": ["sourcing restrictions", "supplier diversification", "pre-buy behavior", "maritime policy"], "datasets": ["usitc_dataweb", "federal_register"], "thread": null}, {"n": 3, "id": "2026-10-17#3", "headline": "Haleon adds an EU ETS carbon price to supplier bids, shifting 1–2 of every 10 deals", "theme": "Sustainable Operations", "source": "Trellis", "summary": "Haleon asks most suppliers to estimate the carbon footprint of each purchase. It multiplies that figure by the EU ETS price (about €80/t CO2) and adds it to the bid, so the lowest combined total wins. The charge averages about 2% of bid value (about 10% for plastic bottles, about 1% for acetaminophen) and shifts 1–2 in 10 deals to pricier, lower-carbon bidders, per Haleon's Chris Low. Nearly a quarter of key suppliers now measure emissions directly, up from none in 2024. Haleon is piloting contracts with annual emission-reduction commitments and financial penalties, toward a 42% Scope 3 cut over 2022–2030; its latest report shows 13%.", "rq": "In a scoring auction that adds a carbon charge based on supplier-reported footprints, when does the buyer gain from rewarding primary measurement over industry-average estimates, and how much emission reduction does the charge buy per dollar of higher procurement cost?", "problem": "A shadow carbon price in scoring auctions is a concrete mechanism-design lever for Scope 3. It raises questions about supplier misreporting of footprints and the incentive to invest in measurement.", "related": ["Helping hampered bidders—Do subsidy auctions work as intended?", "Customer base environmental disclosure and supplier greenhouse gas emissions: A signaling theory perspective"], "keywords": ["supplier emissions", "scope 3 disclosure", "internal carbon pricing", "procurement auctions"], "datasets": ["cdp", "sbti"], "thread": null}, {"n": 4, "id": "2026-10-17#4", "headline": "Patagonia folds Worn Wear resale into its main store after selling ~160,000 used items ($13M) in fiscal 2026", "theme": "Circular Economy", "source": "Trellis", "summary": "Patagonia is closing the separate nine-year-old Worn Wear site and listing used items next to new ones on its main store, with a shared cart and the same warranty. It sold almost 160,000 verified secondhand items (about $13M) in fiscal 2026. More than 40 staff in Reno processed about 230,000 garments in 2025, and about 80% were resellable. The switch took a multiyear IT overhaul to handle unique SKUs, discontinued items and condition-based pricing that Trove previously managed.", "rq": "Does listing used items alongside new ones on a brand's main site cannibalize or complement new-product sales, and how should condition-based prices be set when returns supply is uncertain?", "problem": "Mixing one-of-a-kind used inventory with new stock raises cannibalization, uncertain-supply and condition-pricing questions that closed-loop supply chain models have mostly studied in separate channels.", "related": ["The Future of Retail Operations"], "keywords": ["closed-loop supply chain", "recommerce", "cannibalization", "condition-based pricing"], "datasets": [], "thread": null}, {"n": 5, "id": "2026-10-17#5", "headline": "Hormuz attacks hit a record six ships in one day; Singapore-flagged feeder GFS Pride sinks with containers aboard", "theme": "Supply Chain Resilience", "source": "FreightWaves", "summary": "At least 10 vessels were attacked in or near the Strait of Hormuz from Oct. 11, including six on that day alone, the most in a single day since the U.S.–Iran war began in February. UKMTO logged 12 attacks Oct. 5–11, a weekly record. The 2,824-TEU feeder GFS Pride was struck Oct. 13 and sank off Oman with all 21 crew safe; the cause is disputed between a mine and projectiles or a drone. GFS Giselle and DP World Kaveri were also hit, and Maersk, ONE, PIL and OOCL had schedules on some affected ships. Kpler counted 131 transits in the week to Oct. 14 versus 176 the week before, with crude flows down to about 12.6M b/d from about 15M at end-September.", "rq": "How do carriers adjust capacity sharing (slot charters on third-party feeders) and freight rates in response to escalating chokepoint attack intensity?", "problem": "Slot-sharing on feeder ships spreads risk to carriers whose names appear on bills of lading. War-risk insurance can be cancelled on short notice in these cases, a contractual fragility in shared transport capacity.", "related": [], "keywords": ["freight rates", "chokepoint disruption", "war-risk insurance", "slot sharing"], "datasets": ["gdelt", "ocean_schedules"], "thread": null}], "papers": [{"title": "Operations Management in the Sharing Economy: Advances, Challenges, and Opportunities", "journal": "M&SOM", "url": "https://doi.org/10.1287/msom.2025.0643"}, {"title": "The Buy-in Effect: When Increasing Initial Effort Encourages Follow-Through", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2023.03600"}], "also": [{"title": "PUC Invites Comments On Regulations To Give Electric Utilities New Tools To Manage Data Centers During Emergency Periods Of Strained Electricity Supplies And Curtailments To Maintain Grid Reliability ", "url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxQbnFRNjVKQ1JHQWxJYlRWdVU4eG5nZzI2SVk2am9SbmE2RlktaXlnbTFOdGpIZ01OM21nc3BOY0lvVFZCY3FKdFRvVjdDZjgtQnZfRVdSbkJ0SjkzVnhSZFNjSjB4SlRRaDh1T1NYSHZEdXBtQWJmY2xYQVh2ajFLWVo0aUhEeThlWGwwcHk4Rkt6TkVI?oc=5", "source": "PA Environment Digest Blog"}, {"title": "Korean battery makers shift to domestic LFP cathodes amid US IRA rules - CHOSUNBIZ", "url": "https://news.google.com/rss/articles/CBMiggFBVV95cUxON3doMVFSSElwNC1lc3d6TElTZmRmOEc2SVR2c3FFZXZQMXg1aHFGMU9uNWRleGJUcDllMmFuRmNFdHlRWFlnblhYMGx5R0xlemxlR3doN1dYSVUzRUNNZ21pdWJOSTRxREd1Qkh6cUhld2lNTFVOSW9TYU5JLVplYndB0gGWAUFVX3lxTE44VU5XYk5RR29Fd19qRFVmeER5ek1UUEFPRmFQZGxwYkYtXzNHOEY3Y2VKZkwzcFoySjA0SE8yblp5Sk5DenFuSHpDQUlSYVVLM0dWMWd2MGYtZjZLQlpfRDRabFBlUnFucDhyektvT2hKUzVnNHloaW8xOEtRakRpdWN3bnppR2w0TDNYYklrZ3lBNXNFQQ?oc=5", "source": "Chosunbiz"}, {"title": "El Niño Threatens Global Sugar Supply", "url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxQV1RWcnM4OTluS2ZWX09xNHpRNmgwSFRrTF92NDJMQVlGYWhDaTdDTjdyZkExSTFyYXhPclBHQmJja0NTS2Y1Z2pINENUQjMtX3J6RWszcHdWOHI3dFF4N0p4RE5rSndiLWRNajNDMS1XY2ZhWHlPOU15UFVEQ2VFRXhUWVlnRjhab3dRTzFRbzQ?oc=5", "source": "The New York Times"}, {"title": "Uncertain IMO Rules Weigh on Shipping’s Demand for Cleaner Marine Fuels", "url": "https://news.google.com/rss/articles/CBMif0FVX3lxTE1BWFFGdk1VdW03X0dxdk9RT0YxcGdOaTlUdGgyMzhEMkNWLVNJSlJvb0ZOd1pvMl9DVUdxSnk0Rlh4ejUyZlY0Wkd0WW8yM29pMlp6Vkxrbm5HMHJJekFudWVjYm1ZZkNCVENncUpBeFFtVXRYYzdRN1FJTjI2Q2c?oc=5", "source": "Marine Link"}, {"title": "Hawaiian reuse program to feature metal containers rather than plastic", "url": "https://www.packagingdive.com/news/perpetual-sourcing-reusable-foodservice-ware/832647/", "source": "Packaging Dive"}]}, {"date": "2026-10-16", "intro": "Today's issue covers a proposed size threshold for regulating AI data center grid connections, a new solar trade shock, a voluntary nature-disclosure sample, a closed-loop EV battery deal, and a traceability problem in the nickel behind EV batteries.", "items": [{"n": 1, "id": "2026-10-16#1", "headline": "NERC stakeholders approve reliability standards for data centers and crypto miners of 50 MW+ at 100 kV+", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "NERC stakeholders passed new standards for 'computational loads' (Project 2026-02; CLO-001-1 and CLO-002-1) in a final ballot announced Oct. 15, 2026. The standards next go to the NERC Board of Trustees and then to FERC. They appear to cover loads of 50 MW or more connected at 100 kV or higher and address interconnection modeling, operational data and communications, load protection coordination and disturbance monitoring. They follow a rare Level 3 alert NERC issued in May after data centers suddenly dropped load or swung demand; NERC forecasts 224 GW of summer peak growth over 10 years, 24% above 2025.", "rq": "After the standards were proposed, do new computational-load projects bunch just below 50 MW or connect below 100 kV, and does that bunching vary with how stringent the requirements are expected to be?", "problem": "A hard size-and-voltage threshold creates compliance costs that may change how large loads are sized, phased and sited, and that is a natural setting for bunching designs. The standards also turn data center load behavior into a regulated operational variable.", "related": ["Robust Generator Maintenance Schedule for Frequency-Secure Power Systems"], "keywords": ["data center electricity demand", "interconnection policy", "facility siting", "regulatory thresholds", "grid reliability standards"], "datasets": ["ercot_reports", "ferc_elibrary"], "thread": null}, {"n": 2, "id": "2026-10-16#2", "headline": "ITC finds solar cell imports from India, Indonesia and Laos injured US makers, clearing way for AD/CVD orders", "theme": "Trade & Industrial Policy", "source": "Utility Dive", "summary": "On Oct. 14, 2026, the ITC voted that crystalline silicon solar cell imports from India, Indonesia and Laos injured US producers. The decision follows Commerce's final determination last month. Petitioners, led by First Solar, Hanwha Qcells USA and Mission Solar, cite India dumping margins of 123% and countervailing duty rates of 126%, and they expect final orders around Nov. 2. They also say Ethiopia has become the third-largest US solar import source, up more than 3,000% in 12 months, and have asked Commerce to investigate possible tariff evasion. A Section 232 polysilicon tariff takes effect Dec. 4.", "rq": "How quickly and how completely do US solar cell imports shift to non-covered countries such as Ethiopia after successive AD/CVD actions, and does each new shift indicate transshipment, judged by the importer and supplier networks involved?", "problem": "This is another round in a sequence of country-specific solar duties, following the 2023 Southeast Asia case. Repeated rounds let researchers trace how sourcing moves from country to country ('whack-a-mole' sourcing) and whether domestic manufacturing capacity responds.", "related": ["Shock and Awe: A Theoretical Framework and Data Sources for Studying the Impact of 2025 Tariffs on Global Supply Chains", "Return to the United States: Impact of Reshoring Announcements and Reshoring Risks on Market Valuation"], "keywords": ["sourcing restrictions", "supplier diversification", "antidumping duties", "tariff circumvention"], "datasets": ["usitc_dataweb", "federal_register"], "thread": null}, {"n": 3, "id": "2026-10-16#3", "headline": "836 organizations in 57 countries now commit to TNFD nature reporting as ISSB and ISO standards approach", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "The TNFD reports that 836 organizations in 57 countries have committed to report under its recommendations, a 14% increase in under a year. They include financial institutions with more than $26 trillion in assets and listed firms worth over $10.5 trillion. More than 1,100 organizations make at least one TNFD-aligned disclosure, averaging 8 of the 14 recommended disclosures. The ISSB is about to issue a non-mandatory practice statement on nature-related disclosure, and ISO has approved turning the TNFD's LEAP approach into an ISO standard.", "rq": "Are firms with more upstream exposure to nature-intensive sectors more likely to adopt TNFD early, and does adoption change their supplier mix or sourcing disclosures afterward?", "problem": "The adopter list gives a ready-made sample for studying which firms choose to disclose nature-related risks. Because nature dependencies sit largely upstream, adoption may track supply chain exposure in sectors such as agriculture and mining.", "related": ["Supply Chain Carbon Footprinting and Climate Change Disclosures of Global Firms", "When does it pay to be green? The strategic benefits of adoption speed"], "keywords": ["nature-related disclosure", "voluntary disclosure", "biodiversity risk", "scope 3 disclosure"], "datasets": ["cdp", "compustat"], "thread": null}, {"n": 4, "id": "2026-10-16#4", "headline": "Rivian widens Redwood deal: manufacturing scrap recycling plus second-life packs powering its Illinois plant", "theme": "Circular Economy", "source": "Electric Cars Report", "summary": "On Oct. 14, 2026, Rivian and Redwood Materials announced that Redwood will also recycle battery scrap from Rivian's manufacturing. Redwood will keep collecting used Rivian packs through Rivian's nationwide service centers; each pack is checked and either reused for stationary storage or recycled. Redwood also provides storage at Rivian's plant in Normal, Illinois, building on an April 2026 deal for a 10 MWh system made from more than 100 second-life packs to cut electricity costs and peak grid strain. Financial terms and volumes were not disclosed.", "rq": "For a manufacturer collecting used packs through its service network, what grading threshold and inventory policy should decide between second-life storage at its own sites and recycling, given its plant's peak electricity charges and recycled-material prices?", "problem": "This is a concrete case of a manufacturer combining take-back through its service network, a reuse-or-recycle grading decision, and reuse inside its own operations. Each step maps onto standard remanufacturing and closed-loop supply chain models.", "related": ["LOOKING FORWARD, PUSHING BACK AND PEERING SIDEWAYS: ANALYZING THE SUSTAINABILITY OF INDUSTRIAL SYMBIOSIS"], "keywords": ["battery storage", "second-life batteries", "closed-loop supply chain", "battery recycling"], "datasets": ["sec_edgar", "state_puc"], "thread": null}, {"n": 5, "id": "2026-10-16#5", "headline": "Guardian analysis links nickel in VW, Ford and Tesla batteries to deforestation on Indigenous land in Sulawesi", "theme": "Critical Minerals & Batteries", "source": "The Guardian", "summary": "A Guardian analysis published Oct. 16, 2026, using company filings, two years of trade data and satellite imagery, links mines in the battery supply chains of Volkswagen, Ford and Tesla to tree loss on Tolaki Indigenous land in Sulawesi, Indonesia. Sulawesi holds the world's largest nickel deposits. According to a secondary summary, ore from the Cahaya and Hengjaya mines moves through local smelters to Zhejiang Huayou Cobalt plants in China, and Huayou supplies cathode materials to CATL. The batteries only 'may contain' this nickel, because public documents cannot tie specific shipments to specific cars.", "rq": "When investigations publicly link automakers to upstream environmental harm through multi-tier mineral chains, do the automakers or their cathode and cell suppliers change sourcing or traceability disclosures, and are the market effects concentrated on the brand or spread to the intermediate tiers?", "problem": "The investigation shows that public data can reconstruct a supply path several tiers deep but cannot confirm that a specific shipment reached a specific car. That gap between plausible links and proven links is the core problem for supplier due diligence rules.", "related": ["Chain liability in multitier supply chains? Responsibility attributions for unsustainable supplier behavior", "Cascading Sustainability in Multi‐tier Supply Chains: When Do Chinese Suppliers Adopt Sustainable Procurement?"], "keywords": ["supplier region risk", "multi-tier traceability", "nickel supply chain", "deforestation"], "datasets": ["un_comtrade", "reprisk"], "thread": null}], "papers": [{"title": "EXPRESS: Mind the Cost of Disturbance: Firm-Level Supply Chain Risk and the Bank Loan Cost", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261499809"}, {"title": "Shipment Monitoring, Allocation, and the Impact on Food Waste", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2024.07382"}], "also": [{"title": "California diesel prices remain above $8 per gallon as truckers call for relief", "url": "https://www.supplychaindive.com/news/california-diesel-prices-remain-above-8-per-gallon-as-truckers-call-for-re/833092/", "source": "Supply Chain Dive"}, {"title": "Texas county sues to close WM landfill over alleged RCRA violations", "url": "https://www.wastedive.com/news/texas-county-sues-to-close-wm-landfill-over-alleged-rcra-violations/833101/", "source": "Waste Dive"}, {"title": "AEP in deal to buy up to 1.6 GW of Mainspring linear generators", "url": "https://www.utilitydive.com/news/aep-mainspring-linear-generators-bloom-fuel-cell-google-wyoming/833104/", "source": "Utility Dive"}, {"title": "LCCI Warns EU Deforestation Rules Could Threaten Over Half Of Nigeria’s Cocoa Exports", "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxPU0JHR29fc215NTZ3SHduVXJId0wwTkFNVVhPYU1KVG12N01MWU9NVHVjamVfbnppVHo5WEdvaFd6XzlsaXE1QTNqbnBIZEZWcGh0WEdRb3BGdVpaY2JWcmRnSEQ3bVZuRG52NVJ5ZEl4dXFwRGJCNTcwY2pOVzZhVUx5VGdMeHNZY3B1dmFaMnhFZUU0amxGUGRDMjFiVHUtS1A0OG5lUkFDUQ?oc=5", "source": "Arise News"}, {"title": "Best Buy pilots battery-powered vehicles at California distribution sites", "url": "https://www.esgdive.com/news/best-buy-pilots-battery-powered-vehicles-at-california-distribution-sites/833103/", "source": "ESG Dive"}]}, {"date": "2026-10-15", "intro": "Today's issue covers two regulatory deadlines and three operational stress points. California has locked in the first mandatory US state climate-reporting deadline, and CBP has proposed a rule that would compress filing windows for low-value imports. PJM will study a 10-GW AI campus with its own gas fleet, Greece has drafted a renewable mandate for data centers, and California's packaging EPR plan has been revised with lower budgets.", "items": [{"n": 1, "id": "2026-10-15#1", "headline": "California finalizes SB 253 rules, setting November 10, 2026 as the first deadline for corporate GHG reports", "theme": "ESG & Disclosure", "source": "ESG Today", "summary": "California's Office of Administrative Law approved CARB's initial corporate GHG reporting regulation on Oct. 12, 2026, effective immediately, leaving companies about a month to file. Firms with more than $1B in revenue doing business in California must report Scope 1 and 2 emissions by Nov. 10, 2026, and Scope 3 begins in 2027. In year one, CARB will accept reports without third-party assurance and lets firms use emissions data they have already collected. CARB's preliminary list puts more than 4,000 companies likely in scope. Enforcement of SB 261, the climate-risk reporting law for firms above $500M in revenue, remains paused under a Ninth Circuit injunction.", "rq": "Did firms newly covered by SB 253 change how they measure and report Scope 1 and 2 emissions relative to similar uncovered firms? Did their suppliers start receiving, and answering, more emissions-data requests?", "problem": "This is a sharp, dated compliance shock with a published list of likely-covered firms, which makes it suitable for difference-in-differences designs. It also previews how Scope 3 requirements starting in 2027 will push emissions-data requests down supply chains.", "related": ["Are Firms Voluntarily Disclosing Emissions Greener?", "Engaging Supply Chains in Climate Change"], "keywords": ["mandatory climate reporting", "scope 3 disclosure", "supplier emissions", "state environmental policy"], "datasets": ["cdp", "sec_edgar"], "thread": null}, {"n": 2, "id": "2026-10-15#2", "headline": "PJM to study SoftBank's ~10-GW Ohio AI campus and its gas generation and 765-kV lines under the state agreement approach", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "PJM has filed a study agreement at FERC to evaluate SoftBank's 'Flagship' AI data center complex in Ohio, along with the generation and transmission needed to serve it, under its state agreement approach. An AEP Ohio data center tariff will serve an initial 800-MW phase. The PJM study covers another 9.6 GW of load plus 10.2 GW of new gas generation that SB Energy would build in phases through 2032. The February announcement had instead cited about $33B for 9.2 GW of gas. AEP Ohio plans three 765-kV lines, and most of the project would sit at DOE's former Portsmouth uranium enrichment site in Pike County.", "rq": "How does planning large data center loads together with dedicated generation under PJM's state agreement approach change interconnection timelines and transmission cost allocation, compared with the standard interconnection queue?", "problem": "The project bundles large-load interconnection, co-located generation and policy-driven transmission planning into a single case. It raises questions of capacity sequencing and of who bears the cost of grid expansion for one customer.", "related": [], "keywords": ["interconnection policy", "data center electricity demand", "interconnection queues", "federal-state jurisdiction", "capacity investment under uncertainty"], "datasets": ["ferc_elibrary", "state_puc"], "thread": null}, {"n": 3, "id": "2026-10-15#3", "headline": "Greek draft law would require 60% renewable power for data centers, a €200k/MW grid-queue guarantee and a public registry", "theme": "Energy & AI Data Centers", "source": "DatacenterDynamics", "summary": "Greece's energy ministry has drafted a law requiring data centers to source at least 60% of their electricity from renewables, met through direct connection to renewables or storage or through PPAs. Sources disagree on whether the rule covers only new sites. Developers would post a €200,000/MW bank guarantee to reserve grid capacity, could not split projects to get lighter rules, and could be offered flexible, capped connections where the grid is constrained. Grid operators would publish regional connection capacity every quarter, and the regulator RAAEY would create a data center registry. Public comment runs until Oct. 24, 2026.", "rq": "How does a per-MW collateral requirement combined with a 60% renewable sourcing mandate affect the volume of speculative data center connection requests and where data centers choose to locate?", "problem": "The bill combines a green procurement mandate with queue-screening collateral and capacity caps, which are policy levers OM models of siting and procurement can evaluate. If enacted, it would also generate new public data on capacity and registered facilities.", "related": ["Meeting Corporate Renewable Power Targets"], "keywords": ["collateral requirements", "capacity caps", "facility siting", "interconnection queues", "data center electricity demand"], "datasets": [], "thread": null}, {"n": 4, "id": "2026-10-15#4", "headline": "Circular Action Alliance cuts first-year California SB 54 EPR budget to about $1.1B in revised plan; CEO to depart", "theme": "Circular Economy", "source": "Waste Dive", "summary": "Circular Action Alliance submitted a revised 495-page SB 54 packaging EPR plan to CalRecycle on Oct. 13, 2026, after a public comment period that drew more than 2,400 comments. The 2027 budget falls from up to $1.87B to about $1.11B, and the five-year range falls from $9.35B–$17.2B to $7.81B–$13.1B. The 2027 budget includes a $500M mitigation fund and a MRF capital fund capped at $100M, and the plan concedes that even PET and HDPE bottles fall short of the first plastic recycling target. CalRecycle has 75 days to act, and founding CEO Jeff Fielkow will leave later this year, with Jeff Meyers as interim CEO.", "rq": "How do producer fees and MRF capital allocations in SB 54's program plan relate to material-level recycling gaps? Do these fee structures create incentives for packaging redesign?", "problem": "The plan offers a rare line-item view of a PRO's cost structure, its fee-setting logic and its investments in recycling infrastructure under the largest US packaging EPR program.", "related": ["Do E‐Waste Laws Create Behavioral Spillovers? Quasi‐Experimental Evidence from California"], "keywords": ["extended producer responsibility", "packaging regulation", "state environmental policy", "litigation risk"], "datasets": ["state_epr", "epa_msw"], "thread": null}, {"n": 5, "id": "2026-10-15#5", "headline": "CBP proposes requiring filing by arrival for imports of $2,500 or less, plus a new postal entry type with 15-day abandonment", "theme": "Trade & Industrial Policy", "source": "Supply Chain Dive", "summary": "CBP's proposed rule, published Oct. 8, 2026, would require electronic Type 11 informal entries to be filed on or before arrival, instead of within 15 days after. CBP's own sample of September–November 2025 entries found more than half would have missed that deadline. A new Entry Type 13 would cover mail shipments of $2,500 or less, with tracking numbers placed on manifests. Mail shipments not filed within 15 days would be deemed abandoned, compared with USPS's current 30-day hold. CBP says it cannot certify that the rule avoids significant impacts on small businesses, and comments are due Dec. 7, 2026.", "rq": "How would moving informal entries to filing-before-arrival change clearance times, abandonment rates and the split of low-value imports between postal and express channels?", "problem": "Tightening filing deadlines turns customs compliance into a binding operational constraint for cross-border e-commerce logistics and postal capacity.", "related": ["Estimating the Operational Impact of Container Inspections at International Ports", "Securing the Containerized Supply Chain: Analysis of Government Incentives for Private Investment"], "keywords": ["regulatory uncertainty", "de minimis", "customs compliance", "cross-border e-commerce"], "datasets": ["federal_register", "census_trade"], "thread": null}], "papers": [{"title": "Operations management for sustainable development and public policy making", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261499103"}], "also": [{"title": "LG Energy Solution Reshuffles Battery Equipment Supply Chain After Partner Default", "url": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxNOVJxaVlNbC1nMXB4QkVHRkFUcmd6WWtjd0ZSVm45R0NxdVFmZUpFb1gtei1lRTBsam83eVdsNkdzYkxEV1cxYWljYy15S2ZocVF5aW9YZ1EyLXg1UWFLTjdNa1Nia3VqMlhMZHB4NlpVTUthV1dkQjZpNFZnWWlKX3FfQVA1bXdoOG4zbUVzQVVsWjc4aWoxZ2p1a3dMQTVCbzJ4anVNZFRhSkVTbW1lYTJubGdnZUhP?oc=5", "source": "https://www.briefasia.com/"}, {"title": "Houthi attacks add new geopolitical risk to softening container rates", "url": "https://www.freightwaves.com/news/houthi-attacks-add-new-geopolitical-risk-to-softening-container-rates", "source": "FreightWaves"}, {"title": "Thai industries’ flood losses estimated at B6-7bn", "url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxNcHV6YlZBX2toRWlHVlRObTNPWkhuU3JwdVZwQ2xubFE1Z0QyUUI4M01RVTRLcUFENzg1NmVqSzJwNlRKRHJaNGd2d0ZCNDN5QjJrTWNLWmRoaVU3cTdqT3I0aXE3R25fQjJqVHpRUFhBelhhV1ozcFM4UkV0OHo2WTE4TjM0anV1T2V6eFVvOFdhU1FpTDZGYm9neW9oWU9QcXc?oc=5", "source": "Bangkok Post"}, {"title": "Only a handful of major apparel brands pay garment workers a living wage: report", "url": "https://www.esgdive.com/news/few-apparel-brands-pay-garment-workers-living-wage-report/833099/", "source": "ESG Dive"}, {"title": "All Eight Major Fertilizer Nutrients Cost More Than Last Harvest", "url": "https://news.google.com/rss/articles/CBMijwFBVV95cUxPNEcxZHJPZ3hnYjVXallGRmZUNVBXZWpocG9MVTZ3MDY4VUw4U0R6ZF9Lekl6MlhWNV9POW9aZlJmV2NMWFFIaTZxUkRPYzhTQVl6cklyRHVTRTZCZ3V4cGpsRGszUTd3UFJQc09TbnhOM1JFZTQ5YnF3NWU2VzlKek5ZN2pfa2xSV0NFQjhzYw?oc=5", "source": "RFD-TV"}]}, {"date": "2026-10-14", "intro": "Today's issue covers two hard policy shocks to energy infrastructure, Israel's proposed 200 MW cap on new data centers and a US order restricting Chinese grid equipment. It also covers a proposed rollback of Australia's Scope 3 reporting, a cyberattack that disrupted supermarket refrigeration across France, and a regulation-driven pre-buy surge in Mexican heavy-truck exports.", "items": [{"n": 1, "id": "2026-10-14#1", "headline": "Israel's Electricity Authority moves to cap new data centers at 200 MW as grid requests reach ~27 GW", "theme": "Energy & AI Data Centers", "source": "CTech", "summary": "Calcalist/CTech reports that Israel's Electricity Authority plans to limit any new data center to 200 MW, citing anonymous members of its governing board. A draft grid-connection decision was expected to go out for public comment. Grid operator Noga already holds connection requests from 50 facilities above 200 MW, including Mega DC (1,100 MW, Hadera) and SDS (875 MW, Nesher), which could not be approved as planned. This follows a 140-day freeze on applications of 8 MW or more, imposed after requests hit about 27,000 MW, close to three times average national load; data centers could use about 20% of Israel's electricity by 2030.", "rq": "How do per-site capacity caps change data-center project sizing, geographic dispersion and queue attrition compared with queue-based rationing such as moratoria or deposits, and what is the cost in lost scale economies?", "problem": "A hard per-site size cap is a rare, clean capacity constraint on AI infrastructure. It forces firms to trade economies of scale against grid-risk concentration and may push them to split projects across sites. The case speaks directly to facility sizing, siting and interconnection-queue design.", "related": ["How Sustainable Is Big Data?", "Meeting Corporate Renewable Power Targets"], "keywords": ["data center electricity demand", "interconnection policy", "interconnection queues", "capacity caps", "facility siting"], "datasets": ["lbnl_queues", "ercot_reports"], "thread": null}, {"n": 2, "id": "2026-10-14#2", "headline": "Australian opposition introduces bill to scrap mandatory Scope 3 reporting and drop smaller firms from climate disclosure", "theme": "ESG & Disclosure", "source": "AFR", "summary": "On 14 Oct 2026, the opposition Liberal–National Coalition announced the Treasury Laws Amendment (Scrapping Scope 3) Bill 2026. Senator Jane Hume will introduce it in the Senate. The bill would remove mandatory Scope 3 reporting, which is due to start for large firms next financial year, and exempt 'Group 3' entities with $50m–$200m revenue, who join from 1 July 2027. Treasury estimates Scope 3 modelling at about $245,000 per firm in year one and about $160,000 a year after that; the Coalition puts Group 3 first-year costs at up to $70,000.", "rq": "Does regulatory uncertainty over a pending Scope 3 mandate cause in-scope Australian firms to delay supplier engagement and Scope 3 data collection compared with firms facing a settled mandate?", "problem": "Scope 3 mandates push emissions-data requests upstream to suppliers. Whether the mandate survives, and the uncertainty in the meantime, shapes whether firms invest in supplier data collection. As an opposition private bill, its passage is uncertain, which makes it more of a regulatory-uncertainty shock than a confirmed reversal.", "related": ["Market Reaction to Mandatory Nonfinancial Disclosure", "Customer base environmental disclosure and supplier greenhouse gas emissions: A signaling theory perspective"], "keywords": ["scope 3 disclosure", "mandatory climate reporting", "regulatory uncertainty", "supplier emissions"], "datasets": ["cdp"], "thread": null}, {"n": 3, "id": "2026-10-14#3", "headline": "Cyberattack on Danfoss refrigeration controllers hits ~700 French supermarkets, forcing food disposal", "theme": "Supply Chain Resilience", "source": "Food Manufacturing", "summary": "France's finance minister said on 13 Oct 2026 that cyberattacks disrupted refrigeration systems at about 700 of the country's 10,000 supermarkets, including stores of Coopérative U (80 of 2,000 stores, some of which discarded food), Carrefour and Monoprix. Danish supplier Danfoss said most affected systems were older products no longer receiving security updates. The Paris prosecutor's cybercrime unit is investigating losses from spoiled food and possible fires. Separately, and not linked by AP, Ahold Delhaize is restoring systems it shut down after a 'security issue.'", "rq": "How do the age of a retailer's installed equipment and vendor end-of-support policies affect its exposure to cyber-physical disruptions and the resulting perishable inventory losses?", "problem": "This is a cyber-physical disruption in which one vendor's unsupported legacy equipment became a common-mode failure across competing retailers' cold chains. It ties together IT supplier concentration, equipment lifecycle and support policy, and perishable inventory risk.", "related": ["Strange Dance Partners: Supply Chain Cyberattacks and Chained Vulnerability", "Impact of cybersecurity on operations and supply chain management: Emerging trends and future research directions"], "keywords": ["cyber-physical risk", "cold chain", "vendor end-of-support", "common-mode failure", "perishable inventory"], "datasets": ["reprisk", "gdelt"], "thread": null}, {"n": 4, "id": "2026-10-14#4", "headline": "Rystad: battery storage is most exposed under US executive order restricting Chinese grid equipment", "theme": "Trade & Industrial Policy", "source": "Review Energy", "summary": "Executive Order 14421 (26 Aug 2026) restricts foreign grid equipment that poses a national-security risk, citing AI and data-center growth. It covers transformers, inverters, battery storage, breakers, turbines and UPS batteries at critical infrastructure. Rystad finds China supplied 50% of US lithium-ion battery imports by value in the 12 months to June 2026, against 3% for transformers and under 1% for breakers; the next-largest battery suppliers are South Korea (15%) and Japan (13%). Implementing rules due by 24 Dec 2026 will define 'Covered Foreign Entity', and a broad definition could also catch Korean or Mexican plants that use Chinese components or capital.", "rq": "How does a sourcing restriction's impact on project costs and delays depend on prior supplier concentration, comparing batteries (50% from China) with transformers and breakers (diversified)?", "problem": "Because the shock varies sharply by equipment category, it is well suited to studying supplier diversification capacity and the pass-through to energy-storage deployment costs and timelines, including for data centers' backup power.", "related": ["Product safety and security in the global supply chain: Issues, challenges and research opportunities"], "keywords": ["supplier concentration", "battery storage", "foreign entity of concern", "sourcing restrictions", "supplier diversification"], "datasets": ["usitc_dataweb", "eia860"], "thread": null}, {"n": 5, "id": "2026-10-14#5", "headline": "Mexican heavy-truck exports up 145% in September as US buyers pre-buy ahead of 2027 EPA standards", "theme": "Logistics Decarbonization", "source": "FreightWaves", "summary": "Mexico exported 12,707 heavy-duty vehicles in September 2026, up 144.6% year on year, while production rose to 15,181 from 6,857 (INEGI data presented by ANPACT). Domestic retail sales fell 11.3%, the eighth straight monthly decline, and no electric or natural-gas trucks were produced or exported. ANPACT attributes the surge to US customers ordering ahead of EPA emissions standards scheduled for 2027. A 25% US truck tariff takes effect 1 Nov, and part of the jump reflects a weak September 2025 comparison.", "rq": "How large is the regulation-induced pre-buy of heavy trucks ahead of the 2027 EPA standards, and how much does the subsequent demand trough offset the rule's near-term emissions benefits?", "problem": "Pre-buying ahead of a stricter standard pulls forward fleet replacement with older-technology diesel trucks, which can delay the emissions gains the rule targets. The case links regulatory timing to capacity and production planning across a cross-border supply chain.", "related": ["Accelerating vehicle fleet turnover to achieve sustainable mobility goals", "Compliance Strategies under Permits for Emissions"], "keywords": ["pre-buy behavior", "fleet turnover", "emissions standards", "cross-border trucking", "nearshoring logistics"], "datasets": ["usitc_dataweb", "bts_transborder"], "thread": null}], "papers": [{"title": "Modeling collective action in POM: The Strategy–Operations–People framework", "journal": "Production and Operations Management", "url": "https://doi.org/10.1177/10591478261489977"}, {"title": "Comment Letters, Connected Investors, and Corporate Bond Issuance", "journal": "Management Science", "url": "https://doi.org/10.1287/mnsc.2024.07607"}], "also": [{"title": "FERC approves Duke large load transmission rules despite cost-shift concerns", "url": "https://www.utilitydive.com/news/ferc-duke-energy-large-load-tariff-nitsa/832847/", "source": "Utility Dive"}, {"title": "Drought-Driven Low Rhine Water Levels Disrupt European Grain and Feed Supply Chains", "url": "https://news.google.com/rss/articles/CBMisAFBVV95cUxNVWo0Ty1iMy1zd1NJTFc4aWx6dlN5MWdOS2V0WkVYUUotOEJWOG1VTXVfUkY0SkZGTzlTU3NqUS1HT3lqOWZUX1B2dFhsMVJsaW1hZDRmcGdsWlItbjRvRUVuYnQzNG9PSDJlWHV0bzJUMzZrTG0tUGdnWVAwOHZfZVJVY3FMLUNIbWEybm9aZkZiSHhGa0hjc2JiTktrUlpaRENsZlBCTjN0TTNTTjIzeg?oc=5", "source": "CMB News"}, {"title": "Nigeria risks $1bn export loss over EU deforestation rules —NEPC", "url": "https://news.google.com/rss/articles/CBMimwFBVV95cUxQNWc1QTBXSlZRaThGeVBmd3pWYmNxSDZlcG16SUktTUlIZHV4Y1hCa1NXMTFVc2EtTld4LXN4cEg5ZlNXaV9DRnIzZjQxYmI5Y2hMX3FsU2RSWFc5Rkw4eFo2eE92cExGaGlBMG5YbmhxNnFMMGR0bWhYWVUxLWFXLWNORG0tUkNXZ2tkUWRTRVA1Sm12N0MxQWxSNA?oc=5", "source": "Tribune Online"}, {"title": "Pro Disposal receives ‘multimillion dollar’ MRF loan from Closed Loop", "url": "https://www.wastedive.com/news/pro-disposal-loan-closed-loop-partners-for-pennsylvania-mrf-equipment/832843/", "source": "Waste Dive"}, {"title": "TrusTrace launches new report: More than one in five fashio
