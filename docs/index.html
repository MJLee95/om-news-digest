<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Clippings Archive</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#dcdad3;--accent:#1f6f5c;--chip:#ebe9e2;--chip-on:#1d1d1b;--chip-on-ink:#f4f3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615}}
:root[data-theme="dark"]{--bg:#161615;--card:#20201e;--ink:#ecebe6;--muted:#9c9a93;--line:#34332f;--accent:#6fc2a8;--chip:#2b2a27;--chip-on:#ecebe6;--chip-on-ink:#161615}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:0}
.sub{color:var(--muted);margin:4px 0 20px}
a{color:inherit}
.layout{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:16px}
@media (max-width:760px){aside{position:static}}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
details{margin-top:18px}
summary{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";font-size:11px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary .n{margin-left:auto;letter-spacing:0;text-transform:none}
details .chips{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--ink);font:13px/1.4 inherit;cursor:pointer}
.chip:hover{outline:1px solid var(--muted)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip small{color:var(--muted);margin-left:3px}
.chip.on small{color:inherit;opacity:.7}
.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font:inherit;font-size:13px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;min-height:28px}
.bar strong{font-size:17px}
.clear{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;padding:3px 8px;font:inherit;font-size:13px}
.day{background:var(--card);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.day h3{margin:0 0 4px;font-family:Georgia,serif;font-size:19px}
.day h3 a{text-decoration:none}
.day .intro{color:var(--muted);font-size:14px;margin:0 0 10px}
.row{display:block;padding:9px 0;border-top:1px solid var(--line);text-decoration:none}
.row:hover .hl{text-decoration:underline}
.meta{font-size:12px;color:var(--muted)}
.theme{font-weight:600;color:var(--accent)}
.hl{font-weight:600}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kw .chip{font-size:11px;padding:2px 8px}
.snip{font-size:13px;color:var(--muted);margin-top:3px}
.paper{font-size:13px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line)}
.empty{color:var(--muted);padding:24px 0}
mark{background:#f2dc8a;color:#1d1d1b;border-radius:2px}
</style></head>
<body><div class="wrap">
<h1>Daily Clippings</h1>
<div class="sub" id="stats"></div>
<div class="layout">
<aside>
  <input type="search" id="q" placeholder="Search headlines, summaries, questions" aria-label="Search">
  <details id="themeBox" open><summary>Themes<span class="n" id="nThemes"></span></summary><div class="chips" id="themes"></div></details>
  <details id="kwBox"><summary>Keywords<span class="n" id="nKw"></span></summary><div class="chips" id="keywords"></div>
  <button class="more" id="moreKw" hidden></button></details>
</aside>
<main>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
</main>
</div></div>
<script id="data" type="application/json">[{"date": "2026-10-13", "intro": "Today's issue leads with two data center power stories. FERC rejected most of PJM's large-load interconnection plan but approved a new data center registry, and utilities are using collateral rules to weed out speculative 'phantom' requests. Also covered: Taylor Farms' seasonal sourcing pullback from central Mexico, a driver-visa shock to cross-border trucking, and an Oregon packaging EPR lawsuit paused pending a Ninth Circuit appeal.", "items": [{"n": 1, "headline": "FERC rejects PJM's curtailment-based large-load interconnection plan, approves data center registry", "theme": "Energy & AI Data Centers", "source": "Utility Dive", "summary": "On Oct. 9, 2026, FERC rejected the core of PJM's plan for connecting data centers and other large loads (accession no. 20261009-3055). The rejected Interim Resource Adequacy Service (IRAS) would have let large loads connect without matching new capacity if they accepted curtailment ahead of grid emergencies. FERC found it intruded on state authority over retail rates and appeared to discriminate against large loads, but it approved PJM's large-load definition and a registry of each facility's location, ramp schedule and capacity supply. Jefferies expects PJM capacity prices to stay higher for longer and any revival to be state-led, with Ohio and Pennsylvania the ones to watch; the ruling follows FERC's rejection about five weeks earlier of key parts of PJM's backstop procurement auction.", "rq": "How does excluding interruptible large loads from capacity-market demand curves affect procurement levels, prices and reliability outcomes, compared with requiring matched new capacity?", "related": ["Electricity Time‐of‐Use Tariff with Stochastic Demand"], "keywords": ["capacity markets", "interruptible load", "interconnection policy", "data center electricity demand", "federal-state jurisdiction"]}, {"n": 2, "headline": "Utilities use collateral, deposits and longer contracts to filter speculative 'phantom' data center power requests", "theme": "Energy & AI Data Centers", "source": "WSJ", "summary": "According to a Breitbart write-up of a paywalled WSJ report (figures not verified against the WSJ text), Wood Mackenzie rates only 23% of disclosed data center power requests as high confidence. Large-customer requests to Exelon tripled to 18,000 MW. After Exelon required binding commitments and collateral, its high-probability list fell to 11,000 MW, backed by about $1 billion in posted collateral. In Texas, the connection queue exceeds 400,000 MW, large customers now pay a $50,000/MW study deposit, and minimum large-customer contract terms nationally average about 10.8 years versus about 4.6 before 2024 (per Halcyon); Vistra's CEO says demand estimates are overstated by more than 20 times.", "rq": "How much do collateral and deposit requirements reduce queue attrition and forecast error in utility large-load pipelines, and how do they shift which project types (e.g., hyperscaler vs. speculative developer) stay in the queue?", "related": ["Capacity Reservation and Wholesale Price Contracts under Forecast Sharing: A Behavioral Assessment"], "keywords": ["interconnection queues", "demand signaling", "collateral requirements", "capacity investment under uncertainty", "load forecasting"]}, {"n": 3, "headline": "Taylor Farms halts May–August central Mexico lettuce sourcing after a Cyclospora outbreak linked to nearly 13,000 cases", "theme": "Supply Chain Resilience", "source": "Supply Chain Dive", "summary": "In an Oct. 8 letter, Taylor Farms CEO Bruce Taylor said the company will indefinitely stop harvesting or processing central Mexico iceberg lettuce for the U.S. and Canada during the CDC's Cyclospora season (May 1–Aug. 31), which coincides with the region's rainy season. Cases linked to Taco Bell or to recalled Taylor Farms lettuce reached nearly 13,000 this summer. The FDA closed its investigation on Oct. 2 without establishing the contamination route, though it said traceback evidence pointed to shredded iceberg lettuce from Taylor Farms de Mexico. The company is also expanding water and crop testing, funding detection research and joining an FDA-led task force.", "rq": "After a major outbreak, do produce buyers reallocate sourcing away from implicated regions only during high-risk seasons, and how does that affect import volumes, prices and subsequent outbreak or recall rates?", "related": ["Learning from Conformance Quality Failures That Triggered Product Recalls: The Role of Direct and Indirect Experience", "Product safety and security in the global supply chain: Issues, challenges and research opportunities"], "keywords": ["food safety recalls", "seasonal sourcing", "produce supply chains", "traceback", "supplier region risk"]}, {"n": 4, "headline": "FreightWaves: revocation of about 25,000 Mexican drivers' B-1 visas tightens US–Mexico border trucking capacity", "theme": "Trade & Industrial Policy", "source": "FreightWaves", "summary": "FreightWaves reports that U.S. authorities have revoked B-1 visas for about 25,000 Mexican truck drivers; the revoking agency and the timing were not stated, and the figure is unverified. SONAR data show El Paso tender rejections peaking at about 24–25% in early July and still near 20%, San Diego/Otay Mesa at about 10% versus 3.9% a year ago, and Laredo rising from 6.07% (Oct. 3) to 7.78% (Oct. 10). Year-over-year spot rates are up 57% on San Diego–Phoenix and 43% on Laredo–Dallas. Mexico freight volumes are fairly stable, so FreightWaves attributes the pressure to lost driver supply and expects tight conditions to last well into 2027.", "rq": "How does a sudden loss of cross-border driver capacity pass through to tender rejections, spot-contract rate spreads and shippers' mode or port-of-entry substitution (e.g., rail, transloading)?", "related": ["Estimating the Operational Impact of Container Inspections at International Ports", "Shock and Awe: <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.flatMap(d => d.items.map(it => ({...it, date: d.date})));
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const link = it => `issues/${it.date}.html#item-${it.n}`;
let state = {kind: null, tag: null, q: ''}, showAllKw = false;
const NARROW = matchMedia('(max-width:760px)'), KW_TOP = () => NARROW.matches ? 12 : 30;

function counts(key) {
  const m = new Map();
  ITEMS.forEach(it => [].concat(it[key]).forEach(v => m.set(v, (m.get(v) || 0) + 1)));
  return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const THEMES = counts('theme'), KEYWORDS = counts('keywords');

function chip(kind, v, n) {
  const on = state.kind === kind && state.tag === v;
  return `<button class="chip${on ? ' on' : ''}" data-kind="${kind}" data-tag="${esc(v)}">${esc(v)}${n ? `<small>${n}</small>` : ''}</button>`;
}

function renderSide() {
  $('themes').innerHTML = THEMES.map(([v, n]) => chip('theme', v, n)).join('');
  const kws = showAllKw ? KEYWORDS : KEYWORDS.slice(0, KW_TOP());
  $('keywords').innerHTML = kws.map(([v, n]) => chip('keywords', v, n)).join('');
  $('moreKw').hidden = KEYWORDS.length <= KW_TOP();
  $('moreKw').textContent = showAllKw ? 'Show fewer' : `Show all ${KEYWORDS.length}`;
}

function hi(s) {
  if (!state.q) return esc(s);
  const re = new RegExp('(' + state.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(s).replace(re, '<mark>$1</mark>');
}

function row(it, withDate) {
  const kw = it.keywords.map(k => chip('keywords', k)).join('');
  return `<div class="row"><a href="${link(it)}" style="text-decoration:none">
    <div class="meta">${withDate ? fmt(it.date) + ' · ' : ''}<span class="theme">${esc(it.theme)}</span> · ${esc(it.source)}</div>
    <div class="hl">${hi(it.headline)}</div>
    ${state.q ? `<div class="snip">${hi(it.summary)}</div>` : ''}</a>
    <div class="kw">${kw}</div></div>`;
}

function renderMain() {
  const q = state.q.toLowerCase();
  if (state.tag || q) {
    const hits = ITEMS.filter(it =>
      (!state.tag || [].concat(it[state.kind]).includes(state.tag)) &&
      (!q || (it.headline + ' ' + it.summary + ' ' + it.rq + ' ' + it.keywords.join(' ') + ' ' + (it.related || []).join(' ')).toLowerCase().includes(q)))
      .sort((a, b) => b.date.localeCompare(a.date) || a.n - b.n);
    const label = [state.tag && `“${esc(state.tag)}”`, q && `search “${esc(state.q)}”`].filter(Boolean).join(' + ');
    $('bar').innerHTML = `<strong>${label}</strong><span class="meta">${hits.length} article${hits.length === 1 ? '' : 's'}</span><button class="clear" id="clear">Clear</button>`;
    $('list').innerHTML = hits.length ? `<div class="day">${hits.map(it => row(it, true)).join('')}</div>` : '<div class="empty">No matching articles.</div>';
    $('clear').onclick = () => { state = {kind: null, tag: null, q: ''}; $('q').value = ''; update(); };
  } else {
    $('bar').innerHTML = `<strong>All issues</strong><span class="meta">newest first</span>`;
    $('list').innerHTML = DATA.length ? DATA.map(d => `<section class="day">
      <h3><a href="issues/${d.date}.html">${fmt(d.date)}</a></h3>
      <p class="intro">${esc(d.intro)}</p>
      ${d.items.map(it => row({...it, date: d.date}, false)).join('')}
      ${d.papers.map(p => `<div class="paper">📄 <a href="${esc(p.url)}">${esc(p.title)}</a> — ${esc(p.journal)}</div>`).join('')}
    </section>`).join('') : '<div class="empty">No issues yet.</div>';
  }
}

function update() {
  const h = state.tag ? `#${state.kind === 'theme' ? 'theme' : 'tag'}=${encodeURIComponent(state.tag)}` : ' ';
  history.replaceState(null, '', h === ' ' ? location.pathname : h);
  renderSide(); renderMain();
}

document.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  e.preventDefault();
  const {kind, tag} = c.dataset;
  state = state.tag === tag && state.kind === kind ? {...state, kind: null, tag: null} : {...state, kind, tag};
  update(); (NARROW.matches ? $('bar') : document.body).scrollIntoView({behavior: 'smooth'});
});
$('moreKw').onclick = () => { showAllKw = !showAllKw; renderSide(); };
$('q').oninput = e => { state.q = e.target.value.trim(); renderMain(); };

const m = location.hash.match(/^#(tag|theme)=(.+)$/);
if (m) state = {kind: m[1] === 'theme' ? 'theme' : 'keywords', tag: decodeURIComponent(m[2]), q: ''};
$('kwBox').open = !NARROW.matches;
$('nThemes').textContent = THEMES.length; $('nKw').textContent = KEYWORDS.length;
$('stats').textContent = `${DATA.length} issue${DATA.length === 1 ? '' : 's'} · ${ITEMS.length} articles · ${KEYWORDS.length} keywords`;
update();
</script>
</body></html>
