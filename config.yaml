# OM Research News Digest 설정 파일
# 이 파일만 고치면 주제, 소스, 개수를 바꿀 수 있어요.

digest:
  title: "Daily Clippings"   # 메일 제목·아카이브 이름
  byline: "A personal project by Minjae Lee"   # 아카이브 제목 아래 한 줄
  num_news: 5            # 하루에 받을 뉴스 개수
  num_also: 5            # "Also worth noting" (제목+링크만) 개수
  num_papers: 2          # "New in the journals" 섹션 논문 개수 (새 논문이 있을 때만)
  academic_weekdays: [0,1,2,3,4,5,6] # 신규 논문 섹션을 넣을 요일 (0=월 ... 6=일)
  lookback_hours: 36     # 이 시간 안에 나온 기사만 후보로 사용
  paper_lookback_days: 7
  timezone: "America/New_York"
  archive_url: "https://mjlee95.github.io/om-news-digest/"  # 아카이브 사이트 (메일 하단에 링크)

# GitHub 저장소 (★ 기능이 이 저장소의 issue를 사용합니다)
github_repo: "MJLee95/om-news-digest"

llm:
  model: "claude-opus-5-5"
  effort: "medium"        # low | medium | high — 높을수록 꼼꼼하지만 비쌈
  web_search_max_uses: 8  # 기사 원문/사실 확인용 검색 횟수 상한
  web_fetch_max_uses: 6
  web_fetch_max_content_tokens: 5000  # 기사 1건당 읽는 최대 분량 (비용에 가장 큰 영향)

# 큐레이션 기준. Claude가 기사를 고를 때 그대로 읽습니다.
research_profile: |
  Reader: first-year PhD student in Operations Management at a US business school.
  Core interests: sustainable operations, ESG (disclosure, ratings, regulation), supply chain
  resilience and disruption, energy systems and the energy/power demand of AI data centers.
  Advisor works on circular economy (remanufacturing, recycling, reuse, product take-back, EPR,
  packaging, waste) — give these a modest bonus, but keep the mix broad.
  Prefer stories that could seed empirical or analytical OM research: new regulations or policy
  shocks (natural experiments), supply disruptions and firm responses, notable operational
  decisions by firms (sourcing, reshoring, inventory, capacity, siting), new public datasets or
  disclosures, and quantified trends. Avoid press releases, product announcements with no
  operational substance, opinion pieces, and duplicate coverage of the same event.

# Google News 검색어 (영어). when:1d 등은 코드가 자동으로 붙입니다.
google_news_queries:
  - '"supply chain" (disruption OR resilience OR reshoring OR nearshoring)'
  - 'tariffs supply chain sourcing shift'
  - 'ESG regulation (CSRD OR CSDDD OR "climate disclosure" OR "SB 253")'
  - '"scope 3" emissions suppliers'
  - '"circular economy" OR remanufacturing OR "extended producer responsibility"'
  - '"data center" (electricity OR power OR grid OR energy) demand'
  - 'AI data center power utility interconnection'
  - '"forced labor" supply chain (UFLPA OR due diligence)'
  - 'critical minerals supply chain (lithium OR cobalt OR "rare earth")'
  - '"deforestation regulation" OR EUDR'
  - '(heatwave OR flood OR hurricane OR drought) (factory OR plant OR port OR "supply chain") disruption'
  - 'climate adaptation infrastructure (utility OR manufacturer OR logistics)'
  - 'battery (recycling OR supply chain OR gigafactory)'
  - '(shipping OR trucking OR freight) (decarbonization OR emissions OR "electric truck" OR "green fuel")'
  - '"food waste" OR "food loss" OR "food supply chain"'
  - '(crop OR harvest OR livestock) (shortage OR prices) supply'

