name: Rebuild site

# Rebuild docs/ (no Claude calls, no email) when site-facing files are edited, e.g. about.md on github.com.
on:
  push:
    branches: [main]
    paths:
      - "about.md"
      - "config.yaml"
      - "datasets.yaml"
      - "digest/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

concurrency:
  group: digest              # same group as the daily/weekly runs so commits never collide
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild archive site
        run: python -m digest.archive
      - name: Commit site
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Rebuild site"
          git pull --rebase
          git push
