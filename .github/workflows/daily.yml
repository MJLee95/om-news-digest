name: Daily digest

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC = 6:30 AM EDT / 5:30 AM EST
  workflow_dispatch: {}      # GitHub Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # data/ 아카이브를 커밋하기 위해 필요

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: python run.py
      - name: Commit archive
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git push
