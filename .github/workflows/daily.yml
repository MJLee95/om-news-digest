name: Daily digest

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 6:17 AM EDT / 5:17 AM EST (GitHub may start it several minutes late)
    - cron: "47 11 * * *"   # 예비: 첫 실행이 밀리거나 빠진 날만 보냄 (이미 보냈으면 바로 종료)
  workflow_dispatch: {}      # GitHub Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # data/, docs/ 아카이브 커밋
  issues: read               # ★ (star 라벨 issue) 읽기

concurrency:
  group: digest              # daily/weekly가 동시에 커밋하지 않도록 같은 그룹
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send digest
        run: python run.py
      - name: Commit archive
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git pull --rebase
          git push
      - name: Email failure alert
        if: failure()
        env:
          JOB_LABEL: Daily digest
        run: python notify_failure.py
