name: Weekly review

on:
  schedule:
    - cron: "0 13 * * 0"     # 일요일 13:00 UTC = 9:00 AM EDT / 8:00 AM EST
  workflow_dispatch: {}      # GitHub Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # data/, docs/ 아카이브 커밋
  issues: read               # ★ (star 라벨 issue) 읽기

concurrency:
  group: digest              # daily/weekly가 동시에 커밋하지 않도록 같은 그룹
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send weekly review
        run: python run_weekly.py
      - name: Commit archive
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Weekly review $(date -u +%F)"
          git pull --rebase
          git push
      - name: Email failure alert
        if: failure()
        env:
          JOB_LABEL: Weekly review
        run: python notify_failure.py
